    cx.fillStyle = "rgba(4,8,18,0.72)"; cx.fillRect(0, 0, W, H);
    text("THE DEMO ENDS HERE", W / 2, 190, 38, COL.gold, "center", 700, SERIF);
    var y = wrap("Maple Street is open and the school bus got through. The full game has four more districts - Old Town's parked cars, Hillside's ice, the County Airport's 5 AM flight and the avalanches on Pass Road - with the snowblower, the wing plow, salt and a whole crew of trucks.", W / 2, 260, 780, 18, COL.text, 28, 600, "center");
    button(W / 2 - 170, y + 36, 340, 56, "GET THE FULL GAME", openStore, { primary: true, size: 18 });
    button(W / 2 - 100, y + 104, 200, 42, "KEEP PLOWING", function () { screen = "garage"; pickD = 0; }, { size: 13 });
    followLine(H - 60);
  }
  
  function drawWon() {
    drawBackdrop();
    cx.fillStyle = "rgba(4,8,18,0.66)"; cx.fillRect(0, 0, W, H);
    text("THE COUNTY IS CLEAR", W / 2, 220, 44, COL.gold, "center", 700, SERIF);
    wrap(g.nights + " nights behind the blade, $" + g.total + " earned. Every district opened, the summit road included. The snow will be back tomorrow - and so will you.", W / 2, 300, 720, 18, COL.text, 28, 600, "center");
    button(W / 2 - 110, 430, 220, 50, "TO THE GARAGE", function () { screen = "garage"; }, { primary: true });
    followLine(H - 60);
  }

  // ---------------- main loop and input ----------------
  var lastT = performance.now();
  function frame(nowT) {
    var dt = Math.min(0.05, (nowT - lastT) / 1000); lastT = nowT;
    buttons = [];
    cx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
    ambient();
    if (screen === "title") drawTitle();
    else if (screen === "night") drawNight(dt);
    else if (screen === "garage") drawGarage();
    else if (screen === "won") drawWon();
    else if (screen === "demoend") drawDemoEnd();
    requestAnimationFrame(frame);
  }
  function resize() {
    var vw = window.innerWidth, vh = window.innerHeight;
    scale = Math.min(vw / W, vh / H); dpr = window.devicePixelRatio || 1;
    cv.style.width = Math.floor(W * scale) + "px"; cv.style.height = Math.floor(H * scale) + "px";
    cv.width = Math.floor(W * scale * dpr); cv.height = Math.floor(H * scale * dpr);
  }
  window.addEventListener("resize", resize); resize();
  function local(e) { var r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H }; }
  cv.addEventListener("contextmenu", function (e) { e.preventDefault(); });
  cv.addEventListener("pointermove", function (e) { var m = local(e); mouse.x = m.x; mouse.y = m.y; });
  cv.addEventListener("pointerdown", function (e) {
    var m = local(e); mouse.x = m.x; mouse.y = m.y; cv.focus(); audio();
    for (var i = buttons.length - 1; i >= 0; i--) { var b = buttons[i]; if (m.x >= b.x && m.x <= b.x + b.w && m.y >= b.y && m.y <= b.y + b.h) { sfx("ui"); b.fn(); return; } }
  });
  window.addEventListener("keydown", function (e) {
    var k = e.key.toLowerCase(); keys[k] = true; audio();
    if (["arrowup", "arrowdown", "arrowleft", "arrowright", " "].indexOf(k) >= 0) e.preventDefault();
    if (screen === "night" && run && !dawn) {
      if (k === "escape" || k === "p") { if (helpOpen) helpOpen = false; else paused = !paused; }
      else if (k === " " && !paused && !helpOpen) { P.setBlade(run, run.player, !run.player.down); sfx("blade"); }
      else if (k === "f" && run.s.salt) { salting = !salting; flash(salting ? "Salting on" : "Salting off", COL.dim); }
      else if (k === "m") showMap = !showMap;
    } else if (screen === "night" && dawn && (k === "enter") && dawn.t > 0.8) afterDawn("garage");
    else if (k === "escape") helpOpen = false;
  });
  window.addEventListener("keyup", function (e) { keys[e.key.toLowerCase()] = false; });
  window.addEventListener("blur", function () { keys = {}; if (screen === "night" && run && !dawn) paused = true; });

  // hooks for the screenshot tool and tests
  window.PLOWLIGHT_APP = {
    edition: ED, game: function () { return g; }, run: function () { return run; }, setGame: function (str) { g = P.load(str); },
    start: function (di) { startNight(di); msg = null; }, screen: function (s) { if (s) screen = s; return screen; }, help: function (v) { helpOpen = v; }, settings: settings,
    hover: function (x, y) { mouse.x = x; mouse.y = y; }, pause: function (v) { paused = v; }, keys: keys, cam: cam, salting: function (v) { salting = v; },
    sim: function (sec, botPlay) { run.player.bot = !!botPlay; for (var t = 0; t < sec && !run.over; t += 1 / 30) { if (botPlay) P.autoDrive(run, run.player, 1 / 30, 1); P.step(run, 1 / 30); run.events.forEach(handle); run.events.length = 0; } cam.x = run.player.x; cam.y = run.player.y; },
    flash: flash, msgOff: function () { msg = null; }, pick: function (i) { pickD = i; }, zoom: function (z) { zoom = z; }, autopilot: function (v) { autopilot = v; }, hud: function (v) { hideHud = !v; }
  };
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
