  var K = { SAND: 0, PEBBLE: 1, BLACK: 2, GARNET: 3, FINE: 4, FLAKE: 5, NUGGET: 6 };
  var KINDS = [

    { id: "PEBBLE", name: "pebble", rho: 2.6, r: 0.034, gold: 0, gem: 0 },
    { id: "BLACK", name: "black sand", rho: 5.2, r: 0.009, gold: 0, gem: 0 },

  var CLAIMS = [
    { id: "WILLOW", name: "Willow Creek", mix: [80, 9, 9, 2], gold: [7, 2.2, 0.03], price: 1, goal: 800, day: 150, seed: 7, water: "warm",

  ];
  // the outfitter: bought with the day's take
  var UPGRADES = [
    { id: "PAN", name: "Bigger Pan", desc: "+15% gravel in every scoop.", max: 4, base: 80, grow: 1.9 },
    { id: "SHOVEL", name: "Better Shovel", desc: "Dig closer to bedrock: +12% gold in the gravel.", max: 5, base: 100, grow: 1.8 },
    { id: "SCREEN", name: "Classifier Screen", desc: "Sift out the pebbles before they go in the pan (-35% pebbles per level).", max: 2, base: 90, grow: 2.4 },
    { id: "RIFFLE", name: "Riffled Pan", desc: "Ridges in the pan catch heavy grains at the lip: gold washes out much less.", max: 3, base: 150, grow: 2.2 },
    { id: "SNUFFER", name: "Snuffer Bottle", desc: "Suck flakes out from under one more grain when you pick.", max: 2, base: 220, grow: 2.6 },
    { id: "MAGNET", name: "Magnet", desc: "Press Q to lift black sand off the top of the pan.", max: 3, base: 260, grow: 2.0 },
    { id: "LANTERN", name: "Lantern", desc: "+20 seconds of work before dark.", max: 3, base: 160, grow: 2.1 },
    { id: "SLUICE", name: "Sluice Box", desc: "Runs in the creek all day. At dusk you pan its concentrate. Longer box per level.", max: 4, base: 600, grow: 2.0 },

<script>
// pan.js — PANGLINT rules: the grains in the pan, swirling, tipping, washing, picking; days, claims, the outfitter.
// Deterministic: fixed steps, seeded random numbers. No DOM here.
(function (root) {
  "use strict";
  var C = (typeof module !== "undefined" && module.exports) ? require("./content.js") : root.CONTENT;
  var K = C.K, KINDS = C.KINDS;
  var RHO = KINDS.map(function (k) { return k.rho; }), RAD = KINDS.map(function (k) { return k.r; });
  var PILE = 6;  // each grain in the simulation stands for a handful of real ones, so the pile is several grains deep
  var AREA = RAD.map(function (r) { return Math.PI * r * r * PILE; });
  var HEAVY = RHO.map(function (p) { return 1 / (1 + (p - 2.65) * 0.25); });     // how easily water moves it
  var WASHK = RHO.map(function (p) { return 1 / (1 + (p - 2.65) * 0.45); });     // how easily water carries it over the lip
  var CELL = 0.07, GN = Math.ceil(2 / CELL), CELLA = CELL * CELL;
  var LIP = 0.80, STEP = 1 / 60, FLOAT_AT = 0.4;
  var COLD = { warm: 1, fast: 1.3, cold: 1.8 };
  var FLOATS = KINDS.map(function (k) { return k.id === "FINE" ? 0.95 : k.id === "FLAKE" ? 0.45 : 0; });

  function rng(seed) {
    var s = (seed >>> 0) || 1;
    return function () { s = (s + 0x6D2B79F5) >>> 0; var t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  }
  function gauss(r) { return (r() + r() + r() - 1.5) * 1.15; }
  function poisson(r, mean) { // small means only
    if (mean <= 0) return 0;
    if (mean > 30) return Math.max(0, Math.round(mean + gauss(r) * Math.sqrt(mean)));
    var L = Math.exp(-mean), k = 0, p = 1;
    do { k++; p *= r(); } while (p > L);

  }

  // ---------- the game and the outfitter ----------
  function newGame(opts) {
    opts = opts || {};
    return { v: 1, seed: opts.seed || 1, money: 0, ups: {}, claim: 0, open: 1, got: C.CLAIMS.map(function () { return 0; }), day: 0, best: 0, total: 0, done: false, glintDue: false };
  }
  function lv(g, id) { return g.ups[id] || 0; }
  function cost(g, id) { var u = C.UPGRADE[id], l = lv(g, id); return l >= u.max ? Infinity : Math.round(u.base * Math.pow(u.grow, l)); }
  function canBuy(g, id) { return g.money >= cost(g, id); }
  function buy(g, id) { if (!canBuy(g, id)) return false; g.money -= cost(g, id); g.ups[id] = lv(g, id) + 1; return true; }
  function stats(g) {
    return {
      cap: 1 + 0.15 * lv(g, "PAN"),
      rich: 1 + 0.12 * lv(g, "SHOVEL"),
      pebbles: Math.pow(0.65, lv(g, "SCREEN")),
      riffle: Math.pow(0.6, lv(g, "RIFFLE")),
      pick: 0.10 + 0.55 * lv(g, "SNUFFER"),
      magnet: lv(g, "MAGNET"),
      dayPlus: 20 * lv(g, "LANTERN"),
      sluice: lv(g, "SLUICE"),
      partners: lv(g, "PARTNER"),
      assay: 1 + 0.08 * lv(g, "ASSAY")
    };
  }
  function price(g, ci) { return C.CLAIMS[ci].price * stats(g).assay; }

  // ---------- one pan of gravel ----------
  function scoop(g, ci, r, extra) {
    var cl = C.CLAIMS[ci], s = stats(g), mix = cl.mix, tot = mix[0] + mix[1] + mix[2] + mix[3];
    var n0 = C.GRAINS * s.cap, list = [];
    function add(k, n) { for (var i = 0; i < n; i++) list.push(k); }
    add(K.SAND, Math.round(n0 * mix[0] / tot));
    add(K.PEBBLE, Math.round(n0 * mix[1] / tot * s.pebbles / 3));    // pebbles are big: fewer of them
    add(K.BLACK, Math.round(n0 * mix[2] / tot));
    add(K.GARNET, poisson(r, n0 * mix[3] / tot / 4));
    add(K.FINE, poisson(r, cl.gold[0] * s.cap * s.rich));
    add(K.FLAKE, poisson(r, cl.gold[1] * s.cap * s.rich));
    add(K.NUGGET, r() < cl.gold[2] * s.cap * s.rich ? 1 : 0);
    if (extra) extra(list, r);
    var p = makePan(list, r, s); p.cold = COLD[cl.water] || 1; return p;
  }
  function makePan(list, r, s) {
    var n = list.length, p = {
      n: n, k: new Uint8Array(n), x: new Float32Array(n), y: new Float32Array(n), z: new Float32Array(n), d: new Float32Array(n), alive: new Uint8Array(n),
      tx: 0, ty: 0, shake: 0, water: 1, dip: 0, magCool: 0, t: 0, r: r, s: s, events: [], lostGold: 0, washed: 0,
      goldIn: 0, gemIn: 0, glint: -1, cold: 1, light0: 0

    for (var i = 0; i < n; i++) {
      var a = r() * Math.PI * 2, rr = Math.sqrt(r()) * 0.62;
      p.k[i] = list[i]; p.x[i] = Math.cos(a) * rr - 0.08; p.y[i] = Math.sin(a) * rr * 0.9 + 0.05; p.z[i] = r(); p.alive[i] = 1;

  }
  // depth of every grain below the surface, in grain layers (area above it / cell area), from a grid of cells.
  var cells = [];
  function layer(p) {

    for (c = 0; c < GN * GN; c++) if (cells[c]) cells[c].length = 0;

      var acc = 0;
      for (var j = 0; j < L.length; j++) { p.d[L[j]] = acc / CELLA; acc += AREA[p.k[L[j]]]; }

  // inp: { tx, ty: tip (mouse offset, |t| <= 1), shake: 0..1, dip: true to dip in the creek, magnet: true }
  function step(p, inp, dt) {

    var r = p.r, i;
    if (inp && inp.dip && p.dip <= 0) { p.dip = 0.7; p.events.push({ e: "dip" }); for (i = 0; i < p.n; i++) if (p.alive[i]) p.z[i] += (r() - p.z[i]) * 0.35 * HEAVY[p.k[i]]; }
    var busy = p.dip > 0;

    var tx = busy ? 0 : (inp ? inp.tx || 0 : 0), ty = busy ? 0 : (inp ? inp.ty || 0 : 0), m = Math.hypot(tx, ty);

    if (p.magCool > 0) p.magCool -= dt;
    if (inp && inp.magnet && p.s.magnet && p.magCool <= 0) magnet(p);
    var T = Math.hypot(p.tx, p.ty), ux = T > 1e-6 ? p.tx / T : 0, uy = T > 1e-6 ? p.ty / T : 0, A = p.shake, W = 0.35 + 0.65 * p.water;
    var load = layer(p), sq = Math.sqrt(dt);
    var cut = T < 0.1 ? -1 : (T - 0.1) * 3.4 * (0.5 + 0.5 * p.water);   // layers that water can reach at the lip
    var washRate = 5 * Math.pow(T, 1.4) * W;
    var floatAt = FLOAT_AT / Math.sqrt(p.cold);   // colder water lifts the gold sooner
    for (i = 0; i < p.n; i++) {
      if (!p.alive[i]) continue;
      var kk = p.k[i], rho = RHO[kk], depth = p.d[i];
      // swirling sorts the grains: heavy ones sink, big ones float up, everything jiggles
      if (A > 0.01) {
        var drift = (3.0 - rho) / 16 + (RAD[kk] - 0.011) * 14;

        if (p.z[i] < 0) p.z[i] = 0; else if (p.z[i] > 1) p.z[i] = 1;
      }

        p.z[i] += (T - floatAt) * dt * 14 * p.water * (kk === K.FINE ? 1 : 0.3) * p.cold;
        if (p.z[i] > 1) p.z[i] = 1;
      }
      // water and the tip move what is near the surface
      var fl = FLOATS[kk] * p.z[i] * p.z[i];          // gold lifted near the surface rides the water
      var mob = W * (HEAVY[kk] + (1 - HEAVY[kk]) * fl) / (1 + depth * 0.9);
      var cx = Math.min(GN - 1, Math.max(0, ((p.x[i] + 1) / CELL) | 0)), cy = Math.min(GN - 1, Math.max(0, ((p.y[i] + 1) / CELL) | 0));
      var gx = (load[cy * GN + Math.max(0, cx - 1)] - load[cy * GN + Math.min(GN - 1, cx + 1)]);
      var gy = (load[Math.max(0, cy - 1) * GN + cx] - load[Math.min(GN - 1, cy + 1) * GN + cx]);
      var spread = 0.05 * (0.3 + A) / (1 + depth);
      var vx = p.tx * 0.75 * mob + gx * spread, vy = p.ty * 0.75 * mob + gy * spread;
      // riffles: ridges near the lip that heavy grains catch behind

      p.x[i] += vx * dt + A * sq * 0.035 * gauss(r) * HEAVY[kk];

      if (cut > 0 && dist > LIP && (p.x[i] * ux + p.y[i] * uy) > LIP * 0.86 && depth < cut) {
        var wk = (WASHK[kk] + (1 - WASHK[kk]) * fl) * (rho > 4 ? p.s.riffle : 1) * (1 - depth / cut);
        if (r() < washRate * wk * dt) { wash(p, i); continue; }
      }
      if (dist > lim) { p.x[i] *= lim / dist; p.y[i] *= lim / dist; }
    }
    p.water = Math.max(0, p.water - dt * 0.045 * T);
  }
  function wash(p, i) {
    p.alive[i] = 0; p.washed++;
    var kd = KINDS[p.k[i]];
    p.water = Math.max(0, p.water - 0.0012);
    if (kd.gold) { p.lostGold += kd.gold; p.events.push({ e: "lost", k: p.k[i], x: p.x[i], y: p.y[i] }); }
    else p.events.push({ e: "wash", k: p.k[i], x: p.x[i], y: p.y[i] });
  }
  function magnet(p) {
    var lvl = p.s.magnet, n = 0;
    layer(p);
    for (var i = 0; i < p.n; i++) if (p.alive[i] && p.k[i] === K.BLACK && p.d[i] < 0.6 * lvl && p.r() < 0.35 + 0.15 * lvl) { p.alive[i] = 0; n++; }
    p.magCool = 2.5; p.events.push({ e: "magnet", n: n });
    return n;
  }
  // what is left in the pan, by kind
  function census(p) {
    var c = KINDS.map(function () { return 0; }), gold = 0, light = 0;
    for (var i = 0; i < p.n; i++) if (p.alive[i]) { c[p.k[i]]++; gold += KINDS[p.k[i]].gold; if (p.k[i] === K.SAND || p.k[i] === K.PEBBLE) light++; }
    return { by: c, gold: gold, light: light };
  }
  // you can only pick once the pan is down to its concentrate
  var PICK_AT = 0.25;
  function canPick(p) { return census(p).light <= PICK_AT * Math.max(1, p.light0); }
  // pick: everything gold (and garnet) you can see is yours; whatever is still buried goes back in the creek.
  function finish(p) {
    layer(p);
    var res = { gold: 0, gem: 0, buried: 0, flakes: 0, glint: false, picked: [] };
    for (var i = 0; i < p.n; i++) {
      if (!p.alive[i]) continue;
      var kd = KINDS[p.k[i]];
      if (!kd.gold && !kd.gem) continue;
      if (p.d[i] <= p.s.pick) {
        res.gold += kd.gold; res.gem += kd.gem; if (kd.gold) res.flakes++;
        if (i === p.glint) res.glint = true;
        res.picked.push(i);
      } else if (kd.gold) res.buried += kd.gold;
    }
    res.recovery = p.goldIn ? res.gold / p.goldIn : 0;
    res.lost = p.lostGold;
    return res;
  }

  // ---------- a working day ----------
  function startDay(g, ci) {
    g.day++; g.claim = ci;
    var s = stats(g), cl = C.CLAIMS[ci];
    return { g: g, ci: ci, r: rng(g.seed * 7919 + g.day * 104729 + ci * 31), t: 0, len: cl.day + s.dayPlus, pans: 0, gold: 0, gem: 0, pan: null, results: [], over: false, cleanup: false };
  }
  function newPan(run) {
    var g = run.g, extra = null;
    if (g.glintDue && C.CLAIMS[run.ci].glint) extra = function (list) { list.push(K.NUGGET); };

    if (extra) run.pan.glint = run.pan.n - 1;
    return run.pan;
  }
  // the sluice box's concentrate: heavy, rich, and still full of black sand
  function cleanupPan(run) {
    var g = run.g, s = stats(g), cl = C.CLAIMS[run.ci], list = [], r = run.r, lvl = s.sluice;
    var hours = run.len / 150;
    function add(k, n) { for (var i = 0; i < n; i++) list.push(k); }
    add(K.SAND, Math.round(160 + 40 * lvl)); add(K.BLACK, Math.round(220 + 30 * lvl)); add(K.GARNET, poisson(r, cl.mix[3] * 1.5));

  }

    run.gold += res.gold; run.gem += res.gem; run.pans++; run.results.push(res);

    return res;
  }
  // dusk: partners report in, the assay office pays, the next claim may open

    var pg = partnerGold == null ? partnerTake(run) : partnerGold;
    var gold = run.gold + pg, pay = Math.round(gold * price(g, ci) + run.gem);
    g.money += pay; g.total += pay; g.got[ci] += gold;
    var opened = false;
    if (ci === g.open - 1 && g.got[ci] >= cl.goal && g.open < C.CLAIMS.length) { g.open++; opened = true; }
    if (cl.glint && g.got[ci] >= cl.goal && !g.glintFound) g.glintDue = true;
    if (g.glintFound) g.done = true;
    if (C.CLAIMS.length === 1 && g.got[0] >= cl.goal) g.done = true;
    run.over = true;
    run.summary = { gold: gold, own: run.gold, partners: pg, gem: run.gem, pay: pay, pans: run.pans, opened: opened, goal: cl.goal, got: g.got[ci], done: g.done, glint: !!g.glintFound };
    return run.summary;
  }

    var g = run.g, n = stats(g).partners;
    if (!n) return 0;
    var B = (typeof module !== "undefined" && module.exports) ? require("./bot.js") : root.BOT;
    var tot = 0;
    for (var i = 0; i < n; i++) {
      var r2 = rng(g.seed * 131 + g.day * 977 + i * 17), p = scoop(g, run.ci, r2), res = B.panOut(p, 0.8);
      var pans = Math.floor(run.len / Math.max(18, p.t + 2));

    }
    return Math.round(tot * 0.45);
  }
  function save(g) { return JSON.stringify(g); }
  function load(str) { var g = JSON.parse(str); if (!g || g.v !== 1 || typeof g.ups !== "object" || !Array.isArray(g.got)) throw new Error("not a PANGLINT save"); while (g.got.length < C.CLAIMS.length) g.got.push(0); return g; }

  var api = { rng: rng, newGame: newGame, lv: lv, cost: cost, canBuy: canBuy, buy: buy, stats: stats, price: price,
    scoop: scoop, makePan: makePan, layer: layer, step: step, finish: finish, census: census, magnet: magnet, canPick: canPick, PICK_AT: PICK_AT,
    startDay: startDay, newPan: newPan, cleanupPan: cleanupPan, closePan: closePan, endDay: endDay, partnerTake: partnerTake,
    save: save, load: load, STEP: STEP, LIP: LIP, FLOAT_AT: FLOAT_AT };

    followLine(H - 50);
  }
  function afterDusk(where) {
    var s = dusk.s; dusk = null;
    if (DEMO && s.done && !g.sawDemoEnd) { g.sawDemoEnd = true; persist(); screen = "demoend"; return; }
    if (!DEMO && s.glint && !g.sawWin) { g.sawWin = true; persist(); screen = "won"; return; }
    if (where === "again") startDay(run.ci); else { screen = "shop"; pickC = g.open - 1; }
  }
  function followLine(y) {
    var label = "Enjoying it? Follow Proven Little Games on itch.io for new games", w = tw(label, 13, 700) + 30, x = W / 2 - w / 2, on = hot(x, y - 15, w, 30);
    rr(x, y - 15, w, 30, 15); cx.fillStyle = on ? "rgba(90,74,50,0.95)" : "rgba(30,26,20,0.85)"; cx.fill();
    text(label, W / 2, y, 13, on ? COL.gold : COL.dim, "center", 700);
    buttons.push({ x: x, y: y - 15, w: w, h: 30, fn: function () { try { window.open(PROFILE_URL, "_blank", "noopener"); } catch (e) {} } });
  }

  // ---------------- the outfitter ----------------
  var pickC = 0;
  var LOCKED = ["", "Black Sand Bar", "Garnet Gulch", "Bedrock Canyon", "Glacier Run"];
  function drawShop() {
    drawBackdrop(); cx.fillStyle = "rgba(14,12,8,0.78)"; cx.fillRect(0, 0, W, H);
    text("THE OUTFITTER", 50, 50, 30, COL.text, "left", 700, SERIF);
    text("$" + g.money, W - 50, 50, 26, COL.gold, "right", 800, SERIF);
    text("TOMORROW'S CLAIM", 50, 96, 12, COL.dim, "left", 800);
    for (var i = 0; i < 5; i++) (function (i) {
      var x = 50 + i * 238, y = 110, w = 226, h = 108, cl = C.CLAIMS[i], open = cl && i < g.open, sel = pickC === i;
      rr(x, y, w, h, 12); cx.fillStyle = sel ? "rgba(96,80,50,0.95)" : open ? "rgba(44,38,28,0.94)" : "rgba(28,24,18,0.9)"; cx.fill();
      cx.strokeStyle = sel ? COL.gold : "rgba(230,210,170,0.25)"; cx.lineWidth = sel ? 2 : 1.2; cx.stroke();
      if (cl && open) {
        text(cl.name, x + 14, y + 22, 16, COL.text, "left", 700, SERIF);
        text(Math.min(g.got[i], cl.goal) >= cl.goal ? "✓" : Math.floor(g.got[i] / cl.goal * 100) + "%", x + w - 14, y + 22, 13, g.got[i] >= cl.goal ? COL.good : COL.gold, "right", 800);
        wrap(cl.blurb, x + 14, y + 46, w - 28, 11, COL.dim, 15, 600);
        buttons.push({ x: x, y: y, w: w, h: h, fn: function () { pickC = i; sfx("ui"); } });
      } else text(cl ? "Locked" : "FULL GAME", x + w / 2, y + h / 2, 14, "#7a705e", "center", 700);
      if (!cl) text(LOCKED[i], x + w / 2, y + h / 2 + 22, 15, "#a8987a", "center", 700, SERIF);
    })(i);
    text("UPGRADES", 50, 246, 12, COL.dim, "left", 800);
    C.UPGRADES.forEach(function (u, i) {
      var col = i % 2, row = Math.floor(i / 2), x = 50 + col * 600, y = 260 + row * 76, l = P.lv(g, u.id), c = P.cost(g, u.id), can = P.canBuy(g, u.id);
      rr(x, y, 580, 66, 10); cx.fillStyle = "rgba(40,34,26,0.92)"; cx.fill();
      text(u.name, x + 14, y + 20, 15, COL.text, "left", 700);
      wrap(u.desc, x + 14, y + 42, 360, 11, COL.dim, 14, 600);
      for (var q = 0; q < u.max; q++) { cx.beginPath(); cx.arc(x + 440 - (u.max - q) * 11, y + 20, 3.6, 0, 7); cx.fillStyle = q < l ? COL.gold : "rgba(220,200,160,0.3)"; cx.fill(); }
      button(x + 452, y + 14, 116, 38, l >= u.max ? "MAX" : "$" + c, function () { if (P.buy(g, u.id)) { sfx("buy"); persist(); } else sfx("bad"); }, { primary: can, disabled: !can, size: 14 });
    });
    button(W - 290, H - 62, 240, 48, "START THE DAY", function () { startDay(pickC); }, { primary: true, size: 17 });
    button(50, H - 58, 120, 40, "TITLE", function () { screen = "title"; }, { size: 13 });
    button(182, H - 58, 150, 40, "HOW TO PLAY", function () { helpOpen = true; helpPage = 0; }, { size: 13 });
    if (helpOpen) drawHelp();
  }

  // ---------------- help ----------------
  var HELP = [
    ["Pan the creek", "Every scoop of creek gravel hides a little gold. Gold is seven times heavier than sand - your job is to wash the light stuff out of the pan and keep the heavy stuff in. You have until dark."],
    ["Swirl", "Hold the mouse button on the pan (or Space) to swirl it. Swirling sorts the gravel: gold and black sand sink to the bottom, sand stays on top and pebbles float up."],
    ["Tip", "Move the mouse away from the centre of the pan to tip it toward that side. Water pours over the low lip and takes the top layer with it. The arrow turns amber, then red, when you tip too steep - then the rushing water lifts the gold too. Swirl, tip, swirl, tip."],
    ["Dip and pick", "Low on water? Right-click or E dips the pan in the creek - it stirs the top layer, so swirl again. When the pan is mostly black sand and gold, press F to pick. You keep the gold you can see; gold still buried under sand goes back into the creek."],
    ["The outfitter", "At dusk the assay office buys your gold. Spend it on a bigger pan, a better shovel, a riffled pan, a magnet for black sand, a sluice box and partners. Reach a claim's goal to open the next claim upstream."]
  ];
  function drawHelp() {
    cx.fillStyle = "rgba(8,8,6,0.78)"; cx.fillRect(0, 0, W, H);
    var x = 250, y = 130, ww = 780, hh = 520, p = HELP[helpPage];
    rr(x, y, ww, hh, 18); cx.fillStyle = COL.panel; cx.fill(); cx.strokeStyle = COL.line; cx.lineWidth = 1.5; cx.stroke();
    text("HOW TO PLAY " + (helpPage + 1) + "/" + HELP.length, x + 30, y + 34, 12, COL.dim, "left", 800);
    text(p[0], x + 30, y + 80, 32, COL.gold, "left", 700, SERIF);
    wrap(p[1], x + 30, y + 136, ww - 60, 18, COL.text, 29, 600);
    var close = function () { helpOpen = false; settings.seenHelp = true; saveSettings(); };
    if (helpPage > 0) button(x + 30, y + hh - 66, 120, 42, "BACK", function () { helpPage--; }, {});
    if (helpPage < HELP.length - 1) button(x + ww - 150, y + hh - 66, 120, 42, "NEXT", function () { helpPage++; }, { primary: true });
    else button(x + ww - 150, y + hh - 66, 120, 42, "PAN!", close, { primary: true });
    button(x + ww / 2 - 60, y + hh - 66, 120, 42, "CLOSE", close, {});
  }

  // ---------------- title: an old hand pans behind the logo ----------------
  var back = null, backCtl = null, backT = 0;
  function stepBackdrop(dt) {
    if (!back || backT > 0) {
      if (!back || backT > 2.5) { var bg = P.newGame({ seed: 5 }); bg.ups = { RIFFLE: 2, SNUFFER: 1, SHOVEL: 5, PAN: 2 }; back = P.scoop(bg, 0, P.rng(Math.floor(now() * 1000) + 3)); backCtl = BOT.controller(back, 1); backT = 0; }
      else { backT += dt; return; }
    }
    var inp = backCtl();
    if (!inp) { backT = 0.001; return; }
    P.step(back, inp, P.STEP); back.events.length = 0;
  }
  function drawBackdrop() {
    stepBackdrop(1 / 60);
    var t = now(); drawCreek(t); drawPan(back, t);
  }
  function drawTitle() {
    drawBackdrop();
    var gr = cx.createLinearGradient(0, 0, W, 0); gr.addColorStop(0, "rgba(10,10,6,0.1)"); gr.addColorStop(0.55, "rgba(10,10,6,0.55)"); gr.addColorStop(1, "rgba(10,10,6,0.85)"); cx.fillStyle = gr; cx.fillRect(0, 0, W, H);
    var lx = 1000;
    cx.font = "700 92px " + SERIF; cx.textAlign = "center"; cx.textBaseline = "middle";
    cx.shadowColor = "rgba(255,200,80,0.8)"; cx.shadowBlur = 30; cx.fillStyle = "#ffe7a6"; cx.fillText("PANGLINT", lx, 170); cx.shadowBlur = 0;
    var t = now(), sx = lx - 170 + ((t * 120) % 420); glow(cx, sx, 150, 26, "rgba(255,250,220,A)", 0.5);
    text("Swirl the gravel. Keep the gold.", lx, 236, 22, "#f6e8c8", "center", 600, SERIF);
    text("FREE DEMO · Willow Creek", lx, 272, 14, COL.gold, "center", 800);
    button(lx - 160, 520, 320, 58, g.day ? "CONTINUE" : "START PANNING", function () { audio(); if (!g.day) startDay(0); else { screen = "shop"; pickC = g.open - 1; } }, { primary: true, size: 19 });
    button(lx - 160, 590, 155, 40, "HOW TO PLAY", function () { helpOpen = true; helpPage = 0; }, { size: 13 });
    button(lx + 5, 590, 155, 40, settings.music ? "MUSIC ON" : "MUSIC OFF", function () { settings.music = !settings.music; saveSettings(); audio(); }, { size: 13 });
    button(lx - 160, 640, 320, 34, settings.sound ? "SOUND ON" : "SOUND OFF", function () { settings.sound = !settings.sound; saveSettings(); }, { size: 12 });
    button(lx - 160, 690, 320, 40, "GET THE FULL GAME", openStore, { size: 13 });
    if (helpOpen) drawHelp();
  }
  
  function openStore() { try { window.open(STORE_URL, "_blank", "noopener"); } catch (e) {} }
  function drawDemoEnd() {
    drawBackdrop();
    cx.fillStyle = "rgba(10,8,4,0.74)"; cx.fillRect(0, 0, W, H);
    text("THE DEMO ENDS HERE", W / 2, 190, 38, COL.gold, "center", 700, SERIF);
    var y = wrap("You've panned Willow Creek's goal. The full game goes upstream: Black Sand Bar, Garnet Gulch's red garnets, the nuggets of Bedrock Canyon and the flour gold of Glacier Run - with the magnet, the sluice box, partners, and somewhere up there, the Glint.", W / 2, 260, 780, 18, COL.text, 28, 600, "center");
    button(W / 2 - 170, y + 36, 340, 56, "GET THE FULL GAME", openStore, { primary: true, size: 18 });
    button(W / 2 - 100, y + 104, 200, 42, "KEEP PANNING", function () { screen = "shop"; pickC = 0; }, { size: 13 });
    followLine(H - 60);
  }
  
  function drawWon() {
    drawBackdrop();
    cx.fillStyle = "rgba(10,8,4,0.7)"; cx.fillRect(0, 0, W, H);
    var t = now(); glow(cx, W / 2, 330, 120 + 10 * Math.sin(t * 2), "rgba(255,220,120,A)", 0.5);
    cx.fillStyle = "#ffd65a"; cx.beginPath(); cx.ellipse(W / 2, 330, 46, 34, 0.4, 0, 7); cx.fill(); cx.fillStyle = "rgba(255,250,220,0.8)"; cx.beginPath(); cx.ellipse(W / 2 - 14, 318, 14, 9, 0.4, 0, 7); cx.fill();
    text("THE GLINT", W / 2, 180, 52, COL.gold, "center", 700, SERIF);
    wrap(g.day + (g.day === 1 ? " day" : " days") + " on the creek, $" + g.total + " at the assay office, and the biggest nugget Glacier Run ever gave up. Every claim is open. The creek keeps running - so can you.", W / 2, 430, 720, 18, COL.text, 28, 600, "center");
    button(W / 2 - 110, 560, 220, 50, "TO THE OUTFITTER", function () { screen = "shop"; pickC = g.open - 1; }, { primary: true });
    followLine(H - 60);
  }

  // ---------------- main loop and input ----------------
  var lastT = performance.now();
  function frame(nowT) {
    var dt = Math.min(0.05, (nowT - lastT) / 1000); lastT = nowT;
    buttons = [];
    cx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
    ambient();
    if (screen === "title") drawTitle();
    else if (screen === "work") { if (run.pan) lp = run.pan; drawWork(dt); }
    else if (screen === "dusk") drawDusk(dt);
    else if (screen === "shop") drawShop();
    else if (screen === "won") drawWon();
    else if (screen === "demoend") drawDemoEnd();
    requestAnimationFrame(frame);
  }
  function resize() {
    var vw = window.innerWidth, vh = window.innerHeight;
    scale = Math.min(vw / W, vh / H); dpr = window.devicePixelRatio || 1;
    cv.style.width = Math.floor(W * scale) + "px"; cv.style.height = Math.floor(H * scale) + "px";
    cv.width = Math.floor(W * scale * dpr); cv.height = Math.floor(H * scale * dpr);
  }
  window.addEventListener("resize", resize); resize();
  function local(e) { var r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H }; }
  cv.addEventListener("contextmenu", function (e) { e.preventDefault(); });
  cv.addEventListener("pointermove", function (e) { var m = local(e); mouse.x = m.x; mouse.y = m.y; });
  cv.addEventListener("pointerdown", function (e) {
    var m = local(e); mouse.x = m.x; mouse.y = m.y; cv.focus(); audio();
    try { cv.setPointerCapture(e.pointerId); } catch (er) {}
    for (var i = buttons.length - 1; i >= 0; i--) { var b = buttons[i]; if (m.x >= b.x && m.x <= b.x + b.w && m.y >= b.y && m.y <= b.y + b.h) { sfx("ui"); b.fn(); return; } }
    if (screen === "work" && e.button === 2) { want.dip = true; return; }
    mouse.down = true;
  });
  window.addEventListener("pointerup", function () { mouse.down = false; });
  window.addEventListener("keydown", function (e) {
    var k = e.key.toLowerCase(); keys[k] = true; audio();
    if (["arrowup", "arrowdown", "arrowleft", "arrowright", " "].indexOf(k) >= 0) e.preventDefault();
    if (screen === "work" && run) {
      if (k === "escape" || k === "p") { if (helpOpen) helpOpen = false; else paused = !paused; }
      else if (paused || helpOpen) return;
      else if (k === "f" || k === "enter") pickNow();
      else if (k === "e") want.dip = true;
      else if (k === "q") want.magnet = true;
    } else if (screen === "dusk" && dusk && k === "enter" && dusk.t > 0.6) afterDusk("shop");
    else if (k === "escape") helpOpen = false;
  });
  window.addEventListener("keyup", function (e) { keys[e.key.toLowerCase()] = false; });
  window.addEventListener("blur", function () { keys = {}; mouse.down = false; if (screen === "work" && run && run.pan) paused = true; });

  // hooks for the screenshot tool and tests
  window.PANGLINT_APP = {
    edition: ED, game: function () { return g; }, run: function () { return run; }, setGame: function (str) { g = P.load(str); },
    start: function (ci) { startDay(ci); msg = null; }, screen: function (s) { if (s) screen = s; return screen; }, help: function (v) { helpOpen = v; }, settings: settings,
    hover: function (x, y) { mouse.x = x; mouse.y = y; }, down: function (v) { mouse.down = v; }, pause: function (v) { paused = v; }, keys: keys,
    sim: function (sec, inp) { var p = run.pan; for (var t = 0; t < sec; t += P.STEP) { P.step(p, inp || {}, P.STEP); p.events.length = 0; } },
    botPan: function (sec, skill) { var p = run.pan, ctl = BOT.controller(p, skill == null ? 1 : skill), inp; for (var t = 0; t < sec && (inp = ctl()); t += P.STEP) { P.step(p, inp, P.STEP); p.events.length = 0; } },
    hud: function (v) { hideHud = !v; }, setPan: function (list, seed) { run.pan = P.makePan(list, P.rng(seed || 1), P.stats(g)); run.pan.cold = 1; return run.pan; }, K: K,
    pick: pickNow, flash: flash, msgOff: function () { msg = null; }, pickClaim: function (i) { pickC = i; }, endDay: function () { run.t = run.len; endTheDay(); }
  };
  requestAnimationFrame(frame);
})();
</script>
</body>
