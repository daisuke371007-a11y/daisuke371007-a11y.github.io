<script>
// TAPECLERK: the clerk, the tape and the rule card.
// A card maps (state, symbol read) to (symbol to write, move L or R, next state). States are A, B, C...;
// the next state "!" means STOP after this rule. If the card has no rule for what the clerk sees, the clerk stops too.
// Symbol "_" is a blank cell. The clerk starts in state A on the first symbol of the input (cell 0).
(function (root) {
  "use strict";
  var STATES = "ABCDEFGH";

  // a card as text: "A1:0RB  A_:1L!" (rules separated by spaces or new lines)
  function parseCard(text) {
    var rules = {}, errors = [];
    String(text).split(/[\s,;]+/).filter(Boolean).forEach(function (tok) {
      var m = tok.match(/^([A-H])(.):(.)([LR])([A-H!])$/);
      if (!m) { errors.push("Cannot read rule \"" + tok + "\"."); return; }
      rules[m[1] + m[2]] = { w: m[3], m: m[4], n: m[5] };
    });
    return { rules: rules, errors: errors };
  }
  function cardText(rules) {
    return Object.keys(rules).sort().map(function (k) { var r = rules[k]; return k.charAt(0) + k.charAt(1) + ":" + r.w + r.m + r.n; }).join(" ");
  }
  function count(rules) { return Object.keys(rules).length; }
  function statesUsed(rules) { var s = {}; Object.keys(rules).forEach(function (k) { s[k.charAt(0)] = 1; if (rules[k].n !== "!") s[rules[k].n] = 1; }); return Object.keys(s).length; }

  // a tape that grows both ways
  function Tape(input) {
    this.cells = {}; this.lo = 0; this.hi = -1;
    for (var i = 0; i < input.length; i++) if (input.charAt(i) !== "_") this.set(i, input.charAt(i));
    this.lo = 0; this.hi = Math.max(-1, input.length - 1);
  }
  Tape.prototype.get = function (i) { var c = this.cells[i]; return c === undefined ? "_" : c; };
  Tape.prototype.set = function (i, c) { if (c === "_") delete this.cells[i]; else this.cells[i] = c; if (i < this.lo) this.lo = i; if (i > this.hi) this.hi = i; };
  // the written part, from the first to the last non-blank cell
  Tape.prototype.text = function () {
    var ks = Object.keys(this.cells).map(Number);
    if (!ks.length) return "";
    var a = Math.min.apply(null, ks), b = Math.max.apply(null, ks), s = "";
    for (var i = a; i <= b; i++) s += this.get(i);
    return s;
  };
  Tape.prototype.ones = function () { var n = 0; for (var k in this.cells) if (this.cells[k] !== "_") n++; return n; };

  // the clerk at work
  function Clerk(rules, input) { this.rules = rules; this.tape = new Tape(input); this.head = 0; this.state = "A"; this.steps = 0; this.done = null; this.last = null; }
  // one rule: returns false once the clerk has stopped
  Clerk.prototype.step = function () {
    if (this.done) return false;
    var sym = this.tape.get(this.head), r = this.rules[this.state + sym];
    if (!r) { this.done = "stuck"; this.last = null; return false; }
    this.tape.set(this.head, r.w);
    this.last = { state: this.state, read: sym, rule: r, at: this.head };
    this.head += r.m === "R" ? 1 : -1;
    this.steps++;
    if (r.n === "!") { this.done = "stop"; return false; }
    this.state = r.n;
    return true;
  };
  function run(rules, input, limit) {
    var c = new Clerk(rules, input);
    while (c.steps < limit && c.step()) {}
    if (!c.done) c.done = "limit";
    return { done: c.done, steps: c.steps, out: c.tape.text(), ones: c.tape.ones(), state: c.state, head: c.head };
  }

  // check a card against a level. Task levels compare the tape; beaver levels score steps or ones.
  function check(level, rules) {
    var res = { ok: true, rules: count(rules), states: statesUsed(rules), steps: 0, results: [] };
    if (res.states > level.maxStates) { res.ok = false; res.error = "This job allows at most " + level.maxStates + " states (A-" + STATES.charAt(level.maxStates - 1) + ")."; return res; }
    var bad = Object.keys(rules).filter(function (k) { var r = rules[k]; return level.alphabet.indexOf(k.charAt(1)) < 0 || level.alphabet.indexOf(r.w) < 0; });
    if (bad.length) { res.ok = false; res.error = "Rule " + bad[0] + " uses a symbol this job does not have."; return res; }
    if (level.kind === "beaver") {
      var r = run(rules, "", level.limit);
      res.steps = r.steps; res.score = level.score === "ones" ? r.ones : r.steps; res.results.push({ input: "", out: r.out, done: r.done, steps: r.steps });
      if (r.done === "limit") { res.ok = false; res.error = "The clerk was still working after " + level.limit + " steps. A beaver has to stop."; }
      return res;
    }
    level.tests.forEach(function (t) {
      var r = run(rules, t.in, level.limit), good = r.done !== "limit" && r.out === t.out;
      res.results.push({ input: t.in, want: t.out, out: r.out, done: r.done, steps: r.steps, ok: good });
      res.steps += r.steps;
      if (!good) res.ok = false;
    });
    return res;
  }

  var API = { STATES: STATES, parseCard: parseCard, cardText: cardText, count: count, statesUsed: statesUsed, Tape: Tape, Clerk: Clerk, run: run, check: check };
  if (typeof module !== "undefined" && module.exports) module.exports = API;
  else root.TM = API;
})(this);

</script>
<script>
// The jobs. ref is one card that does the job (never shown to the player).
// Task jobs: every test input must end as the wanted tape. Beaver jobs: start on a blank tape, stop, and score high.
(function (root) {
  "use strict";
  var L = [];
  // a fixed little random source per job, so the extra checks are the same for everyone
  function rng(seed) { return function (n) { seed = (seed * 1103515245 + 12345) & 0x7fffffff; return n === undefined ? seed / 0x7fffffff : Math.floor(seed / 0x7fffffff * n); }; }
  function seedOf(id) { var h = 7; for (var i = 0; i < id.length; i++) h = (h * 31 + id.charCodeAt(i)) & 0x7fffffff; return h || 1; }
  function ones(n) { return new Array(n + 1).join("1"); }
  function str(r, chars, lo, hi) { var n = lo + r(hi - lo + 1), s = ""; for (var i = 0; i < n; i++) s += chars.charAt(r(chars.length)); return s; }
  function job(ch, id, title, o) {
    var tests = (o.tests || []).map(function (p) { return { in: p[0], out: p[1] }; });
    // beyond the tests you can see, every job is checked on 20 more inputs made from its exact definition,
    // so a card has to do the job in general, not just learn the examples
    if (o.gen && o.fn) {
      var r = rng(seedOf(id)), seen = {}, tries = 0;
      tests.forEach(function (t) { seen[t.in] = 1; });
      while (tests.length < (o.tests || []).length + 20 && tries++ < 2000) {
        var inp = o.gen(r);
        if (seen[inp]) continue;
        seen[inp] = 1; tests.push({ in: inp, out: o.fn(inp), hidden: true });
      }
    }
    L.push({ id: id, ch: ch, title: title, kind: o.kind || "task", alphabet: o.alphabet, maxStates: o.maxStates || 6, limit: o.limit || [0, 100, 500, 500, 1000, 1000][ch],
      tests: tests, ref: o.ref, text: o.text, hint: o.hint || "", score: o.score, record: o.record });
  }
  var SPEC = {
    ERASER: [function (r) { return ones(r(13)); }, function () { return ""; }],
    INVERT: [function (r) { return str(r, "01", 1, 10); }, function (s) { return s.replace(/./g, function (c) { return c === "0" ? "1" : "0"; }); }],
    ONEMORE: [function (r) { return ones(r(13)); }, function (s) { return s + "1"; }],
    FIRST: [function (r) { return str(r, "01", 1, 10); }, function (s) { return s.charAt(0); }],
    EVENODD: [function (r) { return ones(r(15)); }, function (s) { return s.length % 2 ? "O" : "E"; }],
    BOOKENDS: [function (r) { return str(r, "01", 0, 8); }, function (s) { return "X" + s + "X"; }],
    
  };
  var job0 = job;
  job = function (ch, id, title, o) { if (SPEC[id]) { o.gen = SPEC[id][0]; o.fn = SPEC[id][1]; } job0(ch, id, title, o); };
  // ---------------- I. FIRST DAY ----------------
  job(1, "STAMP", "STAMP", { alphabet: "_1", maxStates: 1, tests: [["", "1"]], ref: "A_:1R!",
    text: "Welcome to the tape room. The clerk reads the cell under them, looks up the rule for their state and what they read, writes, steps left or right, and moves to the next state. ! means stop.\nJob: stamp a single 1 on the blank tape.",
    hint: "One rule: in state A, reading a blank, write 1, move right, stop." });
  job(1, "THREE", "THREE IN A ROW", { alphabet: "_1", maxStates: 3, tests: [["", "111"]], ref: "A_:1RB B_:1RC C_:1R!",
    text: "Stamp 111 on a blank tape. The clerk has no memory except their state.", hint: "Each state can stand for 'how many so far'." });
  job(1, "ERASER", "ERASER", { alphabet: "_1", maxStates: 2, tests: [["1111", ""], ["1", ""], ["", ""], ["111111", ""]], ref: "A1:_RA",
    text: "Erase a line of 1s, however long. The clerk starts on the first 1. If there is no rule for what the clerk sees, the clerk simply stops.", hint: "One rule is enough." });
  job(1, "INVERT", "INVERT", { alphabet: "_01", maxStates: 2, tests: [["0110", "1001"], ["1", "0"], ["000", "111"], ["101100", "010011"]], ref: "A0:1RA A1:0RA",
    text: "Turn every 0 into 1 and every 1 into 0." });
  job(1, "ONEMORE", "ONE MORE", { alphabet: "_1", maxStates: 2, tests: [["111", "1111"], ["", "1"], ["1", "11"], ["11111", "111111"]], ref: "A1:1RA A_:1R!",
    text: "Counting in ones: 111 is three. Add one.", hint: "Where can a new 1 go without moving the others?" });
  job(1, "FIRST", "FIRST ONLY", { alphabet: "_01", maxStates: 2, tests: [["0110", "0"], ["1", "1"], ["10", "1"], ["111000", "1"]], ref: "A0:0RB A1:1RB B0:_RB B1:_RB",
    text: "Keep the first digit. Erase the rest." });
  job(1, "EVENODD", "EVEN OR ODD", { alphabet: "_1EO", maxStates: 2, tests: [["11", "E"], ["", "E"], ["1", "O"], ["111", "O"], ["111111", "E"]], ref: "A1:_RB B1:_RA A_:ER! B_:OR!",
    text: "Is the line of 1s even or odd? Leave only E or O on the tape.", hint: "Two states: 'even so far' and 'odd so far'." });
  job(1, "BOOKENDS", "BOOKENDS", { alphabet: "_01X", maxStates: 3, tests: [["011", "X011X"], ["1", "X1X"], ["0000", "X0000X"], ["", "XX"]], ref: "A0:0LB A1:1LB A_:XRC B_:XRC C0:0RC C1:1RC C_:XR!",
    text: "Put an X at both ends of the number." });
  

  var CH = ["", "FIRST DAY", "ARITHMETIC", "CHECKING", "BUSY BEAVERS", "OVERTIME"];
  L.forEach(function (lv, i) { lv.index = i; });
  var API = { LEVELS: L, CHAPTERS: CH };
  if (typeof module !== "undefined" && module.exports) module.exports = API;
  else root.TLEVELS = API;
})(this);

</script>
<script>
// Generated by prove.js.
var TPROOFS = {"STAMP": {"min": 1, "proven": true, "best": "A_:1L!", "nodes": 7}, "THREE": {"min": 3, "proven": true, "best": "A_:1LB B_:_LC C_:1RA", "nodes": 311}, "ERASER": {"min": 1, "proven": true, "best": "A1:_RA", "nodes": 7}, "INVERT": {"min": 2, "proven": true, "best": "A0:1RA A1:0RA", "nodes": 229}, "ONEMORE": {"min": 2, "proven": true, "best": "A1:1LA A_:1L!", "nodes": 78}, "FIRST": {"min": 4, "proven": true, "best": "A0:0RB A1:1RB B0:_RB B1:_RB", "nodes": 12611}, "EVENODD": {"min": 4, "proven": true, "best": "A1:_RB A_:EL! B1:_RA B_:OL!", "nodes": 9120}, "BOOKENDS": {"min": 7, "proven": false, "nothingUpTo": 5, "best": "A0:0LB A1:1LB A_:XRC B_:XRC C0:0RC C1:1RC C_:XR!", "nodes": 3645440}};

</script>
<script>
(function () {
  "use strict";
  var TMx = window.TM, LVx = window.TLEVELS, PROOF = window.TPROOFS || {};
  var ED = window.TAPE_EDITION || "full", DEMO = ED === "demo";
  var STORE_URL = "https://kqmigqkqri.itch.io/tapeclerk";
  var LEVELS = LVx.LEVELS, W = 1200, H = 760;
  var FONT = "'Segoe UI', system-ui, -apple-system, sans-serif", MONO = "ui-monospace, Consolas, 'Courier New', monospace";
  var COL = { bg: "#1b1a17", panel: "#23211c", panel2: "#2a2722", line: "#3a362e", text: "#efe6cf", dim: "#9a9180", brass: "#d4a24c", stamp: "#c0473a",
    ok: "#8fc77f", paper: "#efe6cf", paper2: "#e3d8bd", ink: "#2b2622", sel: "#d4a24c" };
  var ROMAN = ["", "I", "II", "III", "IV", "V"];
  var cv = document.getElementById("c"), cx = cv.getContext("2d"), scale = 1, dpr = 1;

  // ---------------- save ----------------
  var KEY = DEMO ? "tapeclerk.demo.v1" : "tapeclerk.v1";
  var store = { cards: {}, best: {}, hints: {}, muted: false };
  try { var raw = localStorage.getItem(KEY); if (raw) { var o = JSON.parse(raw); for (var k in o) store[k] = o[k]; } } catch (e) {}
  function persist() { try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) {} }

  function solved(lv) { return !!store.best[lv.id]; }
  function chapterOpen(ch) {
    if (ch === 1) return true;
    var prev = LEVELS.filter(function (l) { return l.ch === ch - 1; }), done = prev.filter(solved).length;
    return done >= Math.min(4, prev.length - 1);
  }
  function goalText(lv) {
    var p = PROOF[lv.id];
    if (lv.kind === "beaver") return { n: lv.record, line: "Proven record: " + lv.record + (lv.score === "ones" ? " ones" : " steps") };
    if (!p) return { n: null, line: "" };
    return p.proven ? { n: p.min, proven: true, line: "Proven fewest: " + p.min + " rules. Every smaller card was tried." }
                    : { n: p.min, proven: false, line: "Best known: " + p.min + " rules. Proven: nothing with " + p.nothingUpTo + " or fewer works." };
  }
  function star(lv) {
    var b = store.best[lv.id]; if (!b) return 0;
    if (lv.kind === "beaver") return b.score >= lv.record ? 2 : 1;
    var g = goalText(lv);
    if (g.n === null) return 1;
    if (!g.proven && b.rules < g.n) return 3;
    return b.rules <= g.n ? 2 : 1;
  }

  // ---------------- sound ----------------
  var ac = null;
  function tone(f, d, type, vol, delay) {
    if (store.muted) return;
    try {
      if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
      if (ac.state === "suspended") ac.resume();
      var t0 = ac.currentTime + (delay || 0), o = ac.createOscillator(), g = ac.createGain();
      o.type = type || "triangle"; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vol || 0.05, t0 + 0.005); g.gain.exponentialRampToValueAtTime(0.0001, t0 + d);
      o.connect(g); g.connect(ac.destination); o.start(t0); o.stop(t0 + d + 0.02);
    } catch (e) {}
  }
  function sfx(k) {
    if (k === "stamp") { tone(180, 0.05, "square", 0.04); tone(90, 0.06, "sine", 0.05); }
    else if (k === "step") tone(1300, 0.015, "square", 0.015);
    else if (k === "type") tone(700, 0.02, "triangle", 0.03);
    else if (k === "pass") [523, 659, 784, 1047].forEach(function (f, i) { tone(f, 0.25, "triangle", 0.06, i * 0.08); });
    else if (k === "fail") [330, 247].forEach(function (f, i) { tone(f, 0.22, "sawtooth", 0.04, i * 0.12); });
    else if (k === "deny") tone(140, 0.08, "square", 0.04);
  }

  // ---------------- drawing helpers ----------------
  function rr(x, y, w, h, r) { cx.beginPath(); cx.moveTo(x + r, y); cx.arcTo(x + w, y, x + w, y + h, r); cx.arcTo(x + w, y + h, x, y + h, r); cx.arcTo(x, y + h, x, y, r); cx.arcTo(x, y, x + w, y, r); cx.closePath(); }
  function text(s, x, y, size, col, align, weight, font) { cx.font = (weight || 500) + " " + size + "px " + (font || FONT); cx.fillStyle = col || COL.text; cx.textAlign = align || "left"; cx.textBaseline = "middle"; cx.fillText(s, x, y); }
  function tw(s, size, weight, font) { cx.font = (weight || 500) + " " + size + "px " + (font || FONT); return cx.measureText(s).width; }
  function wrap(s, x, y, maxW, size, col, lh) {
    String(s).split("\n").forEach(function (para) {
      var words = para.split(" "), line = "";
      for (var i = 0; i < words.length; i++) { var t = line ? line + " " + words[i] : words[i]; if (tw(t, size) > maxW && line) { text(line, x, y, size, col); line = words[i]; y += lh; } else line = t; }
      text(line, x, y, size, col); y += lh;
    });
    return y;
  }
  var buttons = [], hover = { x: -1, y: -1 };
  function button(x, y, w, h, label, fn, o) {
    o = o || {};
    var hot = hover.x >= x && hover.x <= x + w && hover.y >= y && hover.y <= y + h && !o.disabled;
    rr(x, y, w, h, 7);
    cx.fillStyle = o.disabled ? "#1f1d19" : o.primary ? (hot ? "#e3b45e" : "#d4a24c") : o.on ? "#3b3426" : hot ? "#38332a" : (o.fill || "#2c2924"); cx.fill();
    cx.strokeStyle = o.primary ? "#efc77a" : o.on ? COL.brass : "#4a443a"; cx.lineWidth = o.on ? 2 : 1; cx.stroke();
    text(label, x + w / 2, y + h / 2 + 1, o.size || 13, o.disabled ? "#5a5448" : o.primary ? "#211a0c" : (o.col || COL.text), "center", 700, o.mono ? MONO : FONT);
    if (!o.disabled && fn) buttons.push({ x: x, y: y, w: w, h: h, fn: fn });
  }
  function symLabel(s) { return s === "_" ? "" : s; }

  // ---------------- the clerk ----------------
  function drawClerk(x, y, state, s) {
    s = s || 1;
    cx.save(); cx.translate(x, y); cx.scale(s, s);
    cx.fillStyle = "#3a5068"; rr(-16, 4, 32, 30, 8); cx.fill();                // jacket
    cx.fillStyle = "#efe6cf"; cx.beginPath(); cx.moveTo(-5, 4); cx.lineTo(0, 14); cx.lineTo(5, 4); cx.closePath(); cx.fill();
    cx.fillStyle = COL.stamp; cx.fillRect(-1.5, 6, 3, 10);                      // tie
    cx.fillStyle = "#e8c9a2"; cx.beginPath(); cx.arc(0, -8, 11, 0, 7); cx.fill(); // head
    cx.fillStyle = "#2b2622"; cx.fillRect(-13, -18, 26, 5); cx.fillRect(-9, -26, 18, 9); // hat
    cx.fillStyle = "#2b2622"; cx.fillRect(-5, -9, 3, 2); cx.fillRect(2, -9, 3, 2);
    cx.restore();
    if (state) {
      rr(x + 14 * s, y - 30 * s, 22, 22, 6); cx.fillStyle = COL.brass; cx.fill();
      text(state, x + 14 * s + 11, y - 30 * s + 12, 14, "#211a0c", "center", 900, MONO);
    }
  }
  // the tape around the head, centred on view position vx (cells)
  function drawTape(clerk, y0, vx, cellW) {
    var cols = Math.ceil(W / cellW) + 2, first = Math.floor(vx - cols / 2);
    for (var i = first; i < first + cols; i++) {
      var x = W / 2 + (i - vx) * cellW - cellW / 2;
      cx.fillStyle = i % 2 ? COL.paper : COL.paper2; cx.fillRect(x, y0, cellW - 2, cellW + 6);
      var s = clerk ? clerk.tape.get(i) : "_";
      if (s !== "_") text(s, x + cellW / 2 - 1, y0 + cellW / 2 + 4, cellW * 0.55, COL.ink, "center", 800, MONO);
      cx.fillStyle = "rgba(43,38,34,0.25)"; cx.fillRect(x, y0 + cellW + 6, cellW - 2, 3);
      if (i === 0) { cx.fillStyle = "rgba(192,71,58,0.5)"; cx.fillRect(x, y0 + cellW + 10, cellW - 2, 3); }
    }
    // perforations
    cx.fillStyle = "rgba(0,0,0,0.25)";
    for (var j = first; j < first + cols; j++) { var px = W / 2 + (j - vx) * cellW; cx.beginPath(); cx.arc(px - cellW / 2, y0 + 5, 2, 0, 7); cx.fill(); }
  }

  // ---------------- play ----------------
  var screen = "title", cur = null, rules = {}, sel = { r: 0, c: 0 }, buf = "", clerk = null, testIdx = 0, running = false, speed = 8, acc = 0, viewX = 0, result = null, msg = "", msgT = 0, flash = 0;
  function openLevel(lv) {
    cur = lv; screen = "play";
    rules = store.cards[lv.id] ? TMx.parseCard(store.cards[lv.id]).rules : {};
    sel = { r: 0, c: lv.alphabet.length > 1 ? 1 : 0 }; buf = ""; testIdx = 0; result = null; running = false;
    resetClerk();
  }
  function input() { return cur.kind === "beaver" ? "" : cur.tests[testIdx].in; }
  function resetClerk() { clerk = new TMx.Clerk(rules, input()); viewX = 0; running = false; acc = 0; }
  function saveCard() { store.cards[cur.id] = TMx.cardText(rules); persist(); result = null; }
  function say(s) { msg = s; msgT = 2.5; }
  function setRule(key, r) { if (r) rules[key] = r; else delete rules[key]; saveCard(); resetClerk(); }
  function stepOnce() {
    if (!clerk || clerk.done) return false;
    var before = clerk.head, ok = clerk.step();
    if (clerk.last) sfx(clerk.steps % 2 ? "step" : "stamp");
    return ok;
  }
  function testAll() {
    var r = TMx.check(cur, rules);
    result = r;
    if (r.ok && !r.error) {
      var prev = store.best[cur.id], rec = cur.kind === "beaver" ? { score: r.score, rules: r.rules, steps: r.steps } : { rules: r.rules, steps: r.steps };
      if (cur.kind === "beaver") {
        if (!prev || r.score > prev.score) store.best[cur.id] = rec;
      } else if (!prev || r.rules < prev.rules || (r.rules === prev.rules && r.steps < prev.steps)) store.best[cur.id] = rec;
      persist(); sfx("pass"); flash = 1.5;
    } else sfx("fail");
  }
  function nextLevel() {
    var nx = LEVELS[cur.index + 1];
    if (DEMO && !nx) { screen = "demoend"; return; }
    if (!nx || !chapterOpen(nx.ch)) { screen = "map"; return; }
    openLevel(nx);

  // grid geometry

  });
  window.addEventListener("keydown", function (e) {
    if (screen === "title" && (e.key === "Enter" || e.key === " ")) { var next = LEVELS.filter(function (l) { return !solved(l) && chapterOpen(l.ch); })[0]; if (next) openLevel(next); else screen = "map"; e.preventDefault(); return; }
    if (screen === "help" && (e.key === "Escape" || e.key === "Enter")) { screen = helpFrom === "play" && cur ? "play" : "title"; return; }
    if (screen === "map" && e.key === "Escape") { screen = "title"; return; }
    if (screen !== "play") return;
    var k = e.key, g = gridGeom(), alpha = cur.alphabet;
    if (k === "ArrowUp") { sel.r = (sel.r + g.nRows - 1) % g.nRows; buf = ""; e.preventDefault(); return; }
    if (k === "ArrowDown") { sel.r = (sel.r + 1) % g.nRows; buf = ""; e.preventDefault(); return; }
    if (k === "ArrowLeft") { sel.c = (sel.c + g.nCols - 1) % g.nCols; buf = ""; e.preventDefault(); return; }
    if (k === "ArrowRight") { sel.c = (sel.c + 1) % g.nCols; buf = ""; e.preventDefault(); return; }
    if (k === "Escape") { buf = ""; if (!buf) screen = screen; return; }
    if (k === "Delete" || k === "Backspace") { if (buf) buf = buf.slice(0, -1); else setRule(TMx.STATES.charAt(sel.r) + alpha[sel.c], null); e.preventDefault(); return; }
    if (k === " ") { if (clerk && clerk.done) resetClerk(); stepOnce(); e.preventDefault(); return; }
    if (k === "Enter") { if (clerk && clerk.done) resetClerk(); running = !running; e.preventDefault(); return; }
    if (k.length !== 1) return;
    // typing a rule: symbol, direction, next state
    if (buf.length === 0) {
      var sym = k === "." ? "_" : k;
      if (alpha.indexOf(sym) < 0) {
        if ((k === "r" || k === "R") && !e.ctrlKey) { resetClerk(); return; }
        if (k === "t" || k === "T") { testAll(); return; }
        say("\"" + k + "\" is not a symbol of this job. Symbols: " + alpha.split("").join(" ")); sfx("deny"); return;
      }
      buf = sym; sfx("type"); return;
    }
    if (buf.length === 1) { var m = k.toUpperCase(); if (m !== "L" && m !== "R") { say("Second key: L or R."); sfx("deny"); return; } buf += m; sfx("type"); return; }
    if (buf.length === 2) {
      var nx = k === "!" || k === "s" || k === "S" ? "!" : k.toUpperCase(), idx = TMx.STATES.indexOf(nx);
      if (nx !== "!" && (idx < 0 || idx >= cur.maxStates)) { say("Third key: a state A-" + TMx.STATES.charAt(cur.maxStates - 1) + ", or ! (or S) to stop."); sfx("deny"); return; }
      setRule(TMx.STATES.charAt(sel.r) + alpha[sel.c], { w: buf[0], m: buf[1], n: nx });
      buf = ""; sfx("stamp");
      sel.c = (sel.c + 1) % g.nCols; if (sel.c === 0) sel.r = (sel.r + 1) % g.nRows;
    }
  });

  window.TAPE_APP = {
    state: function () { return { screen: screen, cur: cur, rules: rules, result: result, clerk: clerk, store: store, sel: sel }; },
    open: function (id) { var lv = LEVELS.filter(function (l) { return l.id === id; })[0]; if (lv) openLevel(lv); },
    card: function (text) { rules = TMx.parseCard(text).rules; saveCard(); resetClerk(); },
    test: function () { testAll(); return result; }, run: function (on) { running = on; }, speed: function (s) { speed = s; },
    pick: function (i) { testIdx = i; resetClerk(); }, screen: function (s) { screen = s; }, next: nextLevel, step: stepOnce
  };
  requestAnimationFrame(frame);
})();
</script>
