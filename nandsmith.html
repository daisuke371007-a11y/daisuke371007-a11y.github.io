<script>
// NANDSMITH circuit engine.
// A design is { parts: [{id, kind, arr, x, y}], wires: [{a:[partId, outPin], b:[partId, inPin]}] }.
// Kinds: primitives (NAND, HIGH, DFF, bus parts, RAM, ROM), the level's own IN/OUT pins, and "chip:NAME" for a part
// the player built earlier. compile() flattens everything down to primitives, so the cost of a chip is always the
// real number of NAND gates inside it, and the simulation runs the player's own gates.
(function (root) {
  "use strict";

  function mask(w) { return w >= 32 ? 0xffffffff : (1 << w) - 1; }

  // ---------- pins ----------
  function bits(prefix, n, w) { var a = []; for (var i = 0; i < n; i++) a.push({ name: prefix + i, w: w }); return a; }
  var PRIM = {
    NAND:   { ins: [{ name: "a", w: 1 }, { name: "b", w: 1 }], outs: [{ name: "out", w: 1 }], arrayable: true, blurb: "Out is 0 only when both inputs are 1." },
    HIGH:   { ins: [], outs: [{ name: "1", w: 1 }], arrayable: true, blurb: "Always 1." },
    LOW:    { ins: [], outs: [{ name: "0", w: 1 }], arrayable: true, blurb: "Always 0." },
    DFF:    { ins: [{ name: "d", w: 1 }], outs: [{ name: "q", w: 1 }], arrayable: true, blurb: "Memory: q shows what d was at the last tick." },
    SPLIT8: { ins: [{ name: "in", w: 8 }], outs: bits("b", 8, 1), blurb: "Splits an 8-bit bus into bits (b0 is the lowest)." },
    JOIN8:  { ins: bits("b", 8, 1), outs: [{ name: "out", w: 8 }], blurb: "Joins 8 bits into a bus (b0 is the lowest)." },
    SPLIT4: { ins: [{ name: "in", w: 4 }], outs: bits("b", 4, 1), blurb: "Splits a 4-bit bus into bits." },
    JOIN4:  { ins: bits("b", 4, 1), outs: [{ name: "out", w: 4 }], blurb: "Joins 4 bits into a bus." },
    HALVES: { ins: [{ name: "in", w: 8 }], outs: [{ name: "lo", w: 4 }, { name: "hi", w: 4 }], blurb: "Splits a byte into its low and high halves." },
    BYTE:   { ins: [{ name: "lo", w: 4 }, { name: "hi", w: 4 }], outs: [{ name: "out", w: 8 }], blurb: "Joins two halves into a byte." },
    FAN8:   { ins: [{ name: "in", w: 1 }], outs: [{ name: "out", w: 8 }], blurb: "Copies one bit to all 8 bits of a bus." },
    FAN4:   { ins: [{ name: "in", w: 1 }], outs: [{ name: "out", w: 4 }], blurb: "Copies one bit to all 4 bits of a bus." },
    RAM:    { ins: [{ name: "addr", w: 8 }, { name: "data", w: 8 }, { name: "write", w: 1 }], outs: [{ name: "q", w: 8 }],
              blurb: "16 bytes. q shows the byte at addr (low 4 bits). On a tick with write=1, data is stored there. Address 15 is the output port." },
    ROM:    { ins: [{ name: "addr", w: 8 }], outs: [{ name: "op", w: 8 }, { name: "arg", w: 8 }], blurb: "The program. Shows the instruction at addr." }
  };

  // pins of any kind; lib maps chip names to {ins, outs, design}
  function pinsOf(kind, lib, arr) {
    var p;
    if (PRIM[kind]) p = PRIM[kind];
    else if (kind.indexOf("chip:") === 0) { p = lib[kind.slice(5)]; if (!p) throw new Error("unknown chip " + kind); }
    else if (kind.indexOf("IN:") === 0) { var wi = +kind.split(":")[2]; return { ins: [], outs: [{ name: kind.split(":")[1], w: wi }] }; }
    else if (kind.indexOf("OUT:") === 0) { var wo = +kind.split(":")[2]; return { ins: [{ name: kind.split(":")[1], w: wo }], outs: [] }; }
    else throw new Error("unknown part " + kind);
    arr = arr || 1;
    if (arr === 1) return { ins: p.ins, outs: p.outs };
    return {
      ins: p.ins.map(function (q) { return { name: q.name, w: q.w * arr }; }),
      outs: p.outs.map(function (q) { return { name: q.name, w: q.w * arr }; })
    };
  }
  // a chip can be laid out as a row of 4 or 8 when every pin is a single bit and nothing inside cares about bit order
  function arrayable(kind, lib) {
    if (PRIM[kind]) return !!PRIM[kind].arrayable;
    var c = lib[kind.slice(5)];
    return !!(c && c.arrayable);
  }

  // ---------- flattening ----------
  // Produces nodes over numbered signals. node = {op, ins:[sig], outs:[sig], w, part:"path"}.
  function compile(design, lib, io) {
    var sigs = [], nodes = [], errors = [], warnings = [];
    function newSig(w) { sigs.push(w); return sigs.length - 1; }
    var inputs = {}, outputs = {};

    function inline(d, scale, path, bind) {
      // bind: for an inlined chip, map of its IN/OUT pin name -> outer signal
      var outSig = {};             // partId -> [sig per out pin]
      var parts = {};
      d.parts.forEach(function (p) { parts[p.id] = p; });
      // first give every part's outputs a signal
      d.parts.forEach(function (p) {
        var arr = (p.arr || 1) * scale;
        if (p.kind.indexOf("OUT:") === 0) return;
        if (p.kind.indexOf("IN:") === 0) {
          var nm = p.kind.split(":")[1];
          if (bind) outSig[p.id] = [bind.ins[nm]];
          else { var s0 = newSig(+p.kind.split(":")[2] * scale); inputs[nm] = s0; outSig[p.id] = [s0]; }
          return;
        }
        var pins = pinsOf(p.kind, lib, arr);
        outSig[p.id] = pins.outs.map(function (o) { return newSig(o.w); });
      });
      // where does each input pin get its value from
      if (!bind) top = outSig;           // the player's own parts: which signal each output pin carries
      var drive = {};
      d.wires.forEach(function (w) {
        var key = w.b[0] + "#" + w.b[1];
        if (drive[key] !== undefined) errors.push({ msg: "Two wires drive the same input.", part: path + w.b[0] });
        var src = outSig[w.a[0]];
        if (!src || src[w.a[1]] === undefined) { errors.push({ msg: "A wire starts from nowhere.", part: path + w.a[0] }); return; }
        drive[key] = src[w.a[1]];
      });
      function inSig(p, i, w) {
        var s = drive[p.id + "#" + i];
        if (s === undefined) {
          if (!bind) warnings.push({ msg: "Unconnected input reads as 0.", part: path + p.id, pin: i });
          var z = newSig(w); nodes.push({ op: "ZERO", ins: [], outs: [z], w: w, part: path + p.id }); return z;
        }
        if (sigs[s] !== w) errors.push({ msg: "A " + sigs[s] + "-bit wire is plugged into a " + w + "-bit pin.", part: path + p.id });
        return s;
      }
      d.parts.forEach(function (p) {
        var arr = (p.arr || 1) * scale, here = path + p.id;
        if (p.kind.indexOf("IN:") === 0) return;
        if (p.kind.indexOf("OUT:") === 0) {
          var nm = p.kind.split(":")[1], w = +p.kind.split(":")[2] * scale, s = inSig(p, 0, w);
          if (bind) nodes.push({ op: "BUF", ins: [s], outs: [bind.outs[nm]], w: w, part: here });
          else outputs[nm] = s;
          return;
        }
        var pins = pinsOf(p.kind, lib, arr);
        var ins = pins.ins.map(function (q, i) { return inSig(p, i, q.w); });
        var outs = outSig[p.id];
        if (p.kind.indexOf("chip:") === 0) {
          var chip = lib[p.kind.slice(5)];
          var b = { ins: {}, outs: {} };
          chip.ins.forEach(function (q, i) { b.ins[q.name] = ins[i]; });
          chip.outs.forEach(function (q, i) { b.outs[q.name] = outs[i]; });
          // a chip used in a row of 4 or 8 is inlined with every signal widened: its gates then work bit by bit
          inline(chip.design, arr, here + "/", b);
          return;
        }
        nodes.push({ op: p.kind, ins: ins, outs: outs, w: arr, part: here });
      });
    }
    var top = null;
    inline(design, 1, "", null);
    var C = { sigs: sigs, nodes: nodes, inputs: inputs, outputs: outputs, errors: errors, warnings: warnings, top: top };
    if (!errors.length) order(C);
    if (!errors.length) measure(C);
    return C;
  }

  // ---------- evaluation order ----------
  // Memory outputs (DFF, RAM contents) are known at the start of every tick; everything else must form no loop.
  function order(C) {
    var producer = {};
    C.nodes.forEach(function (n, i) { n.outs.forEach(function (s) { producer[s] = i; }); });
    var state = new Int8Array(C.nodes.length), out = [], bad = null;
    function visit(i, stack) {
      if (state[i] === 2 || bad) return;
      if (state[i] === 1) { bad = stack.slice(stack.indexOf(i)); return; }
      state[i] = 1; stack.push(i);
      var n = C.nodes[i];
      if (n.op !== "DFF") n.ins.forEach(function (s, k) {
        if (n.op === "RAM" && k > 0) return;            // the RAM's read only depends on its address
        var p = producer[s]; if (p !== undefined) visit(p, stack);
      });
      stack.pop(); state[i] = 2; out.push(i);
    }
    for (var i = 0; i < C.nodes.length && !bad; i++) visit(i, []);
    if (bad) {
      C.errors.push({ msg: "A loop with no memory in it: signals would chase their own tail. Put a DFF in the loop.",
        parts: bad.map(function (k) { return C.nodes[k].part; }) });
      return;
    }
    C.order = out;
  }

  // ---------- cost ----------
  function measure(C) {
    var nand = 0, dff = 0, depth = new Int32Array(C.sigs.length), maxd = 0;
    C.order.forEach(function (i) {
      var n = C.nodes[i];
      if (n.op === "NAND") nand += n.w;
      if (n.op === "DFF") dff += n.w;
      var d = 0;
      if (n.op !== "DFF") n.ins.forEach(function (s, k) { if (!(n.op === "RAM" && k > 0)) d = Math.max(d, depth[s]); });
      if (n.op === "NAND") d += 1;
      if (n.op === "DFF") d = 0;
      n.outs.forEach(function (s) { depth[s] = d; });
      if (d > maxd) maxd = d;
    });
    C.cost = { nand: nand, dff: dff, delay: maxd };
  }

  // ---------- running ----------
  function Machine(C, opts) {
    opts = opts || {};
    this.C = C;
    this.v = new Array(C.sigs.length).fill(0);
    this.mem = {};                               // node index -> state (DFF value or RAM array)
    this.rom = opts.rom || [];                   // [[op, arg], ...]
    this.outLog = [];                            // bytes written to RAM address 15
    var self = this;
    C.nodes.forEach(function (n, i) {
      if (n.op === "DFF") self.mem[i] = 0;
      if (n.op === "RAM") { var a = new Array(16).fill(0); (opts.ram || []).forEach(function (x, k) { a[k] = x & 255; }); self.mem[i] = a; }
    });
  }
  Machine.prototype.set = function (name, val) { var s = this.C.inputs[name]; if (s !== undefined) this.v[s] = val & mask(this.C.sigs[s]); };
  Machine.prototype.get = function (name) { var s = this.C.outputs[name]; return s === undefined ? 0 : this.v[s]; };
  Machine.prototype.eval = function () {
    var v = this.v, C = this.C, mem = this.mem, rom = this.rom;
    for (var k = 0; k < C.order.length; k++) {
      var i = C.order[k], n = C.nodes[i], o = n.outs, x = n.ins, m = mask(n.w), j, a;
      switch (n.op) {
        case "NAND": v[o[0]] = ~(v[x[0]] & v[x[1]]) & m; break;
        case "HIGH": v[o[0]] = m; break;
        case "ZERO": case "LOW": v[o[0]] = 0; break;
        case "BUF": v[o[0]] = v[x[0]]; break;
        case "DFF": v[o[0]] = mem[i]; break;
        case "SPLIT8": case "SPLIT4": for (j = 0; j < o.length; j++) v[o[j]] = (v[x[0]] >>> j) & 1; break;
        case "JOIN8": case "JOIN4": a = 0; for (j = 0; j < x.length; j++) a |= (v[x[j]] & 1) << j; v[o[0]] = a; break;
        case "HALVES": v[o[0]] = v[x[0]] & 15; v[o[1]] = (v[x[0]] >>> 4) & 15; break;
        case "BYTE": v[o[0]] = (v[x[0]] & 15) | ((v[x[1]] & 15) << 4); break;
        case "FAN8": v[o[0]] = v[x[0]] & 1 ? 255 : 0; break;
        case "FAN4": v[o[0]] = v[x[0]] & 1 ? 15 : 0; break;
        case "RAM": v[o[0]] = mem[i][v[x[0]] & 15]; break;
        case "ROM": a = rom[v[x[0]] & 255] || [0, 0]; v[o[0]] = a[0] & 255; v[o[1]] = a[1] & 255; break;
      }
    }
  };
  // the clock edge: every memory takes in what it is being given now
  Machine.prototype.tick = function () {
    var v = this.v, C = this.C, mem = this.mem, self = this;
    C.nodes.forEach(function (n, i) {
      if (n.op === "DFF") mem[i] = v[n.ins[0]];
      if (n.op === "RAM" && (v[n.ins[2]] & 1)) {
        var addr = v[n.ins[0]] & 15;
        mem[i][addr] = v[n.ins[1]] & 255;
        if (addr === 15) self.outLog.push(v[n.ins[1]] & 255);
      }
    });
  };
  Machine.prototype.ram = function () { for (var i in this.mem) if (Array.isArray(this.mem[i])) return this.mem[i]; return null; };

  var API = { PRIM: PRIM, pinsOf: pinsOf, arrayable: arrayable, compile: compile, Machine: Machine, mask: mask };
  if (typeof module !== "undefined" && module.exports) module.exports = API;
  else root.NSIM = API;
})(this);

</script>
<script>
// The parts the player builds, in order. Each solved part becomes a chip for every later level.
// test kinds: "table" (every input combination, or a fixed sample when there are too many),
//             "seq"   (a run of ticks: set inputs, check outputs, tick),
//             "cpu"   (programs run on the player's computer against the reference machine),
//             "prog"  (the player writes a program for the computer they built).
(function (root) {
  "use strict";
  function I(name, w) { return { name: name, w: w || 1 }; }
  var L = [];
  function add(o) { L.push(o); }

  // ---------------- I. GATES ----------------
  add({ id: "NOT", ch: 1, ins: [I("a")], outs: [I("out")], prims: ["NAND"], proven: true,
    text: "Everything in this workshop starts from one part: NAND. Its output is 0 only when both inputs are 1.\nBuild NOT: out is the opposite of a.",
    hint: "A NAND with both inputs tied to the same wire.",
    f: function (i) { return { out: i.a ^ 1 }; } });
  add({ id: "AND", ch: 1, ins: [I("a"), I("b")], outs: [I("out")], proven: true,
    text: "out is 1 only when a and b are both 1.\nYour NOT is in the parts list now - every part you finish becomes a chip.",
    hint: "AND is NAND, then NOT.",
    f: function (i) { return { out: i.a & i.b }; } });
  add({ id: "OR", ch: 1, ins: [I("a"), I("b")], outs: [I("out")], proven: true,
    text: "out is 1 when a or b (or both) is 1.",
    hint: "NAND gives 1 unless both are 1. What if you flip its inputs first?",
    f: function (i) { return { out: i.a | i.b }; } });
  add({ id: "NOR", ch: 1, ins: [I("a"), I("b")], outs: [I("out")], proven: true,
    text: "out is 1 only when neither input is 1.",
    hint: "The opposite of OR.",
    f: function (i) { return { out: (i.a | i.b) ^ 1 }; } });
  add({ id: "XOR", ch: 1, ins: [I("a"), I("b")], outs: [I("out")], proven: true,
    text: "out is 1 when exactly one input is 1. This is the heart of adding numbers.",
    hint: "Built from OR and AND it takes more gates than the proven minimum. Try sharing one NAND between two others.",
    f: function (i) { return { out: i.a ^ i.b }; } });
  add({ id: "XNOR", ch: 1, ins: [I("a"), I("b")], outs: [I("out")], proven: true,
    text: "out is 1 when both inputs are the same.",
    hint: "The opposite of XOR.",
    f: function (i) { return { out: (i.a ^ i.b) ^ 1 }; } });
  add({ id: "MUX", ch: 1, ins: [I("a"), I("b"), I("sel")], outs: [I("out")], proven: true,
    text: "A switch for signals. When sel is 0, out follows a. When sel is 1, out follows b.",
    hint: "Two ANDs (one with sel, one with NOT sel) feeding an OR. Then shrink it.",
    f: function (i) { return { out: i.sel ? i.b : i.a }; } });
  add({ id: "DEMUX", ch: 1, ins: [I("in"), I("sel")], outs: [I("a"), I("b")], proven: true,
    text: "The other way round: send in to output a when sel is 0, to b when sel is 1. The unused output is 0.",
    hint: "a is in AND NOT sel, b is in AND sel. Four NANDs is the floor: share one between both outputs.",
    f: function (i) { return { a: i.sel ? 0 : i.in, b: i.sel ? i.in : 0 }; } });

  

  var CONTROL_TABLE = [
    { load: 1, write: 0, imm: 1, sub: 0, pass: 1, jmp: 0, jz: 0, jn: 0 },
    { load: 1, write: 0, imm: 0, sub: 0, pass: 1, jmp: 0, jz: 0, jn: 0 },
    { load: 0, write: 1, imm: 0, sub: 0, pass: 0, jmp: 0, jz: 0, jn: 0 },
    { load: 1, write: 0, imm: 0, sub: 0, pass: 0, jmp: 0, jz: 0, jn: 0 },
    { load: 1, write: 0, imm: 0, sub: 1, pass: 0, jmp: 0, jz: 0, jn: 0 },
    { load: 0, write: 0, imm: 0, sub: 0, pass: 0, jmp: 1, jz: 0, jn: 0 },
    { load: 0, write: 0, imm: 0, sub: 0, pass: 0, jmp: 0, jz: 1, jn: 0 },
    { load: 0, write: 0, imm: 0, sub: 0, pass: 0, jmp: 0, jz: 0, jn: 1 }
  ];

  function rng(s) { return function () { s = (s * 1103515245 + 12345) & 0x7fffffff; return s / 0x7fffffff; }; }
  function bitSeq(w) {
    var st = [], q = 0, r = rng(w * 11 + 1), m = w === 8 ? 255 : 1;
    for (var k = 0; k < 40; k++) {
      var d = Math.floor(r() * (m + 1)), ld = r() < 0.4 ? 1 : 0;
      if (k < 4) { d = [m, 0, m, 0][k]; ld = [1, 0, 0, 1][k]; }
      st.push({ set: { d: d, load: ld }, expect: { q: q } });
      if (ld) q = d;
    }
    return st;
  }

  // defaults: titles, which primitive parts and chips each level may use
  var prims = [];
  L.forEach(function (lv, idx) {
    lv.title = lv.title || lv.id;
    lv.kind = lv.kind || "table";
    lv.index = idx;
    (lv.prims || []).forEach(function (p) { if (prims.indexOf(p) < 0) prims.push(p); });
    lv.allPrims = prims.slice();
    lv.chips = L.slice(0, idx).filter(function (o) { return o.kind !== "prog"; }).map(function (o) { return o.id; });
  });

  // the input cases a "table" level is checked against
  function cases(lv) {
    if (lv.cases) return lv.cases();
    var total = 0; lv.ins.forEach(function (p) { total += p.w; });
    var out = [];
    if (total <= 12) {
      for (var v = 0; v < (1 << total); v++) {
        var o = {}, sh = 0;
        lv.ins.forEach(function (p) { o[p.name] = (v >> sh) & ((1 << p.w) - 1); sh += p.w; });
        out.push(o);
      }
      return out;
    }
    var r = rng(total * 31 + lv.index), edges = [0, 1, 127, 128, 254, 255];
    edges.forEach(function (e) { var o = {}; lv.ins.forEach(function (p) { o[p.name] = e & ((1 << p.w) - 1); }); out.push(o); });
    for (var k = 0; k < 250; k++) { var q = {}; lv.ins.forEach(function (p) { q[p.name] = Math.floor(r() * (1 << p.w)); }); out.push(q); }
    return out;
  }

  // the programs the SMITH-8 level is tested with: [name, program, ram]
  var CPU_TESTS = [
    ["load and store", "LDI 7\nST 3\nLDI 0\nLD 3\nST 15\nLDI 200\nST 15\ndone: JMP done", []],
    ["add and subtract", "LD 0\nADD 1\nST 15\nSUB 2\nST 15\nSUB 2\nSUB 2\nST 15\ndone: JMP done", [100, 55, 70]],
    ["jumps", "LDI 3\nST 1\nloop: LD 1\nJZ end\nST 15\nLDI 1\nST 2\nLD 1\nSUB 2\nST 1\nJMP loop\nend: LDI 0\nSUB 2\nJN neg\nJMP end\nneg: ST 15\ndone: JMP done", []],
    ["every instruction", "LDI 250\nST 4\nADD 4\nST 15\nJN n1\nLDI 1\nST 15\nn1: LDI 0\nJZ z1\nST 15\nz1: LDI 9\nJZ bad\nJN bad\nST 15\nLDI 128\nJN ok\nbad: LDI 66\nST 15\nok: JMP ok", []]
  ];

  var API = { LEVELS: L, cases: cases, CPU_TESTS: CPU_TESTS, CONTROL_TABLE: CONTROL_TABLE };
  if (typeof module !== "undefined" && module.exports) module.exports = API;
  else root.NLEVELS = API;
})(this);

</script>
<script>
// SMITH-8: the computer the player builds.  One accumulator A, a program counter, 16 bytes of RAM.
// An instruction is two bytes: op (only the low 3 bits matter) and arg. One instruction runs per tick.
//   0 LDI k   A = k              4 SUB m   A = A - RAM[m]
//   1 LD m    A = RAM[m]         5 JMP t   go to t
//   2 ST m    RAM[m] = A         6 JZ t    go to t if A is 0
//   3 ADD m   A = A + RAM[m]     7 JN t    go to t if A is negative (its top bit is 1)
// RAM address 15 is the output port: storing there writes a number out. A JMP to itself means "done".
(function (root) {
  "use strict";
  var OPS = ["LDI", "LD", "ST", "ADD", "SUB", "JMP", "JZ", "JN"];
  var HELP = {
    LDI: "A = k", LD: "A = RAM[m]", ST: "RAM[m] = A (m = 15 writes to the output)", ADD: "A = A + RAM[m]",
    SUB: "A = A - RAM[m]", JMP: "go to t", JZ: "go to t if A = 0", JN: "go to t if A is negative (128-255)"
  };

  // text -> { rom: [[op, arg]], errors: [{line, msg}], lines: [source line of each instruction] }
  function assemble(src) {
    var lines = String(src).split(/\r?\n/), labels = {}, items = [], errors = [];
    lines.forEach(function (raw, ln) {
      var s = raw.replace(/[;#].*$/, "").trim();
      while (true) {
        var m = s.match(/^([A-Za-z_][A-Za-z0-9_]*)\s*:\s*(.*)$/);

    var y = 260;
    ["The full game keeps going, all the way to a computer:", "II  Arithmetic: adders (the full adder's proven minimum is 9), subtraction, an ALU",
      "III Memory: the DFF, registers, a program counter, an instruction decoder", "IV  Computer: wire SMITH-8 together and watch it run real programs, gate by gate",
      "V   Programs: write code for the computer you built - multiply, divide, Fibonacci..."].forEach(function (s, i) {
      text(s, i ? 300 : W / 2, y, i ? 15 : 16, i ? COL.text : COL.gold, i ? "left" : "center", i ? 600 : 800); y += i ? 32 : 44;
    });
    button(W / 2 - 160, y + 30, 320, 54, "GET THE FULL GAME", function () { window.open(STORE_URL, "_blank"); }, { primary: true, size: 17 });
    button(W / 2 - 120, y + 100, 240, 40, "LEVELS", function () { screen = "map"; });
  }
  

  // ---------------- main loop ----------------
  var last = 0;
  function frame(ts) {
    var dt = Math.min(0.05, (ts - last) / 1000 || 0); last = ts;
    if (msgT > 0) msgT -= dt;
    if (screen === "prog" && pg && pg.running) { for (var i = 0; i < 6; i++) progStep(); }
    draw();
    requestAnimationFrame(frame);
  }
  function draw() {
    cx.setTransform(dpr * scale, 0, 0, dpr * scale, 0, 0);
    buttons = []; tipText = "";
    if (screen !== "prog") code.style.display = "none";
    if (screen === "title") drawTitle();
    else if (screen === "map") drawMap();
    else if (screen === "help") drawHelp();
    else if (screen === "edit") { drawBoard(); drawPalette(); drawTopBar(); drawPanel(); }
    else if (screen === "prog") { cx.fillStyle = COL.bg; cx.fillRect(0, 0, W, H); drawProg(); }
    else if (screen === "demoend") drawDemoEnd();
    if (screen === "edit") {
      var tip = msgT > 0 ? msg : tipText || hoverTip();
      if (tip) {
        var ww = Math.min(BW - 20, tw(tip, 12, 600) + 20);
        rr(BX + 10, H - 34, ww, 24, 6); cx.fillStyle = msgT > 0 ? "rgba(60,30,20,0.92)" : "rgba(20,25,32,0.92)"; cx.fill();
        text(tip, BX + 20, H - 22, 12, msgT > 0 ? "#ffcfa8" : COL.dim, "left", 600);
      }
    }
  }
  function hoverTip() {
    if (!ed || hover.x < BX || hover.x > BX + BW || hover.y < BY) return "";
    var wpt = toWorld(hover.x, hover.y), pn = hitPin(wpt[0], wpt[1]);
    if (pn) {
      var v = pn.dir === "out" ? valOf(pn.part.id, pn.idx) : null;
      if (pn.dir === "in") { var w = ed.design.wires.filter(function (x) { return x.b[0] === pn.part.id && x.b[1] === pn.idx; })[0]; if (w) v = valOf(w.a[0], w.a[1]); }
      return pn.name !== undefined ? "" : (pn.dir === "in" ? "input " : "output ") + pinName(pn) + " · " + pn.w + " bit" + (pn.w > 1 ? "s" : "") + (v !== null && v !== undefined ? " · now " + v : "");
    }
    var p = hitPart(wpt[0], wpt[1]);
    if (p && p.kind.indexOf("IN:") === 0) return +p.kind.split(":")[2] === 1 ? "Click to flip this input." : "Click it, then type a number. Or scroll on it (Shift: 16 at a time).";
    if (p && !isIO(p) && S.arrayable(p.kind, lib)) return partLabel(p) + " · press 4 or 8 to make a row of copies";
    return "";
  }
  function pinName(pn) { var g = geom(pn.part); return (pn.dir === "in" ? g.ins : g.outs)[pn.idx].name; }

  function resize() {
    var vw = window.innerWidth, vh = window.innerHeight;
    scale = Math.min(vw / W, vh / H); dpr = window.devicePixelRatio || 1;
    cv.style.width = Math.floor(W * scale) + "px"; cv.style.height = Math.floor(H * scale) + "px";
    cv.width = Math.floor(W * scale * dpr); cv.height = Math.floor(H * scale * dpr);
    document.getElementById("wrap").style.width = cv.style.width; document.getElementById("wrap").style.height = cv.style.height;
  }
  window.addEventListener("resize", resize); resize();

  // ---------------- input ----------------
  function local(e) { var r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H }; }
  cv.addEventListener("contextmenu", function (e) { e.preventDefault(); });
  cv.addEventListener("mousedown", function (e) {
    cv.focus();
    var m = local(e); hover = m;
    if (screen !== "edit") return;
    if (m.y < BY || m.x > PX) return;
    if (m.x < BX) {
      var it = paletteHits.filter(function (q) { return m.x >= q.x && m.x <= q.x + q.w && m.y >= q.y && m.y <= q.y + 26 && m.y > BY; })[0];
      if (it) ed.drag = { type: "palette", kind: it.kind, sx: m.x, sy: m.y };
      return;
    }
    var wpt = toWorld(m.x, m.y);
    if (e.button === 2) {
      var pr = hitPart(wpt[0], wpt[1]);
      if (pr && pr.kind.indexOf("IN:") === 0) { var nm = pr.kind.split(":")[1]; setInput(nm, ed.inVals[nm] - 1); return; }
      if (pr && !isIO(pr)) { ed.sel = [pr.id]; ed.selWire = -1; deleteSelection(); return; }
      var wi = hitWire(wpt[0], wpt[1]);
      if (wi >= 0) { ed.selWire = wi; ed.sel = []; deleteSelection(); }
      return;
    }
    var pn = hitPin(wpt[0], wpt[1]);
    if (pn) { ed.drag = { type: "wire", pin: pn }; return; }
    var p = hitPart(wpt[0], wpt[1]);
    if (p) {
      if (e.shiftKey) { var k = ed.sel.indexOf(p.id); if (k >= 0) ed.sel.splice(k, 1); else ed.sel.push(p.id); }
      else if (ed.sel.indexOf(p.id) < 0) ed.sel = [p.id];
      ed.selWire = -1;
      ed.drag = { type: "move", sx: m.x, sy: m.y, moved: false, part: p, start: ed.sel.map(function (id) { var q = partById(id); return [id, q.x, q.y]; }), before: JSON.stringify(ed.design) };
      return;
    }
    var w = hitWire(wpt[0], wpt[1]);
    if (w >= 0) { ed.selWire = w; ed.sel = []; return; }
    ed.sel = []; ed.selWire = -1;
    if (e.shiftKey) ed.drag = { type: "box", sx: m.x, sy: m.y };
    else ed.drag = { type: "pan", sx: m.x, sy: m.y, vx: ed.view.x, vy: ed.view.y };
  });
  window.addEventListener("mousemove", function (e) {
    var m = local(e); hover = m;
    if (screen !== "edit" || !ed || !ed.drag) return;
    var d = ed.drag;
    if (d.type === "pan") { ed.view.x = d.vx - (m.x - d.sx) / ed.view.z; ed.view.y = d.vy - (m.y - d.sy) / ed.view.z; }
    if (d.type === "move") {
      var dx = (m.x - d.sx) / ed.view.z, dy = (m.y - d.sy) / ed.view.z;
      if (Math.abs(dx) + Math.abs(dy) > 2) d.moved = true;
      d.start.forEach(function (s) { var q = partById(s[0]); if (q) { q.x = Math.round((s[1] + dx) / 10) * 10; q.y = Math.round((s[2] + dy) / 10) * 10; } });
    }
  });
  window.addEventListener("mouseup", function (e) {
    var m = local(e); hover = m;
    if (screen === "edit" && ed && ed.drag) {
      var d = ed.drag; ed.drag = null;
      if (d.type === "palette") {
        if (m.x > BX && m.x < PX && m.y > BY) { var wp = toWorld(m.x, m.y); placePart(d.kind, wp[0] - 30, wp[1] - 15); }
        else if (Math.hypot(m.x - d.sx, m.y - d.sy) < 5) { var c0 = toWorld(BX + BW / 2, BY + BH / 2); placePart(d.kind, c0[0] - 30 + (Math.random() * 60 - 30), c0[1] - 15 + (Math.random() * 60 - 30)); }
        return;
      }
      if (d.type === "wire") {
        var wpt = toWorld(m.x, m.y), pn = hitPin(wpt[0], wpt[1]);
        if (pn && !(pn.part.id === d.pin.part.id && pn.idx === d.pin.idx && pn.dir === d.pin.dir)) connect(d.pin, pn);
        return;
      }
      if (d.type === "move") {
        if (d.moved) { ed.undo.push(d.before); ed.redo = []; saveDesign(); }
        else if (d.part.kind.indexOf("IN:") === 0) {
          var nm = d.part.kind.split(":")[1], w = +d.part.kind.split(":")[2];
          if (w === 1) setInput(nm, ed.inVals[nm] ^ 1);
          else { ed.typing = { name: nm, buf: "" }; say("Type a number for " + nm + " (0-" + S.mask(w) + "), or scroll on it."); }
          sfx("tick");
        }
        return;
      }
      if (d.type === "box") {
        var a = toWorld(d.sx, d.sy), b = toWorld(m.x, m.y), x0 = Math.min(a[0], b[0]), x1 = Math.max(a[0], b[0]), y0 = Math.min(a[1], b[1]), y1 = Math.max(a[1], b[1]);
        ed.sel = ed.design.parts.filter(function (p) { var g = geom(p); return !isIO(p) && g.x >= x0 && g.x + g.w <= x1 && g.y >= y0 && g.y + g.h <= y1; }).map(function (p) { return p.id; });
        return;
      }
      return;
    }
    for (var i = buttons.length - 1; i >= 0; i--) {
      var bt = buttons[i];
      if (m.x >= bt.x && m.x <= bt.x + bt.w && m.y >= bt.y && m.y <= bt.y + bt.h) { bt.fn(); return; }
    }
  });
  // buttons inside the editor's panels are pressed on mouse up too, but only when no drag was started there
  cv.addEventListener("wheel", function (e) {
    e.preventDefault();
    var m = local(e);
    if (screen !== "edit") return;
    if (m.x < BX) { palScroll = Math.max(0, Math.min(palMax, palScroll + e.deltaY * 0.6)); return; }
    if (m.x > PX || m.y < BY) return;
    var wpt = toWorld(m.x, m.y), p = hitPart(wpt[0], wpt[1]);
    if (p && p.kind.indexOf("IN:") === 0 && +p.kind.split(":")[2] > 1) { var nm = p.kind.split(":")[1]; setInput(nm, ed.inVals[nm] + (e.deltaY < 0 ? 1 : -1) * (e.shiftKey ? 16 : 1)); return; }
    var z0 = ed.view.z, z1 = Math.max(0.3, Math.min(2.2, z0 * (e.deltaY < 0 ? 1.12 : 1 / 1.12)));
    ed.view.x = wpt[0] - (m.x - BX) / z1; ed.view.y = wpt[1] - (m.y - BY) / z1; ed.view.z = z1;
  }, { passive: false });
  window.addEventListener("keydown", function (e) {
    if (screen !== "edit" || !ed) return;
    var k = e.key, ctrl = e.ctrlKey || e.metaKey;
    if (ctrl && (k === "z" || k === "Z")) { e.shiftKey ? redo() : undo(); e.preventDefault(); return; }
    if (ctrl && (k === "y" || k === "Y")) { redo(); e.preventDefault(); return; }
    if (ctrl && (k === "c" || k === "C")) { copySel(); e.preventDefault(); return; }
    if (ctrl && (k === "v" || k === "V")) { paste(); e.preventDefault(); return; }
    if (ctrl && (k === "d" || k === "D")) { if (copySel()) paste(); e.preventDefault(); return; }
    if (ctrl && (k === "a" || k === "A")) { ed.sel = ed.design.parts.filter(function (p) { return !isIO(p); }).map(function (p) { return p.id; }); e.preventDefault(); return; }
    if (ed.typing && ed.sel.length === 1 && ed.sel[0] === "in_" + ed.typing.name) {
      if (/^[0-9]$/.test(k)) { ed.typing.buf = (ed.typing.buf + k).slice(-3); setInput(ed.typing.name, parseInt(ed.typing.buf, 10)); say(ed.typing.name + " = " + ed.inVals[ed.typing.name]); return; }
      if (k === "Backspace") { ed.typing.buf = ed.typing.buf.slice(0, -1); setInput(ed.typing.name, parseInt(ed.typing.buf || "0", 10)); e.preventDefault(); return; }
      if (k === "Enter" || k === "Escape") { ed.typing = null; return; }
    } else ed.typing = null;
    if (k === "Delete" || k === "Backspace") { deleteSelection(); e.preventDefault(); return; }
    if (k === "1" || k === "4" || k === "8") { setArray(+k); return; }
    if (k === "f" || k === "F") { fitView(); return; }
    if (k === "t" || k === "T") { runTest(); return; }
    if ((k === "s" || k === "S") && (ed.lv.kind === "seq" || ed.lv.kind === "cpu")) { stepTick(); return; }
    if (k === "Escape") { ed.sel = []; ed.selWire = -1; }
  });

  // hooks for automated checks and the store capture
  window.NAND_APP = {
    state: function () { return { screen: screen, ed: ed, pg: pg, store: store }; },
    open: function (id) { var lv = LEVELS.filter(function (l) { return l.id === id; })[0]; if (lv) openLevel(lv); },
    setDesign: function (d) { snapshot(); ed.design = clone(d); changed(); fitView(); },
    test: function () { runTest(); return ed.result; },
    setInput: setInput, step: stepTick, fit: fitView, view: function () { return ed && ed.view; },
    screen: function (s) { screen = s; }, code: function (s) { code.value = s; code.dispatchEvent(new Event("input")); },
    progTest: function () { progTest(); return pg.result; }, progRun: function (on) { if (!pg.M) resetProg(); pg.running = on; }
  };
  requestAnimationFrame(frame);
})();
</script>
</body>
