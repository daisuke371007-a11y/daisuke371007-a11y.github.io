<script>
// web.js — GLOWSILK: silk that sags and snaps, insects that fly by their own habits, a spider that walks the web.
// Pure logic: the page, the balance runs and the tests all drive it the same way.
(function (root) {
  "use strict";
  var node = typeof module !== "undefined" && module.exports;
  var C = node ? require("./content.js") : root.CONTENT;
  var WW = 1280, WH = 800, SEG = 18, GRAV = 260, ITER = 10;

  function rng(seed) {

  }
  function dist(ax, ay, bx, by) { return Math.sqrt((ax - bx) * (ax - bx) + (ay - by) * (ay - by)); }

  // --- the player's save ---

    opts = opts || {};
    return { v: 1, demo: !!opts.demo, garden: 0, open: 1, food: 0, total: 0, molts: {}, journal: {}, nights: 0, best: {}, webs: {}, seed: opts.seed || 1 };
  }
  function lv(g, id) { return g.molts[id] || 0; }
  function moltCost(g, id) { var m = C.MOLT[id], l = lv(g, id); return l >= m.max ? Infinity : Math.round(m.base * Math.pow(m.grow, l)); }
  function canMolt(g, id) { return lv(g, id) < C.MOLT[id].max && g.food >= moltCost(g, id); }
  function molt(g, id) { if (!canMolt(g, id)) return false; g.food -= moltCost(g, id); g.molts[id] = lv(g, id) + 1; return true; }
  function stats(g) {
    return { silkMax: 2400 * Math.pow(1.25, lv(g, "SILK")), regen: 30 * Math.pow(1.3, lv(g, "REGEN")), strength: 70 * Math.pow(1.35, lv(g, "STRONG")),
      stick: Math.pow(1.35, lv(g, "STICKY")), speed: 130 * Math.pow(1.25, lv(g, "LEGS")), wrap: 1.1 * Math.pow(0.8, lv(g, "WRAP")),
      reach: 500 * Math.pow(1.2, lv(g, "REACH")), glow: lv(g, "GLOW"), brood: lv(g, "BROOD"), extra: 15 * lv(g, "NIGHT") };
  }
  function gardens(g) { return C.GARDENS.length; }

  // --- a night in a garden ---
  function startNight(g, seed) {
    var gd = C.GARDENS[g.garden], s = stats(g);
    var w = { g: g, gd: gd, s: s, pts: [], segs: [], bugs: [], time: 0, len: gd.night + s.extra, silk: s.silkMax, food: 0, caught: [], escaped: 0, snapped: 0,
      events: [], rng: rng((seed || (g.seed * 7919 + g.nights * 104729 + g.garden)) >>> 0), spawnT: 0, over: false, lings: [], cocoons: [] };
    // anchors are pinned points; anchors of one group are joined by branches the spider can walk
    gd.anchors.forEach(function (a, i) { w.pts.push({ x: a.x, y: a.y, px: a.x, py: a.y, pin: true, anchor: i, dead: false }); });
    w.branch = [];
    gd.anchors.forEach(function (a, i) { gd.anchors.forEach(function (b, j) { if (j > i && a.g === b.g) w.branch.push([i, j]); }); });
    // yesterday's web, if any
    var saved = g.webs[gd.id];
    if (saved) {
      saved.pts.forEach(function (p) { w.pts.push({ x: p[0], y: p[1], px: p[0], py: p[1], pin: false, anchor: -1, dead: false }); });
      saved.segs.forEach(function (sg) { w.segs.push({ a: sg[0], b: sg[1], rest: sg[2], hp: s.strength, dead: false }); });
    }
    w.spider = { at: gd.home, path: [], seg: -1, t: 0, x: gd.anchors[gd.home].x, y: gd.anchors[gd.home].y, state: "idle", target: null, wrapT: 0 };
    for (var k = 0; k < s.brood; k++) w.lings.push({ at: gd.home, path: [], x: w.spider.x, y: w.spider.y, state: "idle", target: null, wrapT: 0, ling: true });
    return w;
  }
  function liveSegs(w) { return w.segs.filter(function (s) { return !s.dead; }); }

  // where would a strand attach near (x, y)? an anchor or knot, or a point along a strand
  function attachAt(w, x, y, rad) {
    rad = rad || 16;
    var best = null, bd = rad;
    w.pts.forEach(function (p, i) { if (p.dead) return; var d = dist(p.x, p.y, x, y); var r2 = p.pin ? rad + 6 : rad; if (d < Math.min(bd + (p.pin ? 6 : 0), r2) && (!best || d < bd)) { bd = d; best = { pt: i, x: p.x, y: p.y }; } });

    var bs = null, bsd = rad * 0.8;
    w.segs.forEach(function (s, i) {

      var t = Math.max(0, Math.min(1, ((x - a.x) * dx + (y - a.y) * dy) / L2)), px = a.x + dx * t, py = a.y + dy * t, d = dist(px, py, x, y);

    });
    if (best && (!bs || bd <= bsd + 4)) return best;
    return bs || best;
  }
  // a knot on a strand: split the segment there
  function splitSeg(w, si, t) {
    var s = w.segs[si], a = w.pts[s.a], b = w.pts[s.b];
    if (t < 0.08) return s.a;
    if (t > 0.92) return s.b;
    var x = a.x + (b.x - a.x) * t, y = a.y + (b.y - a.y) * t;
    var pi = w.pts.length;
    w.pts.push({ x: x, y: y, px: x, py: y, pin: false, anchor: -1, dead: false });
    var nb = { a: pi, b: s.b, rest: s.rest * (1 - t), hp: s.hp, dead: false };
    s.b = pi; s.rest *= t;
    var ni = w.segs.length;
    w.segs.push(nb);

    w.bugs.forEach(function (bg) { if (bg.stuck && bg.stuck.seg === si) { if (bg.stuck.t > t) { bg.stuck.seg = ni; bg.stuck.t = (bg.stuck.t - t) / (1 - t); } else bg.stuck.t = bg.stuck.t / t; } });
    w.cocoons.forEach(function (c) { if (c.seg === si) { if (c.t > t) { c.seg = ni; c.t = (c.t - t) / (1 - t); } else c.t = c.t / t; } });
    return pi;
  }
  function resolve(w, at) { return at.pt !== undefined ? at.pt : splitSeg(w, at.seg, at.t); }
  function strandCost(ax, ay, bx, by) { return dist(ax, ay, bx, by); }
  // spin a strand between two attach points. returns null or the reason it can't be done
  function strand(w, A, B) {
    if (!A || !B) return "a strand needs a knot or another strand at both ends";
    var L = dist(A.x, A.y, B.x, B.y);
    if (L < 14) return "too short";
    if (L > w.s.reach) return "too long - the silk won't reach";
    if (A.pt !== undefined && A.pt === B.pt) return "too short";
    if (w.silk < L) return "not enough silk";
    var pa = resolve(w, A), pb = resolve(w, B);
    if (pa === pb) return "too short";
    var P1 = w.pts[pa], P2 = w.pts[pb], n = Math.max(1, Math.round(L / SEG)), prev = pa;
    for (var i = 1; i <= n; i++) {
      var id;
      if (i === n) id = pb;
      else { var x = P1.x + (P2.x - P1.x) * i / n, y = P1.y + (P2.y - P1.y) * i / n; id = w.pts.length; w.pts.push({ x: x, y: y, px: x, py: y, pin: false, anchor: -1, dead: false }); }
      w.segs.push({ a: prev, b: id, rest: L / n * 0.985, hp: w.s.strength, dead: false });
      prev = id;
    }
    w.silk -= L;
    w.events.push({ e: "spun", L: L });
    return null;
  }

  // --- the capture spiral: rings around a hub, joining its spokes ---
  function spokes(w, hub) {
    var adj = adjacency(w), out = [];
    (adj[hub] || []).forEach(function (e) {
      var line = [hub], cur = e.to, prev = hub, guard = 0;
      while (guard++ < 200) {
        line.push(cur);
        if (w.pts[cur].pin) break;
        // follow the strand straight on through knots where the spiral crosses it
        var P = w.pts[prev], Q = w.pts[cur], dir = Math.atan2(Q.y - P.y, Q.x - P.x), nxt = null, bestA = 0.6;
        (adj[cur] || []).forEach(function (f) {
          if (f.to === prev || line.indexOf(f.to) >= 0) return;
          var R = w.pts[f.to], da = Math.abs(Math.atan2(Math.sin(Math.atan2(R.y - Q.y, R.x - Q.x) - dir), Math.cos(Math.atan2(R.y - Q.y, R.x - Q.x) - dir)));
          if (da < bestA) { bestA = da; nxt = f.to; }
        });
        if (nxt === null) break;
        prev = cur; cur = nxt;
      }
      out.push(line);
    });
    var H = w.pts[hub];
    out.forEach(function (l) { var e = w.pts[l[l.length - 1]]; l.ang = Math.atan2(e.y - H.y, e.x - H.x); });
    out.sort(function (a, b) { return a.ang - b.ang; });
    return out;
  }
  function pointAtRadius(w, line, r) {
    var H = w.pts[line[0]];
    for (var i = 0; i + 1 < line.length; i++) {
      var a = w.pts[line[i]], b = w.pts[line[i + 1]], da = dist(a.x, a.y, H.x, H.y), db = dist(b.x, b.y, H.x, H.y);
      if (da <= r && db >= r) {
        var t = db > da ? (r - da) / (db - da) : 0, si = segBetween(w, line[i], line[i + 1]);
        if (si < 0) return null;
        var s = w.segs[si], tt = s.a === line[i] ? t : 1 - t;
        return { seg: si, t: tt, x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t };
      }
    }
    return null;
  }
  function segBetween(w, p, q) { for (var i = 0; i < w.segs.length; i++) { var s = w.segs[i]; if (!s.dead && ((s.a === p && s.b === q) || (s.a === q && s.b === p))) return i; } return -1; }
  // knots where strands already cross the spokes, from before this spiral began
  function junctions(w, hub) {
    var deg = {}, out = [];
    w.segs.forEach(function (s) { if (!s.dead) { deg[s.a] = (deg[s.a] || 0) + 1; deg[s.b] = (deg[s.b] || 0) + 1; } });
    w.pts.forEach(function (p, i) { if (i !== hub && !p.pin && !p.dead && deg[i] >= 3) out.push(p); });
    return out;
  }
  function spiral(w, hub, gap) {
    gap = gap || 22;
    var sp = spokes(w, hub);
    if (sp.length < 3) return "a spiral needs at least three strands leaving this knot";
    var old = junctions(w, hub), made = 0, r = 26, maxR = Math.max.apply(null, sp.map(function (l) { var H = w.pts[hub], e = w.pts[l[l.length - 1]]; return dist(H.x, H.y, e.x, e.y); }));
    while (r < maxR && w.silk > 30) {
      for (var i = 0; i < sp.length; i++) {
        var j = (i + 1) % sp.length, da = sp[j].ang - sp[i].ang;
        if (da < 0) da += Math.PI * 2;
        if (da > Math.PI * 0.95) continue;
        var A = pointAtRadius(w, sp[i], r), B = pointAtRadius(w, sp[j], r + gap / sp.length);
        if (!A || !B) continue;
        // a ring already crosses here (an earlier spiral): leave it be
        if (old.some(function (p) { return dist(p.x, p.y, A.x, A.y) < gap * 0.45; })) continue;
        if (strand(w, A, B)) continue;
        made++;
        // splitting changed the spokes: refresh them
        sp = spokes(w, hub);
        if (sp.length < 3) return made ? null : "the spokes broke";
      }
      r += gap;
    }
    w.events.push({ e: "spiral", n: made });
    return made ? null : "no room for a spiral here";
  }

  // --- the graph the spider walks: strands, and branches between anchors of one group ---
  function adjacency(w) {
    var adj = {};
    function add(a, b, L) { (adj[a] = adj[a] || []).push({ to: b, L: L }); (adj[b] = adj[b] || []).push({ to: a, L: L }); }
    w.segs.forEach(function (s) { if (!s.dead) { var a = w.pts[s.a], b = w.pts[s.b]; add(s.a, s.b, dist(a.x, a.y, b.x, b.y)); } });
    return adj;
  }
  function walkGraph(w) {
    var adj = adjacency(w);
    w.branch.forEach(function (br) { var a = w.pts[br[0]], b = w.pts[br[1]], L = dist(a.x, a.y, b.x, b.y) * 1.2; (adj[br[0]] = adj[br[0]] || []).push({ to: br[1], L: L }); (adj[br[1]] = adj[br[1]] || []).push({ to: br[0], L: L }); });

  }
  // every knot a walker standing at `from` can get to
  function reachable(w, from) {
    var adj = walkGraph(w), seen = {}, st = [from];
    seen[from] = 1;
    while (st.length) { var u = st.pop(); (adj[u] || []).forEach(function (e) { if (!seen[e.to]) { seen[e.to] = 1; st.push(e.to); } }); }
    return seen;
  }
  function route(w, from, goals) {
    var adj = walkGraph(w), d = {}, prev = {}, seen = {}, q = [from];
    d[from] = 0;
    while (q.length) {

      var u = q.splice(bi, 1)[0];
      if (seen[u]) continue; seen[u] = 1;
      if (goals.indexOf(u) >= 0) { var path = [u]; while (prev[path[0]] !== undefined) path.unshift(prev[path[0]]); return path; }
      (adj[u] || []).forEach(function (e) { var nd = d[u] + e.L; if (d[e.to] === undefined || nd < d[e.to]) { d[e.to] = nd; prev[e.to] = u; q.push(e.to); } });
    }

  }

  // --- bugs ---
  function pick(w) {

    for (k in mix) tot += mix[k];

    return k;
  }
  function spawn(w, id, x, y) {
    var b = C.BUG[id], r = w.rng, side = r() < 0.5 ? -1 : 1;

    var bug = { id: id, def: b, x: x, y: y, vx: -side * b.speed, vy: (r() - 0.5) * 30, age: 0, life: 18 + r() * 14, stuck: null, esc: 0, phase: r() * 6.28, dead: false, flap: r() * 6 };

    w.bugs.push(bug);

    text(p[0], x + 30, y + 76, 32, COL.gold, "left", 700, SERIF);
    wrap(p[1], x + 30, y + 130, ww - 60, 18, COL.text, 28, 600);
    if (helpPage > 0) button(x + 30, y + hh - 66, 120, 42, "BACK", function () { helpPage--; }, {});
    if (helpPage < HELP.length - 1) button(x + ww - 150, y + hh - 66, 120, 42, "NEXT", function () { helpPage++; }, { primary: true });
    else button(x + ww - 150, y + hh - 66, 120, 42, "SPIN!", function () { helpOpen = false; settings.seenHelp = true; saveSettings(); }, { primary: true });
    button(x + ww / 2 - 60, y + hh - 66, 120, 42, "CLOSE", function () { helpOpen = false; settings.seenHelp = true; saveSettings(); }, {});
  }

  // ---------------- title: a web spins itself in the porch light ----------------
  var titleW = null, titleT = 0;
  function makeTitleWeb() {
    var tg = WEB.newGame({ seed: 77 }); tg.molts = { STRONG: 3, STICKY: 4, SILK: 4, GLOW: 2 };
    titleW = WEB.startNight(tg, 4242); titleW.len = 1e9;
    titleW.weaveQ = [];
  }
  function titleStep(dt) {
    var tw2 = titleW;
    tw2.silk = 1e9;
    titleT += dt;
    if (!tw2.woven) { window.BOT.weave(tw2); tw2.woven = true; }
    for (var i = 0; i < 2; i++) { WEB.step(tw2, dt / 2); tw2.events.length = 0; }
    // the spider tends its catches
    if (tw2.spider.state === "idle") { var b = tw2.bugs.filter(function (x) { return x.stuck && !x.claimed; })[0]; if (b) WEB.order(tw2, b); }
  }
  function drawTitle(dt) {
    if (!titleW) makeTitleWeb();
    titleStep(dt);
    var t = now();
    drawScene(titleW.gd, true); drawLights(titleW.gd); drawWeb(titleW); drawBugs(titleW, t); drawSpider(titleW.spider, t);
    var gr = cx.createLinearGradient(0, 0, 0, H); gr.addColorStop(0, "rgba(5,7,18,0.55)"); gr.addColorStop(0.35, "rgba(5,7,18,0)"); gr.addColorStop(0.75, "rgba(5,7,18,0)"); gr.addColorStop(1, "rgba(5,7,18,0.7)");
    cx.fillStyle = gr; cx.fillRect(0, 0, W, H);
    logo(W / 2 - 140, 96);
    text("Spin glowing silk. Catch the night.", W / 2 - 140, 158, 22, "#dfe6ff", "center", 600, SERIF);
    text("FREE DEMO · the Summer Porch", W / 2 - 140, 190, 14, COL.gold, "center", 800);
    var bx = W / 2 - 290, by = 600;
    button(bx, by, 300, 56, hasSave ? "CONTINUE" : "START", function () { audio(); if (hasSave) { if (!settings.seenHelp) helpOpen = true; startNight(); } else startNight(); }, { primary: true, size: 19 });
    button(bx, by + 66, 145, 40, "JOURNAL", function () { journalFrom = "title"; screen = "journal"; }, { size: 13 });
    button(bx + 155, by + 66, 145, 40, settings.music ? "MUSIC ON" : "MUSIC OFF", function () { settings.music = !settings.music; saveSettings(); audio(); }, { size: 13 });
    if (hasSave) button(bx, by + 114, 300, 30, confirmNew ? "Click again to start over" : "NEW GAME", function () { if (!confirmNew) { confirmNew = true; return; } g = WEB.newGame({ demo: DEMO, seed: (Date.now() % 100000) + 1 }); hasSave = false; confirmNew = false; persist(); startNight(); }, { size: 12 });
    button(W - 300, H - 66, 270, 40, "GET THE FULL GAME", openStore, { size: 13 });
  }
  var confirmNew = false;
  function logo(x, y) {
    cx.save(); cx.globalCompositeOperation = "lighter";
    glow(x, y, 260, "rgba(120,190,255,A)", 0.16);
    cx.restore();
    cx.font = "700 84px " + SERIF; cx.textAlign = "center"; cx.textBaseline = "middle";
    cx.shadowColor = "rgba(160,220,255,0.9)"; cx.shadowBlur = 24; cx.fillStyle = "#f2f7ff"; cx.fillText("GLOWSILK", x, y); cx.shadowBlur = 0;
    // a strand of silk under the word, with a dewdrop
    cx.strokeStyle = "rgba(220,235,255,0.8)"; cx.lineWidth = 1.2; cx.beginPath(); cx.moveTo(x - 200, y + 44); cx.quadraticCurveTo(x, y + 60, x + 200, y + 44); cx.stroke();
    cx.beginPath(); cx.arc(x + 60, y + 52, 3, 0, 7); cx.fillStyle = "#eaf6ff"; cx.fill();
  }
  
  function openStore() { try { window.open(STORE_URL, "_blank", "noopener"); } catch (e) {} }
  function drawDemoEnd() {
    drawScene(C.GARDENS[0], true); drawLights(C.GARDENS[0]);
    cx.fillStyle = "rgba(5,8,20,0.78)"; cx.fillRect(0, 0, W, H);
    text("THE DEMO ENDS HERE", W / 2, 200, 38, COL.gold, "center", 700, SERIF);
    var y = wrap("You fed well on the Summer Porch. The full game opens three more gardens - the Autumn Orchard with its beetles and wasps, the Moonlit Pond full of dragonflies, and the Old Greenhouse, where the Atlas Moth comes to the bulbs - with every molt and the whole bug journal.", W / 2, 270, 760, 18, COL.text, 28, 600, "center");
    button(W / 2 - 160, y + 40, 320, 56, "GET THE FULL GAME", openStore, { primary: true, size: 18 });
    button(W / 2 - 100, y + 110, 200, 42, "KEEP SPINNING", function () { startNight(); }, { size: 13 });
  }
  
  function drawWon() {
    drawScene(C.GARDENS[C.GARDENS.length - 1], true); drawLights(C.GARDENS[C.GARDENS.length - 1]);
    cx.fillStyle = "rgba(5,8,20,0.7)"; cx.fillRect(0, 0, W, H);
    text("THE GREAT WEB", W / 2, 220, 44, COL.gold, "center", 700, SERIF);
    wrap("Four gardens fed, " + g.nights + (g.nights === 1 ? " night" : " nights") + " spun, " + Object.keys(g.journal).length + " of " + C.BUGS.length + " bugs in the journal. The greenhouse is yours. Keep spinning - there's always a bigger moth.", W / 2, 300, 700, 18, COL.text, 28, 600, "center");
    button(W / 2 - 220, 440, 200, 48, "JOURNAL", function () { journalFrom = "won"; screen = "journal"; }, {});
    button(W / 2 + 20, 440, 200, 48, "KEEP SPINNING", function () { startNight(); }, { primary: true });
  }

  // ---------------- main loop and input ----------------
  var lastT = performance.now();
  function frame(nowT) {
    var dt = Math.min(0.05, (nowT - lastT) / 1000); lastT = nowT;
    buttons = []; hitT -= dt;
    cx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
    ambient();
    if (screen === "title") drawTitle(dt);
    else if (screen === "night") drawNight(dt);
    else if (screen === "journal") drawJournal();
    else if (screen === "won") drawWon();
    else if (screen === "demoend") drawDemoEnd();
    requestAnimationFrame(frame);
  }
  function resize() {
    var vw = window.innerWidth, vh = window.innerHeight;
    scale = Math.min(vw / W, vh / H); dpr = window.devicePixelRatio || 1;
    cv.style.width = Math.floor(W * scale) + "px"; cv.style.height = Math.floor(H * scale) + "px";
    cv.width = Math.floor(W * scale * dpr); cv.height = Math.floor(H * scale * dpr);
  }
  window.addEventListener("resize", resize); resize();
  function local(e) { var r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H }; }
  cv.addEventListener("contextmenu", function (e) { e.preventDefault(); });
  cv.addEventListener("pointermove", function (e) { var m = local(e); mouse.x = m.x; mouse.y = m.y; });
  cv.addEventListener("pointerdown", function (e) {
    var m = local(e); mouse.x = m.x; mouse.y = m.y; mouse.down = true; cv.focus(); audio();
    for (var i = buttons.length - 1; i >= 0; i--) { var b = buttons[i]; if (m.x >= b.x && m.x <= b.x + b.w && m.y >= b.y && m.y <= b.y + b.h) { sfx("ui"); b.fn(); return; } }
    if (screen !== "night" || dawn || helpOpen || paused) return;
    if (e.button === 2) { cutAt(m); return; }
    // a caught bug: send the spider
    var bug = null;
    w.bugs.forEach(function (b) { if (b.stuck) { var p = WEB.stuckPos(w, b); if (Math.hypot(p.x - m.x, p.y - m.y) < b.def.r * VIS + 12) bug = b; } });
    if (bug) { var err = WEB.order(w, bug); if (err) { flash(cap(err) + ".", COL.bad); sfx("bad"); } else sfx("ui"); return; }
    var at = WEB.attachAt(w, m.x, m.y, 18);
    if (tool === "spiral") {
      if (!at) { flash("Click a knot where three or more strands meet.", COL.dim); return; }
      var hub = at.pt !== undefined ? at.pt : null;
      if (hub === null) { flash("Click right on a knot.", COL.dim); return; }
      var r = WEB.spiral(w, hub, 22);
      if (r) { flash(cap(r) + ".", COL.bad); sfx("bad"); } else { pluck(120); pluck(60); tool = "strand"; }
      return;
    }
    if (at) dragFrom = at;
  });
  window.addEventListener("pointerup", function (e) {
    mouse.down = false;
    if (!dragFrom || screen !== "night") { dragFrom = null; return; }
    var m = local(e), to = WEB.attachAt(w, m.x, m.y, 18), from = dragFrom;
    dragFrom = null;
    if (!to) { if (Math.hypot(m.x - from.x, m.y - from.y) > 20) { flash("End a strand on a knot or another strand.", COL.dim); sfx("bad"); } return; }
    // the start may have moved with the web: find it again
    var start = from.pt !== undefined ? { pt: from.pt, x: w.pts[from.pt].x, y: w.pts[from.pt].y } : WEB.attachAt(w, from.x, from.y, 18);
    var L = Math.hypot(to.x - start.x, to.y - start.y), err = WEB.strand(w, start, to);
    if (err) { if (err !== "too short") { flash(cap(err) + ".", COL.bad); sfx("bad"); } }
    else pluck(L);
  });
  function cutAt(m) {
    var at = WEB.attachAt(w, m.x, m.y, 14);
    if (at && at.seg !== undefined) { WEB.breakSeg(w, at.seg); sfx("snap"); }
  }
  function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }
  window.addEventListener("keydown", function (e) {
    var k = e.key.toLowerCase();
    if (screen === "night") {
      if (k === "escape" || k === "p") { if (helpOpen) helpOpen = false; else paused = !paused; }
      else if (k === "s") tool = tool === "spiral" ? "strand" : "spiral";
      else if ((k === " " || k === "enter") && dawn && dawn.t > 0.8) { dawn = null; startNight(); e.preventDefault(); }
    }
    if (screen === "journal" && k === "escape") screen = journalFrom === "night" ? "night" : journalFrom;
  });
  window.addEventListener("blur", function () { if (screen === "night" && !dawn) paused = true; });

  // hooks for the screenshot tool and tests
  window.GLOWSILK_APP = {
    edition: ED, game: function () { return g; }, world: function () { return w; }, title: function () { return titleW; },
    start: function () { startNight(); msg = null; }, screen: function (s) { if (s) screen = s; return screen; }, setGame: function (str) { g = WEB.load(str); hasSave = true; },
    run: function (sec) { for (var t = 0; t < sec && !w.over; t += 1 / 60) { WEB.step(w, 1 / 60); w.events.forEach(function (e) { if (e.e === "dawn") dawn = { t: 0, sum: w.summary }; }); w.events.length = 0; } },
    hover: function (x, y) { mouse.x = x; mouse.y = y; }, help: function (v) { helpOpen = v; }, settings: settings, tool: function (t) { tool = t; }, endNight: function () { WEB.end(w); dawn = { t: 1, sum: w.summary }; }
  };
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
