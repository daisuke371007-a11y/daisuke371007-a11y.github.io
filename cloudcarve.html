<script>
// engine.js - CLOUDCARVE engine (global CC). Pure logic, no DOM, deterministic, runs in node and in the browser. Contract: API.md.
// The player is a rain cloud. Water on a 160x96 height field really runs downhill, picks up ground and drops it again; the ground that
// leaves the mask-shaped valley pays "silt" which buys upgrades. Everything here is plain arithmetic (+ - * / sqrt) so node and the browser
// give bit-identical states (no sin/cos/exp/pow anywhere in the simulation or the terrain).
// Demo/full: blocks between FULL-ONLY marker comments (valleys 4-8, their data and nodes) are deleted from the demo build; text between the
// DEMO-ONLY marker comments is live code only in the demo (SPEC section 8).
(function (root, factory) {
  var api = factory();
  if (typeof module === 'object' && module.exports) module.exports = api;
  else root.CC = api;
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  var W = 160, H = 96, N = W * H, DT = 1 / 30;
  var DEMO = false, SAVE_KEY = 'cloudcarve.v1';
  DEMO = true; SAVE_KEY = 'cloudcarve.demo.v1';
  var DEMO_VALLEYS = 3, VERSION = 1;

  // ============================================================================================
  // Rules (every number explained; the per-valley toughness/value live in CALIB at the bottom of this section)
  // ============================================================================================
  var R = {
    KF: 0.2,          // flow: fraction of the surface-height difference moved per substep and per lower neighbour (stable up to 0.25)
    EPS: 1e-6,        // water below this is dust: it evaporates and drops its sediment
    EMAX: 0.06,       // most ground one cell of sand can lose to the stream in one substep (divided by the hardness for other materials); it stops saw-tooth cuts that would ratchet the carving record
    DMAX: 0.05,       // most sediment one cell can drop in one substep
    CONC: 3,          // most sediment a cell of water can carry (share of its own volume) at Current strength 1
    KC: 3,            // carrying capacity per unit of water leaving a cell in one substep
    KS: 1.2,          // capacity bonus per unit of ground slope (steep water carries more)
    KE: 0.6,          // share of (capacity - load) picked up from the ground per substep (before hardness)
    KD: 0.45,         // share of (load - capacity) dropped per substep
    IMPACT: 0.07,     // ground thrown up per unit of rain depth by raindrops (divided by hardness)
    CUSHION: 3,       // deep water softens drops: impact / (1 + CUSHION * depth)
    EVAP: 0.0003,     // depth lost per second by every wet cell (slow: lakes must be able to fill)
    MELT: 1.1,        // snow volume melted per unit of rain depth on snow
    SNOWW: 3,         // water produced per unit of snow melted (snow is fluffy: meltwater floods)
    WIND: 0.015,      // blowing sand: depth per second returned to dry channel cells (salt flats, until Windbreak)
    WINDCAP: 0.45,    // ... but never more than this share of the carved depth (the record stays mostly carved)
    VENT: 0.8,        // hot vents: depth per second evaporated in the vent centre (falls to 0 at the radius)
    DEPTH: null,      // per valley depth multiplier of the mask (the calibration knob that sets the minutes; filled from CALIB below)
    FI: 6,            // flow iterations per substep (each is the stable pipe step with KF): more conductance without breaking stability
    RATE0: 0.7,       // base rain depth per second at the cloud centre
    RADIUS0: 5.5,     // base cloud radius in cells
    GATE0: 0.55,      // the nodes of valley 1 appear over the first 55% of the valley, those of later valleys over the first 85%
    GATE: 0.85,
    ENDLESS: 0.02,    // first-level price of the endless nodes: this share of the valley's tier price (then x1.08 per level bought in that valley)
    SETTLE: 0.06,     // last stretch: share of its remaining depth every uncarved mask cell loses per second by slumping ...
    SETTLE_FROM: 0.65,// ... starting at this carved share ...
    SETTLE_RAMP: 0.25,// ... and reaching full strength this much later
    KT: 0.5,          // slumping: share of the excess steepness (over the angle of repose) removed per pass
    FIN: 0.07,        // once 98% is carved the rest drops by this share of its remaining depth per substep (about 2 s)
    DONE: 0.98,       // carved share at which a valley counts as CARVED
    RELIC: 40,        // relic bonus in silt at valley value 1 (scaled by valley value)
    SEDMAX: 60, WMAX: 400, // sanity bounds used by the tests
    TICKS_DT_MAX: 0.25,    // one step() call never simulates more than this
    IDLE_EFF: 0.5,    // offline progress = measured storm rate x this (the player was away: be conservative)
    IDLE_EXACT: 60,   // seconds simulated for real before the coarse extrapolation starts
    IDLE_CAP: 28800,  // 8 h
    IDLE_MAXPCT: 97.5 // offline progress never completes a valley: the finish is the player's to see
  };

  // ============================================================================================
  // Materials: hardness h (times slower than sand), value v (silt per unit carved), soak (depth/s drained into the ground)
  // ============================================================================================
  var MAT = { SAND: 0, SOIL: 1, CLAY: 2, SANDSTONE: 3, SALT: 4, ASH: 5, SNOW: 6, GRANITE: 7 };
  var MATS = [
    { id: 'sand', name: 'Sand', h: 1, v: 1, soak: 0.0008, color: '#dcc183' },
    { id: 'soil', name: 'Soil', h: 1.5, v: 1.2, soak: 0.0006, color: '#9a6b46' },
    { id: 'clay', name: 'Clay', h: 3, v: 2, soak: 0, color: '#b9684c' },
    { id: 'sandstone', name: 'Sandstone', h: 6, v: 3, soak: 0.0002, color: '#c4673d' },
    { id: 'salt', name: 'Salt', h: 0.6, v: 1.5, soak: 0.0005, color: '#efe9de' },
    { id: 'ash', name: 'Ash', h: 0.8, v: 1.3, soak: 0.0012, color: '#6f6b69' },
    { id: 'snow', name: 'Snow', h: 2, v: 1, soak: 0, color: '#f1f6fb' },
    { id: 'granite', name: 'Granite', h: 25, v: 8, soak: 0, color: '#7b7f87' }
  ];
  var HARD = new Float64Array(8), VAL = new Float64Array(8), SOAK = new Float64Array(8);
  MATS.forEach(function (m, i) { HARD[i] = m.h; VAL[i] = m.v; SOAK[i] = m.soak; });

  // ============================================================================================
  // Small helpers (deterministic)
  // ============================================================================================
  function hash32(a, b, c) {
    var h = (a | 0) ^ 0x9e3779b9;
    h = Math.imul(h ^ (b | 0), 0x85ebca6b); h ^= h >>> 13;
    h = Math.imul(h ^ (c | 0), 0xc2b2ae35); h ^= h >>> 16;
    h = Math.imul(h, 0x27d4eb2f); h ^= h >>> 15;
    return h >>> 0;
  }
  function mulberry32(a) {
    return function () {
      a = (a + 0x6d2b79f5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function gRnd(g) {            // the game's own random stream, state saved in g.rs
    g.rs = (g.rs + 0x6d2b79f5) | 0;
    var a = g.rs, t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  function clamp(a, lo, hi) { return a < lo ? lo : a > hi ? hi : a; }
  function sm(t) { t = t < 0 ? 0 : t > 1 ? 1 : t; return t * t * (3 - 2 * t); }
  function cell01(x, y, s) { return hash32(x, y, s) / 4294967296; }
  function vnoise(x, y, s) {
    var xi = Math.floor(x), yi = Math.floor(y), fx = x - xi, fy = y - yi;
    fx = fx * fx * (3 - 2 * fx); fy = fy * fy * (3 - 2 * fy);
    var a = cell01(xi, yi, s), b = cell01(xi + 1, yi, s), c = cell01(xi, yi + 1, s), d = cell01(xi + 1, yi + 1, s);
    return a + (b - a) * fx + (c - a) * fy + (a - b - c + d) * fx * fy;
  }
  function fbm(x, y, s, sc) {       // 0..1, three octaves
    return 0.55 * vnoise(x / sc, y / sc, s) + 0.3 * vnoise(x / (sc * 0.5) + 17.3, y / (sc * 0.5) + 9.1, s + 1) + 0.15 * vnoise(x / (sc * 0.25) + 3.7, y / (sc * 0.25) + 21.9, s + 2);
  }

  // ============================================================================================
  // Valley table. CALIB (written by tools/calibrate.js): depth = how deep the carve mask goes (sets the minutes), value = silt multiplier (sets the income); tough = extra hardness (kept at 1).
  // ============================================================================================
  /* CALIB (rewritten by tools/calibrate.js --write; the markers keep the demo strip happy) */
  var CALIB = { depth: [6.8, 3.31, 18.99 ],
    value: [0.07193, 0.2554, 0.1908 ],
    tough: [1, 1, 1 ] };
  /* END-CALIB */
  var TARGET = [3.4, 3.8, 4.7 ];    // minutes the good bot needs per valley (demo 11, full 67). Valleys 4 and 6 sit at the deepest carve the land allows, so they are shorter than the wished 6 and 13
  var VALLEYS = [
    { k: 0, id: 'wash', name: 'Dry Wash', blurb: 'Sand and soil sloping to the sea. Rain high up and let the river cut.', gimmick: 'none', piece: 'Beached Whale', hue: 38 },
    { k: 1, id: 'mesa', name: 'Red Mesa', blurb: 'Hard sandstone bands. The river has to cut through the cliffs.', gimmick: 'hard layers', piece: 'Dinosaur', hue: 14 },
    { k: 2, id: 'basin', name: 'Clay Basin', blurb: 'Clay holds the rain in a lake. Carve the rim and let it spill.', gimmick: 'lake', piece: 'Sunken Village', hue: 10 },
  ];
  R.DEPTH = CALIB.depth;
  VALLEYS.forEach(function (m, k) { m.tough = CALIB.tough[k]; m.value = CALIB.value[k]; m.target = TARGET[k]; });

  // ============================================================================================
  // Terrain generation. Each valley: river course(s) from high ground to a sea edge, a V-shaped valley around them whose floor follows the
  // course, a hand-made hook (lake rim, boulders, snowpack, vents...), a carve mask along the courses plus a flat "dig bench" holding the set
  // piece, strata bands with tilt, and relics laid out as the parts of the set piece.
  // ============================================================================================
  function makePath(pts) {
    var p = pts.slice();
    for (var it = 0; it < 2; it++) {           // Chaikin corner cutting keeps the end points
      var q = [p[0]];
      for (var i = 0; i < p.length - 1; i++) {
        var a = p[i], b = p[i + 1];
        q.push([a[0] * 0.75 + b[0] * 0.25, a[1] * 0.75 + b[1] * 0.25], [a[0] * 0.25 + b[0] * 0.75, a[1] * 0.25 + b[1] * 0.75]);
      }
      q.push(p[p.length - 1]); p = q;
    }
    var n = p.length, X = new Float64Array(n), Y = new Float64Array(n), C = new Float64Array(n);
    for (var j = 0; j < n; j++) { X[j] = p[j][0]; Y[j] = p[j][1]; if (j) C[j] = C[j - 1] + Math.sqrt((X[j] - X[j - 1]) * (X[j] - X[j - 1]) + (Y[j] - Y[j - 1]) * (Y[j] - Y[j - 1])); }
    return { n: n, X: X, Y: Y, C: C, L: C[n - 1] };
  }
  var ND = 0, NT = 0;                               // results of nearest()
  function nearest(P, x, y) {
    var best = 1e18, bt = 0;
    for (var j = 0; j < P.n - 1; j++) {
      var ax = P.X[j], ay = P.Y[j], dx = P.X[j + 1] - ax, dy = P.Y[j + 1] - ay, l2 = dx * dx + dy * dy;
      var u = l2 > 0 ? ((x - ax) * dx + (y - ay) * dy) / l2 : 0; u = u < 0 ? 0 : u > 1 ? 1 : u;
      var ex = x - (ax + dx * u), ey = y - (ay + dy * u), d2 = ex * ex + ey * ey;
      if (d2 < best) { best = d2; bt = (P.C[j] + u * Math.sqrt(l2)) / P.L; }
    }
    ND = Math.sqrt(best); NT = bt;
  }
  var PX = 0, PY = 0, TX = 1, TY = 0;               // results of pathPos()
  function pathPos(P, t) {
    var s = t * P.L, j = 0; while (j < P.n - 2 && P.C[j + 1] < s) j++;
    var l = P.C[j + 1] - P.C[j], u = l > 0 ? (s - P.C[j]) / l : 0; u = clamp(u, 0, 1);
    PX = P.X[j] + (P.X[j + 1] - P.X[j]) * u; PY = P.Y[j] + (P.Y[j + 1] - P.Y[j]) * u;
    TX = l > 0 ? (P.X[j + 1] - P.X[j]) / l : 1; TY = l > 0 ? (P.Y[j + 1] - P.Y[j]) / l : 0;
  }
  function prof(s) { return s >= 1 ? 1 : 1 - (1 - s) * (1 - s); }   // V-shaped valley with a rounded top: steep near the river

  // priority-flood with a tiny epsilon: every cell gets a strictly lower neighbour towards the sea, so water can never be trapped by accident.
  // 'protect' cells (the Clay Basin bowl) keep their height: they are the one pit that is meant to be there.
  function fillPits(z, outlet, protect, eps) {
    var hz = new Float64Array(N + 8), hi = new Int32Array(N + 8), hn = 0, seen = new Uint8Array(N), lv = new Float64Array(N), i;
    function push(zz, ii) { var p = hn++; while (p > 0) { var q = (p - 1) >> 1; if (hz[q] <= zz) break; hz[p] = hz[q]; hi[p] = hi[q]; p = q; } hz[p] = zz; hi[p] = ii; }
    function pop() { var zz = hz[--hn], ii = hi[hn], p = 0; while (true) { var c = 2 * p + 1; if (c >= hn) break; if (c + 1 < hn && hz[c + 1] < hz[c]) c++; if (hz[c] >= zz) break; hz[p] = hz[c]; hi[p] = hi[c]; p = c; } hz[p] = zz; hi[p] = ii; }
    for (i = 0; i < N; i++) if (outlet[i]) { seen[i] = 1; lv[i] = z[i]; push(z[i], i); }
    while (hn > 0) {
      var cz = hz[0], ci = hi[0]; pop();
      var cx = ci % W, cy = (ci - cx) / W;
      for (var d = 0; d < 4; d++) {
        var nx = cx + (d === 0 ? 1 : d === 1 ? -1 : 0), ny = cy + (d === 2 ? 1 : d === 3 ? -1 : 0);
        if (nx < 0 || ny < 0 || nx >= W || ny >= H) continue;
        var ni = ny * W + nx; if (seen[ni]) continue; seen[ni] = 1;
        var level = cz + eps;
        if (protect && protect[ni]) { lv[ni] = z[ni] > level ? z[ni] : level; push(lv[ni], ni); }
        else { if (z[ni] < level) z[ni] = level; lv[ni] = z[ni]; push(z[ni], ni); }
      }
    }
  }

  function blankValley(k) {
    return {
      k: k, w: W, h: H, n: N,
      ground: new Float64Array(N), water: new Float64Array(N), sed: new Float64Array(N), low: new Float64Array(N),
      orig: new Float64Array(N), bedrock: new Float64Array(N), need: new Float64Array(N),
      mat: new Uint8Array(N), target: new Uint8Array(N), relic: new Int16Array(N).fill(-1), outlet: new Uint8Array(N),
      shift: new Float32Array(N), capT: new Float32Array(N), capMat: 0, sb: [], sm: [],
      relics: [], setpiece: null, mask: null, outCells: null, vents: [], lake: null, course: null, seaSide: 'E',
      dirty: new Uint8Array(N), dl: new Int32Array(N), dn: 0,
      spillCell: 0, wind: false, needTotal: 1, cvol: 0, pay: 0, tick: 0,
      eroded: 0, deposited: 0, exitW: 0, exitS: 0, blast: 0, melted: 0, windAdded: 0,
      done: false, fin: 0, streamed: false, spilled: false, lakePeak: 0, lakeVol: 0, relicsGot: 0, earned: 0
    };
  }

  function matAt(v, i, gr) {
    var d = v.orig[i] - gr;
    if (d < -0.02) return MAT.SAND;                // fresh deposits are loose sand
    if (d < v.capT[i]) return v.capMat;
    d -= v.shift[i];
    var sb = v.sb, j = 0, n = sb.length;
    while (j < n && d >= sb[j]) j++;
    return v.sm[j];
  }

  /*
   * Valley specs. paths[0] is the main river (zTop..zEnd = bed height at source / mouth, mix 1 = linear bed, 0 = steeper at the top);
   * later paths are side canyons joining the main river. A = valley wall rise, Wv = valley half width, wm = mask half width,
   * n0..n1 = depth the mask asks for (source..mouth), bump = mask widening around parameter bumpT. strata: bands (thresholds sb, materials sm)
   * with tilt (ax, ay) and wobble amp. piece: the set piece dig bench beside the river at parameter t (side +-1, distance off, half size rx, ry,
   * dig = depth asked) with its parts [kind, u, v, depthShare] (u, v in -1..1 inside the bench).
   */
  var SPECS = [
    { // 0 Dry Wash
      sea: 'E', lift: 4, nMin: 0.6, noise: [1.0, 14], wind: false,
      paths: [
        { pts: [[4, 16], [26, 24], [48, 14], [70, 30], [94, 42], [116, 36], [138, 48], [159, 47]], zTop: 62, zEnd: 7.5, mix: 0.55, A: 15, Wv: 22, wm: 3.6, n0: 1.0, n1: 2.4, bumpT: 0.6, bumpW: 0.12, bumpA: 2.5 },
        { pts: [[36, 90], [52, 76], [66, 62], [82, 52], [94, 42]], zTop: 44, mix: 0.7, A: 12, Wv: 16, wm: 2.8, n0: 0.9, n1: 1.6 }
      ],
      strata: { sb: [1.6, 3.4, 4.6], sm: [MAT.SAND, MAT.SOIL, MAT.SAND, MAT.SOIL], ax: 1.2, ay: 0.8, amp: 0.7 },
      piece: { id: 'whale', t: 0.6, side: 1, off: 12, rx: 14, ry: 5, dig: 2.2, parts: [['skull', -0.9, 0, 0.85], ['jaw', -0.62, 0.45, 0.65], ['rib', -0.3, -0.6, 0.55], ['rib', -0.05, 0.62, 0.6], ['rib', 0.2, -0.62, 0.5], ['rib', 0.44, 0.6, 0.7], ['spine', 0.12, 0, 0.8], ['tail', 0.88, 0, 0.9]] }
    },
    { // 1 Red Mesa
      sea: 'S', lift: 8, nMin: 0.7, noise: [1.4, 12], wind: false,
      paths: [
        { pts: [[30, 4], [22, 24], [50, 36], [44, 56], [70, 66], [96, 60], [112, 78], [118, 95]], zTop: 66, zEnd: 8.5, mix: 0.6, A: 22, Wv: 24, wm: 4.4, n0: 1.6, n1: 3.4, bumpT: 0.45, bumpW: 0.1, bumpA: 3.2 },
        { pts: [[140, 14], [132, 34], [110, 46], [96, 60]], zTop: 50, mix: 0.7, A: 16, Wv: 16, wm: 3.4, n0: 1.2, n1: 2.0 }
      ],
      shape: function (r) { var T = 6, q = r / T, f = Math.floor(q), fr = q - f; return T * (f + sm((fr - 0.62) / 0.38)) + 0.05 * r; },
      strata: { sb: [0.9, 3.0, 4.2, 7.0], sm: [MAT.SAND, MAT.SANDSTONE, MAT.SAND, MAT.SANDSTONE, MAT.SAND], ax: 1.5, ay: -1.1, amp: 0.6 },
      piece: { id: 'dino', t: 0.42, side: -1, off: 13, rx: 12, ry: 7, dig: 3.2, parts: [['skull', -0.9, -0.15, 0.85], ['jaw', -0.65, 0.2, 0.65], ['neck', -0.4, -0.3, 0.6], ['rib', -0.1, -0.55, 0.55], ['rib', 0.1, 0.5, 0.65], ['hip', 0.35, 0, 0.8], ['leg', 0.25, 0.7, 0.9], ['tail', 0.85, 0.15, 0.8]] }
    },
    { // 2 Clay Basin: a bowl with a low notch in its east rim; the river starts on the bowl floor
      sea: 'E', lift: 12, nMin: 0.6, noise: [0.7, 12], wind: false, basin: { cx: 54, cy: 50, rx: 30, ry: 21, ex: 82, ey: 47, crest: 2.6 },
      paths: [
        { pts: [[30, 55], [48, 52], [66, 49], [84, 46], [104, 40], [126, 46], [159, 38]], zTop: 50, zEnd: 8, mix: 0.6, A: 16, Wv: 22, wm: 4.4, n0: 1.2, n1: 3.0, bumpT: 0.38, bumpW: 0.07, bumpA: 3 }
      ],
      strata: { sb: [1.0, 2.6, 4.6], sm: [MAT.SOIL, MAT.CLAY, MAT.SOIL, MAT.SANDSTONE], ax: 0.6, ay: 0.6, amp: 0.5 },
      piece: { id: 'village', t: 0.06, side: 1, off: 6, rx: 12, ry: 6, dig: 1.8, bench: false, parts: [['roof', -0.7, -0.4, 0.85], ['roof', -0.1, 0.5, 0.7], ['roof', 0.55, -0.3, 0.9], ['well', 0.1, -0.5, 0.6], ['bell', -0.4, 0.4, 0.75], ['cart', 0.8, 0.5, 0.55], ['chimney', 0.3, 0.1, 0.8]] }
    },
  ];

  function genValley(k, seed) {
    var sp = SPECS[k]; if (!sp) return null;
    seed = seed | 0;
    var v = blankValley(k), z = v.ground, i, x, y, j, d;
    var hs = hash32(seed, k, 77), rg = mulberry32(hs ^ 0x1234567);
    var np = sp.paths.length, paths = [], PD = [], PT = [], pp = [];
    for (j = 0; j < np; j++) { paths.push(makePath(sp.paths[j].pts)); PD.push(new Float32Array(N)); PT.push(new Float32Array(N)); var o = {}; for (var key in sp.paths[j]) o[key] = sp.paths[j][key]; pp.push(o); }
    function bedOf(p, t) { var u = 1 - t; return p.zEnd + (p.zTop - p.zEnd) * u * (p.mix + (1 - p.mix) * u); }

    box(x, y0, w, h, { fill: 'rgba(14,18,27,0.97)', border: hexA(BRC[n.branch] || P.accent, 0.8) });
    txt(n.name, x + 14, y0 + 28, 18, P.text, { bold: true });
    var y = wrap(n.desc, x + 14, y0 + 54, mw, 14, 20, P.text, {});
    y = wrap(n.effect, x + 14, y + 8, mw, 13, 18, P.accent, {});
    wrap(st, x + 14, y + 8, mw, 13, 18, n.can ? P.good : P.warn, { bold: true });
  }

  function drawBottom() {
    var y0 = MAP.y + MAP.h;      // 640
    ctx.fillStyle = hexA(P.panel, 1); ctx.fillRect(0, y0, MAP.w, H - y0);
    ctx.fillStyle = 'rgba(255,255,255,0.08)'; ctx.fillRect(0, y0, MAP.w, 1);
    if (!S) return;
    if (nextValleyAvail()) {
      button('next_valley', 16, y0 + 12, 460, 56, 'NEXT VALLEY: ' + CC.VALLEYS[g.vk + 1].name, function () { openValleyUi(g.vk + 1); }, { primary: true, pulse: true, size: 20, col: P.good });
      txt('This valley is carved.', 492, y0 + 36, 14, P.text, { bold: true }); txt('Keep playing here, or move on.', 492, y0 + 56, 13, P.dim, {});
    } else if (endAvail()) {
      button('see_end', 16, y0 + 12, 460, 56, END_LABEL, function () { openModal(END_TYPE, {}); }, { primary: true, pulse: true, size: 20, col: P.silt });
    } else {
      var any = false, open = false; for (var i = 0; i < S.nodes.length; i++) { var nd = S.nodes[i]; if (nd.visible && nd.can) any = true; if (nd.visible && !nd.maxed) open = true; }
      var tip = any ? 'You can afford an upgrade - click one in the panel on the right.' : S.carved >= 98 ? 'The rest of the valley is finishing itself.' :
        !open ? (g.vk + 1 < NV ? 'All upgrades here are maxed - finish this valley to unlock more.' : 'All upgrades are bought - carve the rest of the valley.') :       // nothing left to spend silt on: say why, so the wait does not look like a bug
        'Rain on high ground and let the water carve the river down to the sea.';
      txt(fit(tip, 770, 18, true), 16, y0 + 32, 18, P.text, { bold: true });
      txt(touchy() ? 'Touch and drag: rain    Tap: lightning (after the Lightning Rod)' : 'Mouse: rain    Click or Space: lightning (after the Lightning Rod)    Esc or P: pause    M: sound', 16, y0 + 58, 13, P.dim, {});
    }
    if (saveFailed) txt('Progress is NOT being saved (browser storage is blocked).', 16, y0 + 76, 12, P.warn, { bold: true });
    else if (T - noteAt < 4) txt(noteMsg, 16, y0 + 76, 12, P.warn, { bold: true });
    button('sound', 806, y0 + 8, 146, 32, 'Sound: ' + (ui.sfx || ui.music ? 'ON' : 'OFF') + ' (M)', toggleAllSound, { size: 13 });
    if (!modal && !crash) placeAnchor('buy', 806, y0 + 46, 146, 26, 13);
  }

  function drawBanner() {
    var b = null, p = 1, y;
    bannerTick();
    if (banner && T < banner.t0 + banner.dur) { b = banner; p = Math.min(1, (T - b.t0) / 0.25, (b.t0 + b.dur - T) / 0.5); }
    else if (!ui.seen.move && !celeb) { b = { msg: touchy() ? 'Touch the land to rain' : 'Move the mouse over the land to rain', big: true }; p = 1; }
    if (!b || celeb) return;
    var size = b.big ? 30 : 19; ctx.font = 'bold ' + size + 'px ' + FONT;
    var w = Math.min(MAP.w - 40, ctx.measureText(b.msg).width + 44), h = b.big ? 58 : 42, x = MAP.x + (MAP.w - w) / 2;
    y = b.big ? MAP.y + 44 : MAP.y + MAP.h - 66;
    ctx.globalAlpha = clamp(p, 0, 1);
    rr(x, y, w, h, h / 2); ctx.fillStyle = 'rgba(10,14,22,0.82)'; ctx.fill(); ctx.strokeStyle = 'rgba(255,255,255,0.22)'; ctx.lineWidth = 1.5; ctx.stroke();
    txt(fit(b.msg, w - 28, size, true), x + w / 2, y + h / 2 + size * 0.35, size, '#ffffff', { align: 'center', bold: true });
    ctx.globalAlpha = 1;
  }

  function drawCelebCard() {
    if (!celeb) return;
    var p = (T - celeb.t0) / 3;
    if (p < 1) return;
    var cx = MAP.x + MAP.w / 2, y = MAP.y + 300, k = celeb.k, v = CC.VALLEYS[k], nxt = k + 1 < NV && g.unlocked > k + 1 ? CC.VALLEYS[k + 1] : null;
    var a = clamp((p - 1) * 3, 0, 1);
    ctx.globalAlpha = a;
    box(cx - 280, y, 560, 230, { fill: 'rgba(14,18,27,0.94)', border: hexA(P.good, 0.8), lw: 2 });
    txt(v.name + ' is carved!', cx, y + 48, 30, P.text, { align: 'center', bold: true });
    var got = g.v.relicsGot, tot = g.v.relics.length;
    txt(got === tot ? 'Set piece complete: ' + v.piece : 'Relics found: ' + got + '/' + tot + '   (you can still dig for the rest)', cx, y + 78, 16, got === tot ? P.good : P.dim, { align: 'center' });
    if (celeb.after && MODALS[celeb.after]) {
      button('celeb_end', cx - 230, y + 108, 460, 56, celeb.after === 'ending' ? 'CONTINUE' : 'CONTINUE', function () { if (!celeb) return; var a2 = celeb.after; celeb = null; openModal(a2, {}); }, { primary: true, size: 21, col: P.good });
    } else if (nxt) {
      button('celeb_next', cx - 230, y + 108, 460, 56, 'NEXT VALLEY: ' + nxt.name, function () { openValleyUi(k + 1); }, { primary: true, size: 21, col: P.good });
    } else {
      button('celeb_ok', cx - 230, y + 108, 460, 56, 'CONTINUE', function () { celeb = null; }, { primary: true, size: 21, col: P.good });
    }
    button('celeb_stay', cx - 120, y + 176, 240, 40, 'Stay in this valley', function () { celeb = null; }, { size: 15 });
    ctx.globalAlpha = 1;
  }

  function drawPlay() {
    ctx.fillStyle = P.bg; ctx.fillRect(0, 0, W, H);
    drawMapArea();
    drawHud(); drawPanel(); drawBottom();
    drawBanner(); drawCelebCard(); drawTooltip();
  }

  // ------------------------------------------------------------------ DOM links
  function placeAnchor(id, x, y, w, h, size) {
    var a = anchors[id] || (anchors[id] = document.getElementById(id)); if (!a) return;
    anchorWant[id] = 1;
    var s = 'left:' + x + 'px;top:' + y + 'px;width:' + w + 'px;height:' + h + 'px;line-height:' + (h - 4) + 'px;font-size:' + (size || 16) + 'px;display:block';
    if (a._s !== s) { a.style.cssText = s; a._s = s; }
  }
  function syncAnchors() {
    for (var id in anchors) if (anchors[id] && !anchorWant[id] && anchors[id]._s !== 'off') { anchors[id].style.display = 'none'; anchors[id]._s = 'off'; }
    anchorWant = {};
  }

  // ------------------------------------------------------------------ input
  function setMouse(e) {
    var r = cv.getBoundingClientRect();
    mouse.x = (e.clientX - r.left) * (W / r.width); mouse.y = (e.clientY - r.top) * (H / r.height);
    mouse.in = mouse.x >= 0 && mouse.y >= 0 && mouse.x < W && mouse.y < H;
    mouse.type = e.pointerType === 'touch' ? 'touch' : 'mouse';
    if (mouse.type === 'touch') touchSeen = true;
  }
  function hitBtn() {
    for (var i = btns.length - 1; i >= 0; i--) { var b = btns[i]; if (mouse.x >= b.x && mouse.x < b.x + b.w && mouse.y >= b.y && mouse.y < b.y + b.h) return b; }
    return null;
  }
  function inList() { return screen === 'play' && !modal && mouse.x >= LV.x && mouse.y >= LV.y && mouse.x < LV.x + LV.w && mouse.y < LV.y + LV.h; }
  cv.addEventListener('pointermove', function (e) {
    setMouse(e);
    if (pdrag) {
      var dy = mouse.y - pdrag.y0;
      if (!pdrag.moved && Math.abs(dy) > 8) pdrag.moved = true;
      if (pdrag.moved) pscroll = clamp(pdrag.s0 - dy, 0, pscrollMax);
    }
  });
  cv.addEventListener('pointerleave', function () { if (!mouse.down) mouse.in = false; if (!mouse.down) lastCell = null; });
  cv.addEventListener('pointerdown', function (e) {
    setMouse(e); initAudio();
    if (e.button !== 0 && e.pointerType !== 'touch') return;
    mouse.down = true; downAt = { t: performance.now(), x: mouse.x, y: mouse.y };
    try { cv.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
    downBtn = hitBtn();
    pdrag = inList() ? { y0: mouse.y, s0: pscroll, moved: false } : null;
    if (!downBtn && screen === 'play' && !modal && !playBlocked() && mapCell() && mouse.type !== 'touch' && S && S.bolt) pendingStrike = true;
  });
  window.addEventListener('pointerup', function (e) {
    if (e && e.clientX != null && e.target === cv) setMouse(e);
    initAudio();
    var b = downBtn, up = mouse.down ? hitBtn() : null, moved = pdrag && pdrag.moved;
    // a quick tap on the map with a finger is a lightning strike
    if (mouse.down && mouse.type === 'touch' && downAt && screen === 'play' && !modal && !playBlocked() && !b && S && S.bolt && mapCell() &&
        performance.now() - downAt.t < 260 && Math.abs(mouse.x - downAt.x) < 14 && Math.abs(mouse.y - downAt.y) < 14) { pendingStrike = true; strikeCell = mapCell(); }
    mouse.down = false; downBtn = null; pdrag = null; downAt = null;
    if (mouse.type === 'touch') { mouse.in = false; lastCell = null; }
    if (e && e.pointerId != null) { try { cv.releasePointerCapture(e.pointerId); } catch (err) { /* ignore */ } }
    if (b && up && up.id === b.id && !moved) {
      if (b.disabled) sfx('cantbuy'); else { if (!b.tile) sfx('click'); try { b.fn(); } catch (ex) { logErr('button ' + b.id, ex); } }
    }
  });
  window.addEventListener('pointercancel', function () { mouse.down = false; downBtn = null; pdrag = null; if (mouse.type === 'touch') { mouse.in = false; lastCell = null; } });
  cv.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  cv.addEventListener('wheel', function (e) {
    e.preventDefault();
    setMouse(e);
    if (screen === 'play' && !modal && mouse.x >= PAN.x) pscroll = clamp(pscroll + (e.deltaMode === 1 ? e.deltaY * 40 : e.deltaY), 0, pscrollMax);
  }, { passive: false });
  window.addEventListener('keydown', function (e) {
    var k = (e.key || '').toLowerCase();
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    initAudio();
    keyDown[k] = true;
    if ([' ', 'arrowup', 'arrowdown', 'arrowleft', 'arrowright'].indexOf(k) >= 0) e.preventDefault();
    if (crash) return;
    if (k === 'escape') {
      if (modal) { var d = MODALS[modal.type]; if (d && d.esc) d.esc(); return; }
      if (celeb && playBlocked()) { openPause(false); return; }
      if (screen === 'play') openPause(false);
      return;
    }
    if (k === 'm') { toggleAllSound(); return; }
    if (k === 'f' && screen === 'play') { toggleFs(); return; }
    if (k === 'p' && screen === 'play') { if (modal && modal.type === 'pause') closeModal(); else openPause(false); return; }
    if (k === 'enter' || k === ' ') {
      if (screen === 'title' && !modal) { startGame(); return; }
      if (modal && (modal.type === 'welcome' || modal.type === 'pause' || modal.type === 'help')) { closeModal(); return; }
    }
    if (k === ' ' && screen === 'play' && !modal && !playBlocked() && S && S.bolt && (cloud || mapCell())) pendingStrike = true;
  });
  window.addEventListener('keyup', function (e) { keyDown[(e.key || '').toLowerCase()] = false; });
  function pauseForLeave() {
    if (screen === 'play' && !modal && !crash) openPause(true);
    mouse.down = false; downBtn = null; pdrag = null; keyDown = {};
  }
  window.addEventListener('blur', function () { pauseForLeave(); if (g && screen === 'play' && simDirty) saveNow(); });
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) {
      pauseForLeave(); sfxOff(); try { A.suspend(); } catch (e) { /* ignore */ }
      if (g && screen === 'play') saveNow();
    } else {
      try { A.resume(); } catch (e2) { /* ignore */ }
      if (g && screen === 'play' && !crash) {
        var away = CC.awaySeconds(g, Date.now());
        if (away > 60) {
          var rep = null; try { rep = CC.idle(g, away); } catch (e3) { logErr('idle', e3); }
          artCall('invalidate'); refreshStats();
          if (rep && (rep.silt > 0 || rep.relics > 0 || rep.to > rep.from + 0.01)) { saveNow(); modal = null; openModal('welcome', { rep: rep, away: away }); sfx('welcome'); }
        }
      }
    }
  });
  window.addEventListener('pagehide', function () { if (g && screen === 'play') saveNow(); });
  window.addEventListener('beforeunload', function () { if (g && screen === 'play') saveNow(); });
  window.addEventListener('error', function (e) { logErr('window', e && e.error ? e.error : (e && e.message)); });
  function fit2() {
    var s = Math.min(window.innerWidth / W, window.innerHeight / H) || 1;
    stage.style.transform = 'translate(' + Math.round((window.innerWidth - W * s) / 2) + 'px,' + Math.round((window.innerHeight - H * s) / 2) + 'px) scale(' + s + ')';
    var dpr = window.devicePixelRatio || 1, r = clamp(Math.round(s * dpr * 4) / 4, 1, 1.75);       // sharper text on big or high-density screens, capped for speed
    if (r !== fitR) { fitR = r; cv.width = Math.round(W * r); cv.height = Math.round(H * r); }
  }
  window.addEventListener('resize', fit2); fit2();

  // ------------------------------------------------------------------ main loop
  function frame(ts) {
    requestAnimationFrame(frame);
    var dt = Math.min(0.1, Math.max(0.0005, (ts - lastTs) / 1000)); if (!lastTs) dt = 0.016; lastTs = ts;
    lastDt = dt; T += dt;
    perf.ms.push(dt * 1000); if (perf.ms.length > 300) perf.ms.shift();
    try {
      btns = []; hoverBtn = false; shield = !!modal || !!crash;
      ctx.setTransform(fitR, 0, 0, fitR, 0, 0); ctx.globalAlpha = 1; ctx.shadowBlur = 0; ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
      if (!crash && screen === 'play' && !modal && !document.hidden) simulate(dt);
      if (screen === 'title') drawTitle(); else drawPlay();
      if (crash) { shield = false; btns.length = 0; ctx.fillStyle = 'rgba(6,9,14,0.72)'; ctx.fillRect(0, 0, W, H); MODALS.crash.draw({}); }
      else drawModal();
      if (fade > 0) { fade = Math.max(0, fade - dt * 3); ctx.fillStyle = 'rgba(16,20,28,' + fade + ')'; ctx.fillRect(0, 0, W, H); }
      syncAnchors();
      cv.style.cursor = (screen === 'play' && !modal && !crash && cloud && artOk.drawCloud && mapCell() && !playBlocked()) ? 'none' : (hoverBtn ? 'pointer' : 'default');
      if (screen === 'play' && !modal && !crash) {
        saveClock += dt;
        if (saveClock > 10) { saveClock = 0; if (simDirty) saveNow(); }
      }
    } catch (e) {
      logErr('frame', e);
      if (!crash) { crash = String(e && e.message || e); crashed = true; sfxOff(); }
    }
  }

  // ------------------------------------------------------------------ QA interface (read-only helpers for tools/ui_qa.js)
  window.CCUI = {
    state: function () {
      return { screen: screen, modal: modal ? modal.type : null, celeb: celeb ? { k: celeb.k, after: celeb.after, p: (T - celeb.t0) / 3 } : null, T: T, silt: g.silt, frag: g.frag, vk: g.vk, unlocked: g.unlocked,
        pct: S ? S.carved : 0, done: g.done.slice(), relics: g.v.relicsGot, bought: g.bought, earned: g.earned, wet: wet, banner: banner && T < banner.t0 + banner.dur ? banner.msg : null,
        movePrompt: !ui.seen.move, seenFlags: Object.keys(ui.seen), hasSave: hasSave, saveFailed: saveFailed, saves: saves, crash: crash, errors: errs.slice(), artFail: Object.assign({}, artFail),
        cloud: cloud ? { x: cloud.x, y: cloud.y } : null, rainSecs: rainSecs, simSecs: simSecs, won: g.won, pscroll: pscroll, pscrollMax: pscrollMax, fitR: fitR, audio: audioOn, sfx: ui.sfx, music: ui.music, t: g.t };
    },
    game: function () { return g; }, stats: function () { return S; },
    buttons: function () { return btns.map(function (b) { return { id: b.id, label: b.label, disabled: b.disabled, x: b.x + b.w / 2, y: b.y + b.h / 2, w: b.w, h: b.h }; }); },
    anchors: function () { var o = []; for (var id in anchors) { var a = anchors[id]; if (a && a.style.display === 'block') o.push({ id: id, href: a.href, x: a.offsetLeft + a.offsetWidth / 2, y: a.offsetTop + a.offsetHeight / 2, w: a.offsetWidth, h: a.offsetHeight, text: a.textContent, target: a.target, rel: a.rel }); } return o; },
    toCanvas: function (x, y) { var r = cv.getBoundingClientRect(); return { x: r.left + x * r.width / W, y: r.top + y * r.height / H }; },
    cellToCanvas: function (cx, cy) { return { x: MAP.x + cx * CELL, y: MAP.y + cy * CELL }; },
    perf: function () { var a = perf.ms.slice().sort(function (x, y) { return x - y; }); return { avg: a.reduce(function (s, v) { return s + v; }, 0) / (a.length || 1), p95: a[Math.floor(a.length * 0.95)] || 0, n: a.length }; },
    saveNow: saveNow, save: function () { return lsGet(KEY); }, KEY: KEY, UIKEY: UIKEY, FULL_VALLEYS: FULL_VALLEYS, FULL_NODES: FULL_NODES, MAP: MAP, PAN: PAN,
    forceCrash: function () { crash = 'test'; crashed = true; }
  };

  boot();
  requestAnimationFrame(frame);
})();
</script>
