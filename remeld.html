<script>
// rummy.js — REMELD: tiles, melds, and how a hand scores.
// Pure logic, shared by the page, the bot and the tests.
(function (root) {
  "use strict";

  var COLORS = [
    { key: "ruby", name: "Ruby", hex: "#d1423b", mark: "circle" },
    { key: "sapphire", name: "Sapphire", hex: "#2c6bc9", mark: "triangle" },
    { key: "amber", name: "Amber", hex: "#d98c12", mark: "square" },
    { key: "onyx", name: "Onyx", hex: "#26252e", mark: "diamond" }
  ];
  var FINISHES = {
    gold: { name: "Gold", desc: "+$2 when played" },
    glass: { name: "Glass", desc: "x1.5 mult when played; 1 in 4 chance to shatter" },
    marble: { name: "Marble", desc: "+25 chips when played" },
    lucky: { name: "Lucky", desc: "1 in 3 chance of +10 mult when played" },
    steel: { name: "Steel", desc: "x1.5 mult while it stays in your rack" },
    ivory: { name: "Ivory", desc: "counts as every color" }
  };

  // meld types: base chips and mult at level 1, and what each level adds
  var TYPES = {
    TRIO: { name: "Trio", chips: 10, mult: 2, lc: 10, lm: 1, drink: "Gin Fizz" },
    QUARTET: { name: "Quartet", chips: 30, mult: 4, lc: 20, lm: 2, drink: "Sidecar" },
    RUN: { name: "Run", chips: 10, mult: 2, lc: 10, lm: 1, drink: "Highball" },
    LONGRUN: { name: "Long Run", chips: 20, mult: 3, lc: 15, lm: 1, drink: "Old Fashioned" },
    BIGRUN: { name: "Big Run", chips: 35, mult: 4, lc: 20, lm: 2, drink: "Manhattan" },
    GRANDRUN: { name: "Grand Run", chips: 50, mult: 5, lc: 25, lm: 2, drink: "Sazerac" },
    LADDER: { name: "Ladder", chips: 150, mult: 13, lc: 50, lm: 4, drink: "French 75" }
  };
  var TYPE_KEYS = Object.keys(TYPES);
  var RUMMY_TILES = 7;
  function isGroupType(t) { return t === "TRIO" || t === "QUARTET"; }
  function runType(k) { return k === 3 ? "RUN" : k === 4 ? "LONGRUN" : k === 5 ? "BIGRUN" : k === 13 ? "LADDER" : "GRANDRUN"; }
  function typeValue(type, levels) {
    var T = TYPES[type], l = (levels && levels[type]) || 1;
    return { chips: T.chips + T.lc * (l - 1), mult: T.mult + T.lm * (l - 1) };
  }

  // --- what a set of tiles makes ---
  // rules: { minRun } ; returns { valid, type, color, number, values{id:n}, why }
  function asRun(tiles, rules) {
    var k = tiles.length, minRun = (rules && rules.minRun) || 3;
    if (k < minRun || k > 13) return null;
    var color = -1, nums = {}, lo = 99, hi = 0, real = 0;
    for (var i = 0; i < k; i++) {
      var t = tiles[i];
      if (t.wild) continue;
      if (t.fin !== "ivory") { if (color >= 0 && color !== t.c) return null; color = t.c; }
      if (nums[t.n]) return null;
      nums[t.n] = 1; real++;
      lo = Math.min(lo, t.n); hi = Math.max(hi, t.n);
    }
    var start;
    if (!real) start = 14 - k;
    else {
      if (hi - lo + 1 > k) return null;
      start = Math.min(lo, 14 - k);
      if (start + k - 1 < hi) return null;
    }
    // wilds take the missing numbers, lowest first
    var values = {}, free = [];
    for (var v = start; v < start + k; v++) if (!nums[v]) free.push(v);
    tiles.forEach(function (t) { values[t.id] = t.wild ? free.shift() : t.n; });
    return { valid: true, type: runType(k), color: color, number: 0, start: start, values: values };
  }
  function asGroup(tiles) {
    var k = tiles.length;
    if (k < 3 || k > 4) return null;
    var num = 0, cols = {}, ivory = 0;
    for (var i = 0; i < k; i++) {
      var t = tiles[i];
      if (t.wild) continue;
      if (num && t.n !== num) return null;
      num = t.n;
      if (t.fin === "ivory") { ivory++; continue; }
      if (cols[t.c]) return null;
      cols[t.c] = 1;
    }
    var values = {};
    tiles.forEach(function (t) { values[t.id] = num || 13; });
    return { valid: true, type: k === 4 ? "QUARTET" : "TRIO", color: -1, number: num || 13, values: values };
  }
  function analyze(tiles, rules, levels) {
    var r = asRun(tiles, rules), g = asGroup(tiles);
    if (r && g) {
      var vr = typeValue(r.type, levels), vg = typeValue(g.type, levels);
      return vr.chips * vr.mult >= vg.chips * vg.mult ? r : g;
    }
    if (r || g) return r || g;
    var why = tiles.length < 3 ? "a meld needs 3 tiles" : "not a run or a group";
    if (tiles.length >= 3 && rules && rules.minRun > 3 && asRun(tiles, { minRun: 3 })) why = "runs must be " + rules.minRun + " long tonight";
    return { valid: false, why: why };
  }
  // display order: runs by number, groups by color
  function sortMeld(tiles, info) {
    var copy = tiles.slice();
    if (info && info.valid && info.values) copy.sort(function (a, b) { return info.values[a.id] - info.values[b.id] || a.c - b.c; });
    else copy.sort(function (a, b) { return (a.wild ? 99 : a.n) - (b.wild ? 99 : b.n) || a.c - b.c; });
    return copy;
  }

  // --- rearranged tiles ---
  // a table tile counts as rearranged when the table tiles it now shares a meld with are not the ones it started with
  function rearranged(startMelds, endMelds, placedIds) {
    var placed = {}, startOf = {}, out = [];
    placedIds.forEach(function (id) { placed[id] = 1; });
    startMelds.forEach(function (m, i) { m.forEach(function (t) { startOf[t.id] = i; }); });
    endMelds.forEach(function (m) {
      var tableIds = m.filter(function (t) { return !placed[t.id] && startOf[t.id] !== undefined; }).map(function (t) { return t.id; });
      tableIds.forEach(function (id) {
        var orig = startMelds[startOf[id]].map(function (t) { return t.id; });
        var same = orig.length === tableIds.length && orig.every(function (o) { return tableIds.indexOf(o) >= 0; });
        if (!same) out.push(id);
      });
    });
    return out;
  }

  // --- scoring a hand ---
  // ctx: { melds:[[tiles]], startMelds:[[tiles]], placed:[tiles in play order], rack:[tiles left], levels, rules, regs:[{def,st}],
  //        handNo, handsLeft, drawsUsed, rng, run }
  // returns { chips, mult, total, steps:[...], money, broken:[ids], rummy, affected:[meld indexes], infos }
  function scoreHand(ctx) {
    var rules = ctx.rules || {}, levels = ctx.levels || {}, regs = ctx.regs || [], rng = ctx.rng || Math.random;
    var placedIds = ctx.placed.map(function (t) { return t.id; }), placedSet = {};
    placedIds.forEach(function (id) { placedSet[id] = 1; });
    var moved = rearranged(ctx.startMelds, ctx.melds, placedIds), movedSet = {};
    moved.forEach(function (id) { movedSet[id] = 1; });
    var S = { chips: 0, mult: 0, steps: [], money: 0, broken: [] };
    function add(src, eff, text, ref) {
      if (eff.chips) S.chips += eff.chips;
      if (eff.mult) S.mult += eff.mult;
      if (eff.xmult) S.mult *= eff.xmult;
      if (eff.money) S.money += eff.money;
      S.steps.push({ src: src, chips: eff.chips || 0, mult: eff.mult || 0, xmult: eff.xmult || 0, money: eff.money || 0, text: text, ref: ref, after: { chips: S.chips, mult: S.mult } });
    }
    var infos = ctx.melds.map(function (m) { return analyze(m, rules, levels); });
    var affected = [];
    ctx.melds.forEach(function (m, i) {
      if (m.some(function (t) { return placedSet[t.id] || movedSet[t.id]; })) affected.push(i);
    });
    var hand = { placed: ctx.placed, melds: ctx.melds, infos: infos, affected: affected, moved: moved, rack: ctx.rack, handNo: ctx.handNo || 1,
      handsLeft: ctx.handsLeft || 0, drawsUsed: ctx.drawsUsed || 0, rummy: ctx.placed.length >= RUMMY_TILES, sweep: ctx.rack.length === 0 && ctx.placed.length > 0, rules: rules, run: ctx.run, table: ctx.table };
    hand.types = affected.map(function (i) { return infos[i].type; });
    hand.rng = rng; hand.regs = regs;
    hand.movedTiles = [];
    ctx.melds.forEach(function (m) { m.forEach(function (t) { if (movedSet[t.id]) hand.movedTiles.push(t); }); });
    hand.colorsPlaced = {};
    ctx.placed.forEach(function (t) { if (!t.wild) hand.colorsPlaced[t.c] = 1; });
    function debuffed(t) {
      if (t.wild) return false;
      if (rules.debuffColor !== undefined && t.c === rules.debuffColor && t.fin !== "ivory") return true;
      if (rules.ceiling && t.n > rules.ceiling) return true;
      return false;
    }
    // 1. the melds you made or changed
    S.mult = 1;
    affected.forEach(function (i) {
      var info = infos[i];
      if (rules.noGroups && isGroupType(info.type)) { S.steps.push({ src: "rule", text: TYPES[info.type].name + ": groups don't score tonight", ref: { meld: i }, chips: 0, mult: 0, after: { chips: S.chips, mult: S.mult } }); return; }
      var v = typeValue(info.type, levels);
      add("meld", { chips: v.chips, mult: v.mult }, TYPES[info.type].name, { meld: i });
      regs.forEach(function (r, ri) { if (r.def.meld) { var e = r.def.meld(r, info, hand, ctx.melds[i]); if (e) add("reg", e, r.def.name, { reg: ri, meld: i }); } });
    });
    // 2. each tile you played, in table order
    var order = [];
    ctx.melds.forEach(function (m, i) { m.forEach(function (t) { if (placedSet[t.id]) order.push({ t: t, meld: i }); }); });
    order.forEach(function (o) {
      var t = o.t;
      if (debuffed(t)) { S.steps.push({ src: "rule", text: "no score", ref: { tile: t.id }, chips: 0, mult: 0, after: { chips: S.chips, mult: S.mult } }); return; }
      if (!t.wild) add("tile", { chips: t.n }, "+" + t.n, { tile: t.id });
      if (t.fin === "marble") add("tile", { chips: 25 }, "Marble", { tile: t.id });
      if (t.fin === "lucky" && rng() < 1 / 3 * (hand.run && hand.run.luckBoost ? 2 : 1)) add("tile", { mult: 10 }, "Lucky!", { tile: t.id });
      if (t.fin === "gold") add("tile", { money: 2 + (hand.run && hand.run.goldBonus || 0) }, "Gold", { tile: t.id });
      if (t.fin === "glass") {
        add("tile", { xmult: 1.5 }, "Glass", { tile: t.id });
        if (!(hand.run && hand.run.glassSafe) && rng() < 0.25) S.broken.push(t.id);
      }
      regs.forEach(function (r, ri) { if (r.def.tile) { var e = r.def.tile(r, t, hand); if (e) add("reg", e, r.def.name, { reg: ri, tile: t.id }); } });
    });
    // 3. rearranging
    if (moved.length && !rules.noRemeld) {
      add("remeld", { mult: moved.length }, "Remeld x" + moved.length, { moved: moved });
    }
    // 4. tiles kept in the rack
    ctx.rack.forEach(function (t) { if (t.fin === "steel" && !debuffed(t)) add("held", { xmult: 1.5 }, "Steel", { tile: t.id }); });
    // 5. the regulars, left to right
    regs.forEach(function (r, ri) { if (r.def.hand) { var e = r.def.hand(r, hand, S); if (e) add("reg", e, r.def.name, { reg: ri }); } });
    // 6. going out
    // 6. a big hand: RUMMY (7+ tiles), or a CLEAN SWEEP (the rack emptied)
    if (hand.rummy || hand.sweep) {
      var x = hand.sweep ? 3 : 2;
      regs.forEach(function (r) { if (r.def.rummyX) x += r.def.rummyX; });
      add("rummy", { xmult: x }, hand.sweep ? "CLEAN SWEEP!" : "RUMMY!", {});
    }
    S.total = Math.floor(S.chips * S.mult);
    S.rummy = hand.rummy || hand.sweep; S.sweep = hand.sweep; S.affected = affected; S.infos = infos; S.moved = moved; S.hand = hand;
    return S;
  }

  var api = { RUMMY_TILES: RUMMY_TILES, COLORS: COLORS, FINISHES: FINISHES, TYPES: TYPES, TYPE_KEYS: TYPE_KEYS, isGroupType: isGroupType, typeValue: typeValue,
    analyze: analyze, sortMeld: sortMeld, rearranged: rearranged, scoreHand: scoreHand };
  if (typeof module !== "undefined" && module.exports) module.exports = api;
  else root.RUMMY = api;
})(this);

</script>
<script>
// content.js — REMELD: the regulars, the drinks, the tools, the house rules and the perks.
(function (root) {
  "use strict";
  var R = typeof module !== "undefined" && module.exports ? require("./rummy.js") : root.RUMMY;
  var isGroup = R.isGroupType;
  function isLongRun(t) { return t === "BIGRUN" || t === "GRANDRUN" || t === "LADDER"; }
  function colorTile(c) { return function (r, t) { return !t.wild && t.c === c ? { mult: 3 } : null; }; }
  function neighbor(r, hand) { var i = hand.regs.indexOf(r); var n = hand.regs[i + 1]; return n && n.def.id !== "MIMIC" ? n : null; }

  // rarity: 1 common, 2 uncommon, 3 rare. demo: offered in the free demo
  var REGULARS = [
    { id: "BARTENDER", name: "The Bartender", rarity: 1, cost: 4, demo: 1, desc: "+4 mult", hand: function () { return { mult: 4 }; } },
    { id: "RUBY", name: "Ruby Rose", rarity: 1, cost: 4, demo: 1, desc: "Each Ruby tile played: +3 mult", tile: colorTile(0) },
    { id: "SAPPHIRE", name: "Sapphire Sam", rarity: 1, cost: 4, demo: 1, desc: "Each Sapphire tile played: +3 mult", tile: colorTile(1) },
    { id: "TRIOTOM", name: "Trio Tom", rarity: 1, cost: 5, demo: 1, desc: "Each group you make or change: +6 mult", meld: function (r, info) { return isGroup(info.type) ? { mult: 6 } : null; } },
    { id: "RUNNER", name: "Runner Rita", rarity: 1, cost: 5, demo: 1, desc: "Each run you make or change: +5 mult", meld: function (r, info) { return !isGroup(info.type) ? { mult: 5 } : null; } },
    { id: "LOWLARRY", name: "Low Larry", rarity: 1, cost: 4, demo: 1, desc: "Tiles 1 to 5 played: +10 chips each", tile: function (r, t) { return !t.wild && t.n <= 5 ? { chips: 10 } : null; } },
    { id: "HIGHHATTIE", name: "High Hattie", rarity: 1, cost: 4, demo: 1, desc: "Tiles 10 to 13 played: +2 mult each", tile: function (r, t) { return !t.wild && t.n >= 10 ? { mult: 2 } : null; } },
    { id: "PENNY", name: "Penny Pincher", rarity: 1, cost: 4, demo: 1, desc: "End of table: +$1 for each draw you didn't use", endTable: function (r, tb) { return tb.drawsLeft; } },
    { id: "GENEROUS", name: "Generous Gus", rarity: 1, cost: 5, demo: 1, desc: "+2 mult for each tile you play this hand", hand: function (r, h) { return { mult: 2 * h.placed.length }; } },
    { id: "MOVER", name: "The Mover", rarity: 2, cost: 6, demo: 1, desc: "Each tile you rearrange: +2 more mult", hand: function (r, h) { return h.moved.length ? { mult: 2 * h.moved.length } : null; } },
    { id: "ARCHITECT", name: "The Architect", rarity: 2, cost: 6, demo: 1, desc: "+15 chips for each meld on the table", hand: function (r, h) { return { chips: 15 * h.melds.length }; } },
    { id: "LADDERLIL", name: "Ladder Lil", rarity: 2, cost: 7, demo: 1, desc: "Runs of 5 or more: x2 mult", meld: function (r, info) { return isLongRun(info.type) ? { xmult: 2 } : null; } },
    { id: "SINGLEMALT", name: "Single Malt", rarity: 2, cost: 7, demo: 1, desc: "If you play exactly one tile: x3 mult", hand: function (r, h) { return h.placed.length === 1 ? { xmult: 3 } : null; } },
    { id: "SLOWBURN", name: "Slow Burn", rarity: 2, cost: 6, demo: 1, desc: "Gains +1 mult for every hand you play", scale: true,
      hand: function (r) { return r.st.v ? { mult: r.st.v } : null; }, after: function (r) { r.st.v = (r.st.v || 0) + 1; }, show: function (r) { return "+" + (r.st.v || 0) + " mult"; } },
    { id: "STEADY", name: "Steady Hand", rarity: 2, cost: 5, demo: 1, desc: "+1 draw at every table", passive: function (s) { s.draws++; } },
    
  ];

  var DRINKS = R.TYPE_KEYS.map(function (k) { return { id: "D_" + k, kind: "drink", type: k, name: R.TYPES[k].drink, cost: 3, desc: "Level up " + R.TYPES[k].name + " (+" + R.TYPES[k].lc + " chips, +" + R.TYPES[k].lm + " mult)" }; });

  // tools work on tiles selected in your rack (they change those tiles in your bag for good)
  var TOOLS = [
    { id: "CHISEL", name: "Chisel", cost: 3, pick: 2, desc: "Add 1 to up to 2 selected tiles", apply: function (t) { if (!t.wild && t.n < 13) t.n++; } },
    { id: "FILE", name: "File", cost: 3, pick: 2, desc: "Take 1 from up to 2 selected tiles", apply: function (t) { if (!t.wild && t.n > 1) t.n--; } },
    { id: "PAINT0", name: "Ruby Paint", cost: 3, pick: 3, desc: "Paint up to 3 selected tiles Ruby", apply: function (t) { t.c = 0; } },
    { id: "PAINT1", name: "Sapphire Paint", cost: 3, pick: 3, desc: "Paint up to 3 selected tiles Sapphire", apply: function (t) { t.c = 1; } },
    { id: "PAINT2", name: "Amber Paint", cost: 3, pick: 3, desc: "Paint up to 3 selected tiles Amber", apply: function (t) { t.c = 2; } },
    { id: "PAINT3", name: "Onyx Paint", cost: 3, pick: 3, desc: "Paint up to 3 selected tiles Onyx", apply: function (t) { t.c = 3; } },
    { id: "GILD", name: "Gold Leaf", cost: 3, pick: 1, desc: "Make 1 selected tile Gold (+$2 when played)", apply: function (t) { t.fin = "gold"; } },
    { id: "GLAZE", name: "Glaze", cost: 3, pick: 2, desc: "Make up to 2 selected tiles Glass (x1.5 mult)", apply: function (t) { t.fin = "glass"; } },
    { id: "MARBLE", name: "Marble Dust", cost: 3, pick: 2, desc: "Make up to 2 selected tiles Marble (+25 chips)", apply: function (t) { t.fin = "marble"; } },
    { id: "LUCKY", name: "Clover", cost: 3, pick: 2, desc: "Make up to 2 selected tiles Lucky", apply: function (t) { t.fin = "lucky"; } },
    { id: "STEEL", name: "Steel Plate", cost: 3, pick: 1, desc: "Make 1 selected tile Steel (x1.5 mult while held)", apply: function (t) { t.fin = "steel"; } },
    { id: "IVORY", name: "Ivory Wash", cost: 4, pick: 1, desc: "Make 1 selected tile Ivory (every color)", apply: function (t) { t.fin = "ivory"; } },
    { id: "TORCH", name: "Torch", cost: 3, pick: 2, desc: "Burn up to 2 selected tiles out of your bag", destroy: true },
    { id: "MOULD", name: "Mould", cost: 4, pick: 1, desc: "Add a copy of 1 selected tile to your bag", copy: true },
    { id: "WILDINK", name: "Wild Ink", cost: 5, pick: 1, desc: "Turn 1 selected tile into a Wild", apply: function (t) { t.wild = true; t.fin = null; } },
    { id: "TIPJAR", name: "Tip Jar", cost: 3, pick: 0, desc: "Double your money (up to +$20)", money: true }
  ];
  TOOLS.forEach(function (t) { t.kind = "tool"; });

  // the third table of every night has a house rule
  var BOSSES = [
    { id: "PURIST", name: "The Purist", desc: "Wild tiles can't be played", rules: { noWild: true } },
    { id: "STICKLER", name: "The Stickler", desc: "Runs must be at least 4 long", rules: { minRun: 4 } },
    { id: "SNOB", name: "The Snob", desc: "Groups score nothing", rules: { noGroups: true } },
    { id: "COLOR", name: "The Critic", desc: "One color scores nothing", rules: { debuffColor: 0 }, pickColor: true },
    { id: "CRAMPED", name: "Cramped Quarters", desc: "2 fewer tiles in your rack", rules: { rackMinus: 2 } },
    { id: "LASTCALL", name: "Last Call", desc: "Only 3 hands", rules: { handsMinus: 1 } },
    { id: "ROPE", name: "Velvet Rope", desc: "The house's melds can't be touched", rules: { lockHouse: true } },
    { id: "MISER", name: "The Miser", desc: "No draws", rules: { noDraws: true } },
    { id: "CEILING", name: "Low Ceiling", desc: "Tiles above 9 score no chips", rules: { ceiling: 9 } },
    { id: "ACCOUNTANT", name: "The Accountant", desc: "Every hand must play at least 3 tiles", rules: { minPlay: 3 } },
    { id: "TAXMAN", name: "The Taxman", desc: "Lose $1 for every tile you play", rules: { tax: 1 } },
    { id: "STILL", name: "Still Waters", desc: "Rearranging earns no bonus", rules: { noRemeld: true } }
  ];
  var FINAL_BOSS = { id: "OWNER", name: "The Owner", desc: "Runs must be 4 long, and only 3 hands", rules: { minRun: 4, handsMinus: 1 } };

  var PERKS = [
    { id: "LICENSE", name: "Late License", cost: 10, desc: "+1 hand at every table", apply: function (s) { s.hands++; } },
    { id: "FRESHDECK", name: "Fresh Rack", cost: 10, desc: "+1 draw at every table", apply: function (s) { s.draws++; } },
    { id: "WIDERACK", name: "Wide Rack", cost: 10, desc: "+1 tile in your rack", apply: function (s) { s.rack++; } },
    { id: "VIP", name: "VIP Lounge", cost: 10, desc: "+1 seat for a regular", apply: function (s) { s.slots++; } },
    { id: "HAPPYHOUR", name: "Happy Hour", cost: 10, desc: "Everything in the shop costs 25% less", apply: function (s) { s.discount = 0.75; } },
    { id: "SAVINGS", name: "Savings Book", cost: 10, desc: "Interest can reach $10 instead of $5", apply: function (s) { s.interestCap = 10; } },
    { id: "BACKBAR", name: "Back Bar", cost: 8, desc: "+1 slot for drinks and tools", apply: function (s) { s.consSlots++; } },
    { id: "SHUFFLE", name: "Lucky Shuffle", cost: 8, desc: "Shop rerolls cost $2 less", apply: function (s) { s.rerollOff = 2; } }
  ];

  var REG = {}; REGULARS.forEach(function (r) { REG[r.id] = r; });
  var CONS = {}; DRINKS.concat(TOOLS).forEach(function (c) { CONS[c.id] = c; });
  var BOSS = {}; BOSSES.concat([FINAL_BOSS]).forEach(function (b) { BOSS[b.id] = b; });
  var PERK = {}; PERKS.forEach(function (p) { PERK[p.id] = p; });

  var api = { REGULARS: REGULARS, DRINKS: DRINKS, TOOLS: TOOLS, BOSSES: BOSSES, FINAL_BOSS: FINAL_BOSS, PERKS: PERKS, REG: REG, CONS: CONS, BOSS: BOSS, PERK: PERK };
  if (typeof module !== "undefined" && module.exports) module.exports = api;
  else root.CONTENT = api;
})(this);

<script>
// run.js — REMELD: a run of eight nights. Tables, hands, draws, the cash-out, the shop.
(function (root) {
  "use strict";
  var node = typeof module !== "undefined" && module.exports;
  var R = node ? require("./rummy.js") : root.RUMMY, C = node ? require("./content.js") : root.CONTENT;

  var NIGHTS = 8;
  // the score a table asks for: the night's base, x1 / x1.5 / x2 for the three tables
  var BASE = [240, 680, 1400, 2500, 3900, 5200, 7000, 9000];
  var TABLE_X = [1, 1.3, 1.1];
  var STAKES = [
    { name: "Penny Stakes", desc: "The standard game", x: 1 },

    { name: "Dime Stakes", desc: "...and one draw fewer", x: 1.25, draws: -1 },
    { name: "Dollar Stakes", desc: "...and tables ask for 50% more", x: 1.5, draws: -1 },

  var DEMO_NIGHTS = 2;

    bag.push(tile(run, 0, 0, { wild: true })); bag.push(tile(run, 0, 1, { wild: true }));

  }

  function regPool(run) { return C.REGULARS.filter(function (r) { return !run.demo || r.demo; }); }
  function newRun(opts) {
    opts = opts || {};
    var run = { v: 1, seed: (opts.seed >>> 0) || 1, rs: (opts.seed >>> 0) || 1, demo: !!opts.demo, stake: opts.stake || 0, nextId: 1, night: 1, tableNo: 0,

  }
  function nightsTotal(run) { return run.demo ? DEMO_NIGHTS : NIGHTS; }

  function stats(run) {
    var st = STAKES[run.stake] || STAKES[0];
    var s = { hands: 4 + (st.hands || 0), draws: 3 + (st.draws || 0), rack: 10, slots: 5, consSlots: 2, discount: 1, interestCap: 5, rerollOff: 0,
      glassSafe: false, goldBonus: 0, luckBoost: false };
    run.perks.forEach(function (p) { C.PERK[p].apply(s); });
    run.regs.forEach(function (r) { var d = C.REG[r.id]; if (d.passive) d.passive(s); });
    return s;
  }
  function target(run, night, tableNo) {
    var base = night <= NIGHTS ? BASE[night - 1] : BASE[NIGHTS - 1] * Math.pow(1.7, night - NIGHTS);

    return Math.round(base * TABLE_X[tableNo] * x / 10) * 10;

  function bossOf(run, night) {
    if (night > NIGHTS) return C.BOSSES[(night * 7) % C.BOSSES.length];

  // two melds the house lays before you sit down
  function houseMeld(run, rules) {

  }

  function startTable(run) {

    var tb = { target: target(run, run.night, run.tableNo), score: 0, hands: hands, handsLeft: hands, draws: draws, drawsLeft: draws, handNo: 1, drawsUsed: 0,
      rackSize: Math.max(4, s.rack - (rules.rackMinus || 0)), rules: rules, boss: boss ? boss.id : null, pile: shuffle(run, run.bag.slice()), rack: [], melds: [], last: null };
    tb.melds.push(houseMeld(run, rules)); tb.melds.push(houseMeld(run, rules));
    tb.houseSets = tb.melds.map(function (m) { return m.map(function (t) { return t.id; }); });

  }

  // every tile at the table, by id

  }

  // checks a proposed table (melds as lists of tile ids). Returns { ok, error, melds, placed, rack, infos, bad:[meld index] }
  function check(run, proposal) {

      });

  }

  function regCtx(run) { return run.regs.map(function (r) { return { def: C.REG[r.id], st: r.st, id: r.id }; }); }
  function preview(run, proposal) {

  }
  function score(run, c, dry) {
    var tb = run.tb, s = stats(run), regs = regCtx(run);
    if (dry) regs.forEach(function (r) { r.st = JSON.parse(JSON.stringify(r.st)); });

    var res = R.scoreHand({ melds: c.melds, startMelds: tb.melds, placed: c.placed, rack: c.rack, levels: run.levels, rules: tb.rules, regs: regs,

    tb.rack = c.rack;

    run.money = Math.max(0, run.money + money);
    res.moneyNet = money;

    res.regs.forEach(function (r) { if (r.def.after) r.def.after(r, res.hand); });
    run.regs.forEach(function (r, i) { r.st = res.regs[i].st; });

    settle(run);

  }
  function cashout(run) {

    if (tb.handsLeft) lines.push({ text: tb.handsLeft + " hand" + (tb.handsLeft > 1 ? "s" : "") + " to spare", money: tb.handsLeft });

  // --- the shop ---
  function price(run, base) { return Math.max(1, Math.ceil(base * stats(run).discount)); }
  function rollReg(run, exclude) {

  }
  function rollCons(run) { return rnd(run) < 0.45 ? pick(run, C.DRINKS).id : pick(run, C.TOOLS.filter(function (t) { return !run.demo || t.id !== "WILDINK"; })).id; }
  function twoCons(run) { var a = rollCons(run), b = rollCons(run), g = 0; while (b === a && g++ < 10) b = rollCons(run); return [a, b]; }
  function specialTile(run) {
    var x = rnd(run), t = tile(run, 1 + Math.floor(rnd(run) * 13), Math.floor(rnd(run) * 4));
    if (x < 0.12) { t.wild = true; t.n = 0; }
    else t.fin = pick(run, ["gold", "glass", "marble", "lucky", "steel", "ivory", "marble", "lucky"]);
    return t;
  }
  function newShop(run) {
    var a = rollReg(run), b = rollReg(run, [a]);

      bar: twoCons(run).map(function (id) { return { id: id, sold: false }; }),
      packs: [pick(run, ["tiles", "bar", "tiles"]), pick(run, ["bar", "regulars", "tiles"])].map(function (k) { return { kind: k, sold: false }; }),
      perk: run.perkOffer && run.perkOffer.night === run.night ? run.perkOffer.id : null, reroll: 5 };
    if (!run.shop.perk && run.tableNo === 0) {

    }

  }
  var PACKS = { tiles: { name: "Tile Box", cost: 4, desc: "Pick 1 of 3 special tiles for your bag" }, bar: { name: "Bar Tab", cost: 4, desc: "Pick 1 of 3 drinks and tools" },
    regulars: { name: "Guest List", cost: 6, desc: "Pick 1 of 2 regulars" } };
  function regPrice(run, id) { return price(run, C.REG[id].cost); }

  function buyReg(run, i) {

  }
  function sellReg(run, i) {
    var r = run.regs[i];

    return true;
  }
  function moveReg(run, i, j) { if (i < 0 || j < 0 || i >= run.regs.length || j >= run.regs.length) return false; var r = run.regs.splice(i, 1)[0]; run.regs.splice(j, 0, r); return true; }
  function buyCons(run, i) {

  }
  function drink(run, type) { run.levels[type] = (run.levels[type] || 1) + 1; }
  function buyPerk(run) {
    var id = run.shop.perk;
    if (!id || run.money < price(run, C.PERK[id].cost)) return false;

    run.perks.push(id); run.shop.perk = null; run.perkOffer = null;
    return true;
  }
  function reroll(run) {
    var cost = Math.max(1, run.shop.reroll - stats(run).rerollOff);

  }
  function rerollCost(run) { return Math.max(1, run.shop.reroll - stats(run).rerollOff); }
  function openPack(run, i) {

  var api = { NIGHTS: NIGHTS, BASE: BASE, STAKES: STAKES, DEMO_NIGHTS: DEMO_NIGHTS, PACKS: PACKS, newRun: newRun, stats: stats, target: target, bossOf: bossOf, nightsTotal: nightsTotal,

      if (m.x >= r.x && m.x <= r.x + r.w && m.y >= r.y && m.y <= r.y + r.h) {
        var def = C.REG[run.regs[k].id];
        if (sellArm === k) { RUN.sellReg(run, k); sfx("money"); flash("Sold " + def.name + " for $" + Math.max(1, Math.floor(def.cost / 2)) + "."); sellArm = -1; saveRun(); }
        else { sellArm = k; flash("Right-click " + def.name + " again to sell for $" + Math.max(1, Math.floor(def.cost / 2)) + "."); }
        return;
      }
    }
    if (screen === "table" && !anim) {
      var hit = tileAt(m);
      if (hit && hit.from === "table" && rackOrigin[hit.id]) { removeFromMelds(hit.id); work.rack.push(hit.id); refresh(); sfx("drop"); }
    }
  }
  var sellArm = -1;
  window.addEventListener("keydown", function (e) {
    var k = e.key;
    if (screen === "table" && !anim) {
      if (k === "Enter") { doPlay(); e.preventDefault(); }
      else if (k === "d" || k === "D") doDraw();
      else if (k === "r" || k === "R") resetHand();
      else if (k === "i" || k === "I") doIdea();
      else if (k === "s" || k === "S") { sortMode = sortMode === "num" ? "col" : "num"; sortRack(); }
      else if (k === "Escape") { work.sel = {}; selCons = -1; }
    } else if (screen === "cashout" && (k === "Enter" || k === " ") && cashT > 1) { collect(); e.preventDefault(); }
    else if ((screen === "help" || screen === "bag" || screen === "levels") && k === "Escape") screen = screen === "help" ? helpFrom : bagFrom;
  });

  // hooks for the screenshot tool and tests
  window.REMELD_APP = {
    edition: ED,
    run: function () { return run; },
    screen: function (s) { if (s) { screen = s; if (s === "table") startHand(); } return screen; },
    newRun: function (seed, stake) { stakePick = stake || 0; run = RUN.newRun({ seed: seed, stake: stake || 0, demo: DEMO }); screen = "table"; startHand(); return run; },
    load: function (str) { run = RUN.load(str); screen = run.phase === "shop" ? "shop" : run.phase === "cashout" ? "cashout" : "table"; if (screen === "table") startHand(); },
    idea: function () { doIdea(); return prev && prev.check.ok; },
    play: function () { doPlay(); return !!anim; },
    draw: function (ids) { work.sel = {}; ids.forEach(function (id) { work.sel[id] = 1; }); doDraw(); },
    work: function () { return work; },
    preview: function () { return prev; },
    drop: function (id, x, y) { return dropAt(id, { x: x, y: y }); },
    layout: function () { return { table: layoutTable(), rack: layoutRack() }; },
    busy: function () { return !!anim; },
    collect: function () { collect(); },
    hover: function (x, y) { mouse.x = x; mouse.y = y; },
    speed: function (v) { animSpeed = v; },
    quiet: function () { msg = null; },
    profile: profile
  };
  requestAnimationFrame(frame);
})();
</script>
</body>
