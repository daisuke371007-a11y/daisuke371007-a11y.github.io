  // --- small helpers ---
  function rng(seed) {
    var a = seed >>> 0;
    return function () {
      a = (a + 0x6D2B79F5) >>> 0;
      var t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function noiseField(rand, scale) {
    // value noise, two octaves, 0..1
    var gw = Math.ceil(W / scale) + 2, gh = Math.ceil(H / scale) + 2, g = [], g2 = [];
    for (var i = 0; i < gw * gh; i++) g.push(rand());
    var s2 = scale / 2, gw2 = Math.ceil(W / s2) + 2, gh2 = Math.ceil(H / s2) + 2;
    for (i = 0; i < gw2 * gh2; i++) g2.push(rand());
    function sm(t) { return t * t * (3 - 2 * t); }
    function at(grid, w, x, y, s) {
      var fx = x / s, fy = y / s, ix = Math.floor(fx), iy = Math.floor(fy), tx = sm(fx - ix), ty = sm(fy - iy);
      var a = grid[iy * w + ix], b = grid[iy * w + ix + 1], c = grid[(iy + 1) * w + ix], d = grid[(iy + 1) * w + ix + 1];
      return (a + (b - a) * tx) + ((c + (d - c) * tx) - (a + (b - a) * tx)) * ty;
    }
    var out = new Float32Array(W * H);
    for (var y = 0; y < H; y++) for (var x = 0; x < W; x++) out[y * W + x] = at(g, gw, x, y, scale) * 0.7 + at(g2, gw2, x, y, s2) * 0.3;
    return out;
  }
  // distance (city-block) from every cell to the nearest cell of material m; null when the picture has none
  function distanceTo(mat, m) {
    var d = new Int16Array(W * H), any = false, i, x, y;
    for (i = 0; i < W * H; i++) { if (mat[i] === m) { d[i] = 0; any = true; } else d[i] = 999; }
    if (!any) return null;
    for (y = 0; y < H; y++) for (x = 0; x < W; x++) {
      i = y * W + x;
      if (x > 0 && d[i - 1] + 1 < d[i]) d[i] = d[i - 1] + 1;
      if (y > 0 && d[i - W] + 1 < d[i]) d[i] = d[i - W] + 1;
    }
    for (y = H - 1; y >= 0; y--) for (x = W - 1; x >= 0; x--) {
      i = y * W + x;
      if (x < W - 1 && d[i + 1] + 1 < d[i]) d[i] = d[i + 1] + 1;
      if (y < H - 1 && d[i + W] + 1 < d[i]) d[i] = d[i + W] + 1;
    }
    return d;
  }

  // --- graffiti: letters and shapes, drawn as thick strokes, never as noise ---
  var FONT = {

    M: "10001 11011 10101 10101 10001 10001 10001", N: "10001 11001 10101 10011 10001 10001 10001", O: "01110 10001 10001 10001 10001 10001 01110",
    P: "11110 10001 10001 11110 10000 10000 10000", Q: "01110 10001 10001 10001 10101 10010 01101", R: "11110 10001 10001 11110 10100 10010 10001",
    S: "01111 10000 10000 01110 00001 00001 11110", T: "11111 00100 00100 00100 00100 00100 00100", U: "10001 10001 10001 10001 10001 10001 01110",
    V: "10001 10001 10001 10001 10001 01010 00100", W: "10001 10001 10001 10101 10101 10101 01010", X: "10001 10001 01010 00100 01010 10001 10001",
    Y: "10001 10001 01010 00100 00100 00100 00100", Z: "11111 00001 00010 00100 01000 10000 11111", "!": "00100 00100 00100 00100 00100 00000 00100"

  // a word as a list of [x, y] cells (scale sc, leaning forward a little like a tag)
  function wordCells(word, sc) {
    var out = [], ox = 0;
    for (var c = 0; c < word.length; c++) {
      var rows = (FONT[word.charAt(c)] || FONT.O).split(" ");
      for (var r = 0; r < 7; r++) for (var q = 0; q < 5; q++) {
        if (rows[r].charAt(q) !== "1") continue;
        var lean = Math.round((6 - r) * sc * 0.18);
        for (var dy = 0; dy < sc; dy++) for (var dx = 0; dx < sc; dx++) out.push([ox + q * sc + dx + lean, r * sc + dy]);
      }
      ox += 6 * sc;
    }
    return out;
  }
  function strokeCells(pts, w) {
    var out = [];
    for (var k = 0; k < pts.length; k++) {
      var x = pts[k][0], y = pts[k][1], r = w / 2;
      for (var j = Math.floor(y - r); j <= Math.ceil(y + r); j++) for (var i = Math.floor(x - r); i <= Math.ceil(x + r); i++)
        if ((i - x) * (i - x) + (j - y) * (j - y) <= r * r + 0.3) out.push([i, j]);
    }
    return out;
  }
  function polyline(points, steps) {

      try { var p = ctx.resume(); if (p && p.catch) p.catch(function () {}); } catch (e) { noteErr(e); }
    }
  }

  function hookPage() {
    if (hooked) return;
    hooked = true;
    try {
      if (typeof document !== 'undefined' && document && document.addEventListener) {
        // a hidden tab stops the sound (and the music clock), a visible one resumes it
        document.addEventListener('visibilitychange', function () {
          try {
            if (!ctx) return;
            if (document.hidden) {
              if (ctx.state === 'running') { hiddenSuspended = true; var p = ctx.suspend(); if (p && p.catch) p.catch(function () {}); }
            } else if (hiddenSuspended) { hiddenSuspended = false; wake(); }
          } catch (e) { noteErr(e); }
        });
      }
    } catch (e2) { noteErr(e2); }
  }

  function init() {
    try {
      if (failed) return false;
      if (!ctx) {
        var AC = G.AudioContext || G.webkitAudioContext;
        if (!AC) { failed = true; return false; }
        try { ctx = new AC({ latencyHint: 'interactive' }); } catch (e1) { ctx = new AC(); }
        try { buildGraph(); } catch (e2) { noteErr(e2); ctx = null; failed = true; return false; }
        hookPage();
      }
      wake();
      applyMusic();
      return true;
    } catch (e) { noteErr(e); return false; }
  }

  function setEnabled(sound, music) {
    try {
      if (sound !== undefined && sound !== null) soundOn = !!sound;
      if (music !== undefined && music !== null) musicOn = !!music;
      if (!ctx) return;
      var t = ctx.currentTime;
      sfxBus.gain.setTargetAtTime(soundOn ? 1 : 0, t, 0.03);
      sprayBus.gain.setTargetAtTime(soundOn ? SPRAY_BUS : 0, t, 0.03);
      verbSfx.gain.setTargetAtTime(soundOn ? 1 : 0, t, 0.03);
      if (!soundOn && sp) sprayOff(t);
      applyMusic();
    } catch (e) { noteErr(e); }
  }

  /* ------------------------------------------------------------------
     voice builders
     ------------------------------------------------------------------ */
  // oscillator with attack/decay envelope.
  // o: f, f2 (glide target), glide (s), t, dur, a (attack), vol, type | wave, dest, wet (reverb send, sfx only), kind, detune
  function tone(o) {
    var vol = o.vol;
    if (!(vol > 0.0003) || !(o.f < ctx.sampleRate * 0.45)) return;     // too quiet / above Nyquist: skip
    var kind = o.kind || 0, t0 = o.t, dur = Math.max(o.dur, (o.a || 0.004) + 0.012);
    var osc = ctx.createOscillator(), g = mkEnv(), a = o.a || 0.004;
    if (o.wave && osc.setPeriodicWave) osc.setPeriodicWave(o.wave); else osc.type = o.type || 'sine';
    osc.frequency.value = o.f; osc.frequency.setValueAtTime(o.f, t0);     // value first: no 440 Hz sample before t0; the event anchors the glide
    if (o.f2 > 0) osc.frequency.exponentialRampToValueAtTime(Math.min(o.f2, ctx.sampleRate * 0.45), t0 + (o.glide || dur));
    if (o.detune) osc.detune.value = o.detune;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.linearRampToValueAtTime(vol, t0 + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(g); g.connect(o.dest || sfxBus);
    var nodes = [osc, g];
    if (o.wet > 0 && kind === 0 && verbSfx) { var w = mkGain(o.wet); g.connect(w); w.connect(verbSfx); nodes.push(w); }
    osc.start(t0); osc.stop(t0 + dur + 0.05);
    track(kind, [osc], nodes);
  }

  // filtered noise burst. o: t, dur, a, vol, ftype, f, f2 (sweep target), q, pink, dest, wet, kind
  function noiseHit(o) {
    var vol = o.vol;
    if (!(vol > 0.0003)) return;
    var kind = o.kind || 0, t0 = o.t, a = o.a || 0.003, dur = Math.max(o.dur, a + 0.012);
    var buf = o.pink ? noisePink : noiseWhite;
    var src = ctx.createBufferSource(); src.buffer = buf;
    var f = ctx.createBiquadFilter(); f.type = o.ftype || 'bandpass'; f.Q.value = o.q === undefined ? 0.8 : o.q;
    var f0 = clamp(o.f, 30, ctx.sampleRate * 0.45);
    f.frequency.value = f0; f.frequency.setValueAtTime(f0, t0);
    if (o.f2 > 0) f.frequency.exponentialRampToValueAtTime(clamp(o.f2, 30, ctx.sampleRate * 0.45), t0 + dur);
    var g = mkEnv();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.linearRampToValueAtTime(vol, t0 + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    src.connect(f); f.connect(g); g.connect(o.dest || sfxBus);
    var nodes = [src, f, g];
    if (o.wet > 0 && kind === 0 && verbSfx) { var w = mkGain(o.wet); g.connect(w); w.connect(verbSfx); nodes.push(w); }
    var span = Math.max(0, buf.duration - dur - 0.15);
    src.start(t0, Math.random() * span);
    src.stop(t0 + dur + 0.05);
    track(kind, [src], nodes);
  }

  // glassy bell: three inharmonic partials with different lifetimes
  function bell(m, t, vol, dur, dest, wet, kind) {
    var f = mtof(m);
    tone({ f: f, t: t, dur: dur, vol: vol, a: 0.002, dest: dest, wet: wet, kind: kind });
    tone({ f: f * 2.76, t: t, dur: dur * 0.5, vol: vol * 0.38, a: 0.002, dest: dest, wet: wet, kind: kind });
    tone({ f: f * 5.4, t: t, dur: dur * 0.22, vol: vol * 0.12, a: 0.002, dest: dest, wet: wet, kind: kind });
  }
  // marimba: fundamental plus the bar's fast 4th partial
  function marimba(m, t, vol, dest, wet, kind, dur) {
    var f = mtof(m), d = dur || 0.62;
    tone({ f: f, t: t, dur: d, vol: vol, a: 0.002, dest: dest, wet: wet, kind: kind });
    tone({ f: f * 4, t: t, dur: 0.11, vol: vol * 0.22, a: 0.001, dest: dest, wet: wet, kind: kind });
  }

  /* ------------------------------------------------------------------
     one-shot sound effects
     ------------------------------------------------------------------ */
  var CLEAR_LADDER = [79, 81, 84, 86, 88, 91, 93, 96];   // G5 A5 C6 D6 E6 G6 A6 C7 (C pentatonic)
  var clearIdx = 3, clearPrevT = -9;
  var TIP_PITCH = { FAN: 1, PIN: 1.26, TURBO: 0.89, SOAP: 0.75 };

  function semis(o) { return 12 * Math.log(o.p) / Math.LN2; }

  function sClear(o) {
    var cnt = clamp(num(o.opts.count, 1), 1, 60);
    if (o.t - clearPrevT > 0.4) clearIdx = 2 + ((Math.random() * 4) | 0);
    else {
      var step = [-2, -1, 1, 2][(Math.random() * 4) | 0];
      clearIdx = clamp(clearIdx + step, 0, CLEAR_LADDER.length - 1);
    }
    clearPrevT = o.t;
    var m = CLEAR_LADDER[clearIdx] + semis(o) + (Math.random() - 0.5) * 0.14;
    var v = 0.1 * o.v * (0.78 + 0.22 * Math.min(1, Math.sqrt(cnt) / 3)) * (0.75 + Math.random() * 0.25);
    tone({ f: mtof(m), t: o.t, dur: 0.09, a: 0.002, vol: v, dest: o.dest, wet: 0.25 });
    tone({ f: mtof(m) * 2.01, t: o.t, dur: 0.045, a: 0.002, vol: v * 0.25, dest: o.dest });
    noiseHit({ t: o.t, dur: 0.014, a: 0.001, vol: 0.035 * o.v, ftype: 'highpass', f: 6000, q: 0.7, dest: o.dest });
  }
  function sTough(o) {
    var p = o.p;
    noiseHit({ t: o.t, dur: 0.07, a: 0.001, vol: 0.16 * o.v, f: 2400 * p, f2: 900 * p, q: 1.4, dest: o.dest });
    tone({ f: 260 * p, f2: 90 * p, t: o.t, dur: 0.12, glide: 0.1, a: 0.002, vol: 0.2 * o.v, type: 'triangle', dest: o.dest });
    tone({ f: 3100 * p * (0.95 + Math.random() * 0.1), t: o.t, dur: 0.05, a: 0.001, vol: 0.05 * o.v, dest: o.dest });
    noiseHit({ t: o.t + 0.045, dur: 0.05, a: 0.001, vol: 0.09 * o.v, f: 3200 * p, f2: 1200 * p, q: 1.8, dest: o.dest });
  }
  function sFoam(o) {
    for (var i = 0; i < 3; i++) {
      var f0 = (380 + Math.random() * 320) * o.p, tt = o.t + i * (0.035 + Math.random() * 0.02);
      tone({ f: f0, f2: f0 * 2, t: tt, dur: 0.09, glide: 0.05, a: 0.004, vol: (0.07 - i * 0.02) * o.v, dest: o.dest, wet: 0.2 });
    }
    noiseHit({ t: o.t, dur: 0.12, a: 0.01, vol: 0.05 * o.v, ftype: 'lowpass', f: 1200, f2: 500, q: 0.5, pink: true, dest: o.dest });
  }
  function sCoin(o) {
    var s = semis(o);
    noiseHit({ t: o.t, dur: 0.01, a: 0.001, vol: 0.05 * o.v, ftype: 'highpass', f: 9000, q: 0.7, dest: o.dest });
    bell(83 + s, o.t, 0.12 * o.v, 0.32, o.dest, 0.2);
    bell(88 + s, o.t + 0.07, 0.14 * o.v, 0.6, o.dest, 0.3);
  }
  function sTip(o) {
    var s = semis(o), n = [79, 84, 88];
    for (var i = 0; i < 3; i++) bell(n[i] + s, o.t + i * 0.055, 0.1 * o.v, i === 2 ? 0.5 : 0.28, o.dest, 0.3);
  }
  function sPearl(o) {
    var s = semis(o), n = [84, 88, 91, 96];
    for (var i = 0; i < 4; i++) bell(n[i] + s, o.t + i * 0.055, 0.1 * o.v, i === 3 ? 0.7 : 0.3, o.dest, 0.4);
    noiseHit({ t: o.t, dur: 0.32, a: 0.12, vol: 0.03 * o.v, ftype: 'highpass', f: 3000, f2: 9000, q: 0.7, dest: o.dest, wet: 0.3 });
  }
  function sItem(o) {
    var s = semis(o), n = [72, 76, 79, 84, 88, 91], i;
    for (i = 0; i < n.length; i++) bell(n[i] + s, o.t + i * 0.075, (0.1 + i * 0.008) * o.v, 0.5, o.dest, 0.4);
    bell(96 + s, o.t + 0.46, 0.13 * o.v, 1.3, o.dest, 0.5);
    var chord = [60, 64, 67, 72];
    for (i = 0; i < chord.length; i++) tone({ f: mtof(chord[i] + s), t: o.t + 0.2, dur: 1.1, a: 0.15, vol: 0.035 * o.v, type: 'triangle', dest: o.dest, wet: 0.4 });
    noiseHit({ t: o.t + 0.1, dur: 0.9, a: 0.4, vol: 0.045 * o.v, ftype: 'highpass', f: 2500, f2: 10000, q: 0.7, dest: o.dest, wet: 0.35 });
  }
  function sBurst(o) {
    var p = o.p;
    tone({ f: 160 * p, f2: 50 * p, t: o.t, dur: 0.28, glide: 0.22, a: 0.004, vol: 0.28 * o.v, dest: o.dest });
    noiseHit({ t: o.t, dur: 0.38, a: 0.006, vol: 0.2 * o.v, f: 3200 * p, f2: 320, q: 0.7, pink: true, dest: o.dest, wet: 0.15 });
    noiseHit({ t: o.t + 0.02, dur: 0.2, a: 0.004, vol: 0.05 * o.v, ftype: 'highpass', f: 5000, q: 0.7, dest: o.dest, wet: 0.2 });
  }
  function sDrop(o) {
    var p = o.p;
    tone({ f: 620 * p, f2: 1250 * p, t: o.t, dur: 0.14, glide: 0.08, a: 0.004, vol: 0.12 * o.v, dest: o.dest, wet: 0.15 });
    tone({ f: 1240 * p, f2: 2500 * p, t: o.t, dur: 0.07, glide: 0.06, a: 0.004, vol: 0.03 * o.v, dest: o.dest });
  }
  function sBuy(o) {
    var s = semis(o);

    marimba(79 + s, o.t + 0.07, 0.12 * o.v, o.dest, 0.2);

  }
  function sDeny(o) {
    var p = o.p;

  function sRestore(o) {

    }

    for (i = 0; i < chord.length; i++) {
      tone({ f: mtof(chord[i] + s), t: o.t + 0.6, dur: 2.0, a: 0.08, vol: 0.05 * o.v, type: 'triangle', dest: o.dest, wet: 0.4 });

    }
    noiseHit({ t: o.t + 0.2, dur: 1.2, a: 0.5, vol: 0.04 * o.v, ftype: 'highpass', f: 2000, f2: 9000, q: 0.7, dest: o.dest, wet: 0.3 });

  function sSwitch(o) {

    tone({ f: 190 * p, f2: 110 * p, t: o.t, dur: 0.05, a: 0.002, vol: 0.14 * o.v, type: 'triangle', dest: o.dest });
    tone({ f: 1900 * p, t: o.t + 0.015, dur: 0.03, a: 0.001, vol: 0.04 * o.v, dest: o.dest });
    noiseHit({ t: o.t + 0.07, dur: 0.01, a: 0.001, vol: 0.1 * o.v, f: 2000 * p, q: 3, dest: o.dest });
  }
  function sSplash(o) {
    var p = o.p;
    noiseHit({ t: o.t, dur: 0.35, a: 0.012, vol: 0.5 * o.v, f: 900 * p, f2: 2800 * p, q: 0.9, pink: true, dest: o.dest, wet: 0.15 });
    for (var i = 0; i < 3; i++) {
      var f0 = (600 + Math.random() * 900) * p;
      tone({ f: f0, f2: f0 * 1.8, t: o.t + 0.04 + i * 0.05 + Math.random() * 0.03, dur: 0.08, glide: 0.04, a: 0.003, vol: 0.04 * o.v, dest: o.dest });
    }
  }
  function sEmpty(o) {
    var p = o.p, n = [67, 64, 60], i;
    noiseHit({ t: o.t, dur: 0.5, a: 0.02, vol: 0.1 * o.v, f: 1800, f2: 300, q: 1.2, pink: true, dest: o.dest });
    for (i = 0; i < 3; i++) tone({ f: mtof(n[i]) * p, t: o.t + i * 0.11, dur: 0.22, a: 0.006, vol: 0.12 * o.v, type: 'triangle', dest: o.dest, wet: 0.15 });
    for (i = 0; i < 3; i++) noiseHit({ t: o.t + 0.35 + i * 0.09, dur: 0.05, a: 0.004, vol: (0.07 - i * 0.02) * o.v, ftype: 'lowpass', f: 1400, q: 0.5, pink: true, dest: o.dest });
  }
  function sUi(o) {
    var p = o.p;

  // gap = minimum seconds between two starts of the same sound; hi = high priority (survives the soft voice cap)
  var SFX = {
    clear: { fn: sClear, gap: 0.03, hi: false },
    tough: { fn: sTough, gap: 0.05, hi: false },
    foam: { fn: sFoam, gap: 0.07, hi: false },
    coin: { fn: sCoin, gap: 0.05, hi: true },
    tip: { fn: sTip, gap: 0.08, hi: true },
    pearl: { fn: sPearl, gap: 0.08, hi: true },
    item: { fn: sItem, gap: 0.2, hi: true },
    burst: { fn: sBurst, gap: 0.06, hi: true },
    drop: { fn: sDrop, gap: 0.06, hi: false },
    buy: { fn: sBuy, gap: 0.05, hi: true },
    deny: { fn: sDeny, gap: 0.08, hi: true },
    restore: { fn: sRestore, gap: 0.5, hi: true },
    'switch': { fn: sSwitch, gap: 0.04, hi: false },
    splash: { fn: sSplash, gap: 0.06, hi: false },
    empty: { fn: sEmpty, gap: 0.5, hi: true },
    ui: { fn: sUi, gap: 0.03, hi: false }
  };

  function outFor(opts) {
    var pan = num(opts.pan, 0);
    if (!pans.length || Math.abs(pan) < 0.15) return sfxBus;
    pan = clamp(pan, -1, 1);
    var best = pans[0], bd = 9;
    for (var i = 0; i < pans.length; i++) { var d = Math.abs(pans[i].p - pan); if (d < bd) { bd = d; best = pans[i]; } }
    return best.node;
  }

  function sfx(name, opts) {
    try {
      if (!ctx || !soundOn || !running()) return;
      var def = SFX.hasOwnProperty(name) ? SFX[name] : null;
      if (!def) return;
      var t = ctx.currentTime, prev = lastAt.hasOwnProperty(name) ? lastAt[name] : -9;
      if (t - prev < def.gap) return;
      if (voices[0] > (def.hi ? HARD_VOICES : SOFT_VOICES)) return;
      lastAt[name] = t;
      opts = (opts && typeof opts === 'object') ? opts : {};
      def.fn({
        t: t + 0.004,
        v: clamp(num(opts.volume, 1), 0, 4),
        p: clamp(num(opts.pitch, 1), 0.25, 4),
        dest: outFor(opts),
        opts: opts
      });
    } catch (e) { noteErr(e); }
  }

  /* ------------------------------------------------------------------
     spray: one continuous water voice
     ------------------------------------------------------------------
     pink noise  -> body (bandpass)        the stream itself
                 -> low (lowpass)          weight / thump of water
                 -> turbo (bandpass, swept by LFO, chopped by LFO)
     white noise -> hiss (highpass)        spray mist
                 -> whistle (narrow bandpass)   PIN jet
     two triangle oscillators (slightly detuned) -> hum   TURBO motor beat
     pops: short up-gliding sine blips scheduled from spray() (SOAP bubbles)
     All gains / frequencies move with setTargetAtTime, never jump.
     The TIPS weights and K_* factors were set with tools/audio_calibrate.js so
     that every tip lands within 3 dB of the same A-weighted loudness.          */
  var TIPS = {
    FAN:   { f0: 1250, f1: 2500, q: 0.55, body: 0.85,  hissF: 4800, hiss: 0.5,  low: 0.85, whis: 0, wf: 4800, turbo: 0, pops: 0 },
    PIN:   { f0: 3000, f1: 5200, q: 1.8,  body: 1.15, hissF: 6500, hiss: 0.38, low: 0.12, whis: 0.9, wf: 4600, turbo: 0, pops: 0 },
    TURBO: { f0: 1100, f1: 2100, q: 0.8,  body: 0.6,  hissF: 4000, hiss: 0.35, low: 0.5,  whis: 0, wf: 4800, turbo: 1, pops: 0 },
    SOAP:  { f0: 650,  f1: 1000, q: 0.7,  body: 0.9, hissF: 3500, hiss: 0.25, low: 0.9,  whis: 0, wf: 4800, turbo: 0, pops: 15 }
  };
  var K = { body: 0.32, low: 0.4, hiss: 0.2, whis: 0.3, turbo: 0.4, hum: 0.04 };

  function buildSpray() {
    var s = { on: false, idleSince: 0, lastAmp: 0, lastUpd: -9, lastT: 0, jf: 1, jg: 1, jT: 0, tip: '', foam: null, L: 0, srcs: [], nodes: [] };
    function src(buf) {
      var b = ctx.createBufferSource(); b.buffer = buf; b.loop = true; s.srcs.push(b); s.nodes.push(b); return b;
    }
    function osc(type, f) {
      var o = ctx.createOscillator(); o.type = type; o.frequency.value = f; s.srcs.push(o); s.nodes.push(o); return o;
    }
    function add(n) { s.nodes.push(n); return n; }
    var pink = src(noisePink), white = src(noiseWhite);

    s.mix = add(mkGain(0)); s.mix.connect(sprayBus);
    s.body = add(mkBiquad('bandpass', 1500, 0.6)); s.bodyG = add(mkGain(0));
    pink.connect(s.body); s.body.connect(s.bodyG); s.bodyG.connect(s.mix);
    s.low = add(mkBiquad('lowpass', 320, 0.7)); s.lowG = add(mkGain(0));
    pink.connect(s.low); s.low.connect(s.lowG); s.lowG.connect(s.mix);
    s.hiss = add(mkBiquad('highpass', 4800, 0.7)); s.hissG = add(mkGain(0));
    white.connect(s.hiss); s.hiss.connect(s.hissG); s.hissG.connect(s.mix);
    s.whis = add(mkBiquad('bandpass', 4600, 16)); s.whisG = add(mkGain(0));
    white.connect(s.whis); s.whis.connect(s.whisG); s.whisG.connect(s.mix);

    // turbo: swept band, chopped by a second LFO, plus a beating motor hum
    s.tBp = add(mkBiquad('bandpass', 1500, 3)); s.tTrem = add(mkGain(0.55)); s.tG = add(mkGain(0));
    pink.connect(s.tBp); s.tBp.connect(s.tTrem); s.tTrem.connect(s.tG); s.tG.connect(s.mix);
    s.lfoA = osc('sine', 10); s.lfoAd = add(mkGain(0.45)); s.lfoA.connect(s.lfoAd); s.lfoAd.connect(s.tTrem.gain);

        rr(x, y0, cw2, 170, 14); cx.fillStyle = COL.panel; cx.fill(); cx.strokeStyle = "#35546a"; cx.lineWidth = 1.5; cx.stroke();
        pixelText(c, x + cw2 / 2, y0 + 14, 3, COL.water, "center");
        if (j === 0) { tipIcon("FAN", x + cw2 / 2 - 4, y0 + 92, 1.5); }
        else if (j === 1) { coin(x + 70, y0 + 92, 22); pearl(x + 120, y0 + 100, 16); text("$", x + 70, y0 + 93, 22, "#b58a1e", "center", 800); coin(x + 165, y0 + 86, 14); }
        else if (j === 2) { [0, 1, 2].forEach(function (q) { cx.beginPath(); cx.arc(x + 54 + q * 52, y0 + 92 + (q === 1 ? -16 : 8), 20, 0, 7); cx.fillStyle = q === 2 ? "#2c4a2c" : "#1d4a66"; cx.fill(); cx.strokeStyle = q === 2 ? COL.gold : "#7fd8f7"; cx.lineWidth = 2; cx.stroke(); icon(["gauge", "cone", "tower"][q], x + 54 + q * 52, y0 + 92 + (q === 1 ? -16 : 8), "#eaf8ff"); }); }
        else { framedPic(P.dirty, x + 14, y0 + 48, 90, 52); framedPic(cl, x + 110, y0 + 48, 90, 52); cx.fillStyle = COL.water; cx.beginPath(); cx.moveTo(x + 100, y0 + 66); cx.lineTo(x + 112, y0 + 74); cx.lineTo(x + 100, y0 + 82); cx.closePath(); cx.fill(); pearl(x + cw2 / 2, y0 + 126, 12); }
        text(["Spray the grime away", "Every speck pays", "Pick what to buy next", "Pearl + time-lapse"][j], x + cw2 / 2, y0 + 154, 13, COL.text, "center", 700);
        if (j < 3) { cx.fillStyle = COL.water; cx.beginPath(); cx.moveTo(x + cw2 + 8, y0 + 75); cx.lineTo(x + cw2 + 30, y0 + 85); cx.lineTo(x + cw2 + 8, y0 + 95); cx.closePath(); cx.fill(); }
      });
    }
    var last = helpPage === HELP_PAGES - 1, intro = helpFrom === "intro";
    if (helpPage > 0) button(60, H - 90, 150, 46, "< PREV", function () { helpPage--; }, { size: 15 });
    if (!last) button(W - 210, H - 90, 150, 46, "NEXT >", function () { helpPage++; }, { size: 15, primary: intro });
    button(W / 2 - 110, H - 90, 220, 48, intro ? "START WASHING" : "BACK", closeHelp, { primary: last || !intro });
    if (intro && !last) text("Esc or Enter to start washing", W / 2, H - 30, 13, COL.dim, "center", 600);
  }
  function closeHelp() {
    settings.seenHelp = true; saveSettings();
    if (helpFrom === "intro") { rebuildImage(); startShift(); } else go(helpFrom);
  }

  // ---------------- town ----------------
  function drawTown() {
    cx.fillStyle = COL.bg; cx.fillRect(0, 0, W, H);
    pixelText("RINSEWICK 2", W / 2, 22, 6, "#cfe8f4", "center");
    var slots = TOTAL_JOBS;
    text(game.restored.length + " of " + slots + " jobs restored  ·  " + game.found.length + " lost items found", W / 2, 76, 16, COL.dim, "center", 700);
    for (var k = 0; k < slots; k++) {
      var col = k % 6, row = (k / 6) | 0, x = 42 + col * 188, y = 116 + row * 250, w = 176, h = 103;
      var full = k < NSITES, done = game.restored.indexOf(k) >= 0, curr = full && game.grid.k === k && !done;
      rr(x - 6, y - 6, w + 12, h + 112, 12); cx.fillStyle = COL.panel; cx.fill();
      cx.imageSmoothingEnabled = false;
      if (done) cx.drawImage(cleanCanvas(k), x, y, w, h);
      else if (curr) cx.drawImage(off, x, y, w, h);
      else { cx.fillStyle = "#0b1520"; cx.fillRect(x, y, w, h); text(full ? "?" : TEASE_CARD, x + w / 2, y + h / 2, full ? 40 : 15, "#35546a", "center", 800); }
      cx.imageSmoothingEnabled = true;
      if (done) {
        var hov = hot(x, y, w, h);
        if (hov) { cx.fillStyle = "rgba(6,14,22,0.45)"; cx.fillRect(x, y, w, h); cx.beginPath(); cx.moveTo(x + w / 2 - 12, y + h / 2 - 16); cx.lineTo(x + w / 2 + 16, y + h / 2); cx.lineTo(x + w / 2 - 12, y + h / 2 + 16); cx.closePath(); cx.fillStyle = "#fff"; cx.fill(); overButton = true; }
        (function (kk) { buttons.push({ x: x, y: y, w: w, h: h, fn: function () { startReplay(kk, "town", { back: "town" }); } }); })(k);
      }
      var nm = full ? RW.SITES[k].name : "???";
      fit((k + 1) + ". " + (done || curr || !full ? nm : "???"), x, y + h + 20, w, 15, done ? "#9be27a" : COL.text, "left", 800);
      text(done ? "Restored" : curr ? (pct() * 100).toFixed(1) + "% clean" : full ? "Not yet" : TEASE, x, y + h + 42, 13, COL.dim, "left", 700);
      if (full) {
        var f = game.found.indexOf(k) >= 0;
        if (f) pearl(x + 8, y + h + 64, 7);
        fit(f ? "Found " + RW.SITES[k].item : "Lost item: ?", x + (f ? 20 : 0), y + h + 64, w - (f ? 20 : 0), 12.5, f ? COL.pearl : "#5f7d90", "left", 600);
      }
      if (done) {
        var nw = !!newRestore[k];
        if (nw) { cx.globalAlpha = 0.5 + 0.5 * Math.sin(performance.now() / 160); }
        (function (kk) { button(x, y + h + 78, w, 26, nw ? "NEW!  WATCH TIME-LAPSE" : "WATCH TIME-LAPSE", function () { startReplay(kk, "town", { back: "town" }); }, { size: 12, primary: nw }); })(k);
        cx.globalAlpha = 1;
      }
    }
    button(W / 2 - 100, H - 70, 200, 46, "BACK", function () { go(townFrom); }, { primary: true });
  }

  // ---------------- the ends ----------------
  function followLine(y, size) {
    text("Enjoying it? Follow Proven Little Games on itch.io for new games", W / 2, y, size || 17, COL.tip, "center", 800);
  }
  
  
  function drawDemoEnd(dt) {
    cx.fillStyle = COL.bg; cx.fillRect(0, 0, W, H);
    pixelText("THE DEMO ENDS HERE", W / 2, 34, 7, "#cfe8f4", "center");
    for (var k = 0; k < 3; k++) {
      cx.imageSmoothingEnabled = false; cx.drawImage(cleanCanvas(k), 90 + k * 350, 110, 320, 187); cx.imageSmoothingEnabled = true;
      cx.strokeStyle = "#35546a"; cx.lineWidth = 2; cx.strokeRect(90 + k * 350, 110, 320, 187);
      text(RW.SITES[k].name + " - restored", 90 + k * 350, 318, 15, "#9be27a", "left", 800);
    }
    var y = 372;
    y = wrap("You restored the first three jobs. The full game has " + (TOTAL_JOBS - 3) + " more in the old quarter, ending in the great mosaic of the town square: a fourth nozzle tip, lichen, salt, soot and tar to blast off, and a " + FULL_UPGRADES + "-upgrade tree to grow.", 150, y, 900, 17, COL.text, 26, 600);
    y = wrap("Every job you restore ends with a before / after time-lapse of your work.", 150, y + 8, 900, 17, COL.dim, 26, 600);
    button(W / 2 - 330, 520, 330, 58, "GET THE FULL GAME", openStore, { primary: true, size: 19 });
    button(W / 2 + 20, 520, 310, 58, "FOLLOW ON ITCH.IO", function () { openUrl(PROFILE_URL); }, { size: 16 });
    followLine(610, 17);
    button(W / 2 - 230, 650, 200, 42, "TOWN", function () { townFrom = "demoend"; go("town"); });
    button(W / 2 + 30, 650, 200, 42, "TITLE", function () { go("title"); });
  }
  

  function toggleSound() { settings.sound = !settings.sound; saveSettings(); applySound(); }
  function toggleMusic() { settings.music = !settings.music; saveSettings(); applySound(); }

  // ---------------- main loop ----------------
  var lastT = performance.now(), frameMs = [];
  var drawFailed = false;
  function frame(now) {
    try { drawFrame(now); } catch (e) { if (!drawFailed) { drawFailed = true; console.error(e); } }    // one bad frame must not stop the game
    requestAnimationFrame(frame);
  }
  function drawFrame(now) {
    var t0 = performance.now(), dt = Math.min(0.05, (now - lastT) / 1000); lastT = now; frameNo++;
    buttons = []; overButton = false;
    cx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
    cx.fillStyle = COL.bg; cx.fillRect(0, 0, W, H);
    if (screen === "title") drawTitle(dt);
    else if (screen === "shift") drawShift(dt);
    else if (screen === "tree") drawTree(dt);
    else if (screen === "replay") drawReplay(dt);
    else if (screen === "help") drawHelp();
    else if (screen === "town") drawTown();
    
    else if (screen === "demoend") drawDemoEnd(dt);
    if (screen !== "shift" && AU) AU.spray(0, "FAN", false);
    var inField = screen === "shift" && mouse.x >= PX && mouse.x <= PX + GW * CELL && mouse.y >= PY && mouse.y <= PY + GH * CELL;
    cv.style.cursor = overButton ? "pointer" : (inField && !paused && !summary) || (screen === "replay" && replay && replay.phase === "slider" && mouse.x >= PX && mouse.x <= PX + GW * CELL && mouse.y >= PY && mouse.y <= PY + GH * CELL) ? (screen === "shift" ? "crosshair" : "ew-resize") : "default";
    frameMs.push(performance.now() - t0); if (frameMs.length > 240) frameMs.shift();
  }
  function resize() {
    var vw = window.innerWidth, vh = window.innerHeight;
    scale = Math.min(vw / W, vh / H); dpr = window.devicePixelRatio || 1;
    cv.style.width = Math.floor(W * scale) + "px"; cv.style.height = Math.floor(H * scale) + "px";
    cv.width = Math.floor(W * scale * dpr); cv.height = Math.floor(H * scale * dpr);
  }
  window.addEventListener("resize", resize); resize();
  function local(e) { var r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H }; }
  function setAim(m) { aim = { x: clamp((m.x - PX) / CELL, 0, GW), y: clamp((m.y - PY) / CELL, 0, GH) }; }
  function inPicture(m) { return m.x >= PX && m.x <= PX + GW * CELL && m.y >= PY && m.y <= PY + GH * CELL; }
  cv.addEventListener("pointermove", function (e) {
    var m = local(e); mouse.x = m.x; mouse.y = m.y;
    if (screen === "shift") { setAim(mouse); if (!armed && Math.hypot(m.x - armX, m.y - armY) > 5) armed = true; }
    if (screen === "replay" && replay && replay.drag) dragSplit(m.x);
  });
  cv.addEventListener("pointerleave", function () { mouse.x = -1; mouse.y = -1; mouse.down = false; if (replay) replay.drag = false; });
  cv.addEventListener("pointerup", function () { mouse.down = false; if (replay) replay.drag = false; });
  cv.addEventListener("pointerdown", function (e) {
    var m = local(e);
    mouse.x = m.x; mouse.y = m.y; mouse.down = true;
    cv.focus(); wake();
    for (var i = buttons.length - 1; i >= 0; i--) { var b = buttons[i]; if (m.x >= b.x && m.x <= b.x + b.w && m.y >= b.y && m.y <= b.y + b.h) { if (!b.quiet) sfx("ui"); b.fn(); return; } }
    if (screen === "shift") { setAim(m); armed = true; if (paused) paused = false; return; }
    if (screen === "tree") {
      var hitN = null;
      RW.NODES.forEach(function (n) { if (RW.visible(game, n.id)) { var p = nodePos(n); if (Math.hypot(m.x - p.x, m.y - p.y) <= NR + 5) hitN = n; } });
      if (hitN) { tipNode = hitN; settings.seenTree = true; saveSettings(); if (tryBuy(hitN)) holdBuy = { n: hitN, t: 0.4 }; }
    }
    if (screen === "replay" && replay && inPicture(m)) { if (replay.phase === "lapse") skipLapse(); else { replay.drag = true; replay.st = 99; dragSplit(m.x); } }
  });
  cv.addEventListener("wheel", function (e) {
    if (screen === "shift" && run && !run.over && !paused) { cycleTip(e.deltaY > 0 ? 1 : -1); e.preventDefault(); }
  }, { passive: false });
  window.addEventListener("keydown", function (e) {
    var k = e.key;
    wake();
    if (k === "m" || k === "M") { toggleSound(); return; }
    if (k === "n" || k === "N") { toggleMusic(); return; }
    if (screen === "shift") {
      if (k === "Escape" || k === "p" || k === "P") { if (!run.over) paused = !paused; e.preventDefault(); return; }
      if (k === " " || k === "Enter") { if (summary && overT > 0.5) endShiftView(); e.preventDefault(); return; }
      var T = RW.TIPS.filter(function (t) { return String(t.key) === k; })[0];
      if (T) { selectTip(T.id); e.preventDefault(); }
      return;
    }
    if (screen === "replay" && replay) {
      if (k === " " || k === "Enter") { if (replay.phase === "lapse") skipLapse(); else if (replay.st > 0.5) finishReplay(); e.preventDefault(); }
      else if (k === "Escape") { if (replay.phase === "lapse") skipLapse(); else if (replay.mode === "town") finishReplay(); e.preventDefault(); }
      else if (k === "ArrowLeft" && replay.phase === "slider") { replay.st = 99; replay.split = clamp(replay.split - 0.05, 0, 1); e.preventDefault(); }
      else if (k === "ArrowRight" && replay.phase === "slider") { replay.st = 99; replay.split = clamp(replay.split + 0.05, 0, 1); e.preventDefault(); }
      return;
    }
    if (screen === "tree" && (k === " " || k === "Enter")) { startShift(); e.preventDefault(); return; }
    if (screen === "help") {
      if (k === "ArrowRight" && helpPage < HELP_PAGES - 1) helpPage++;
      else if (k === "ArrowLeft" && helpPage > 0) helpPage--;
      else if (k === "Escape" || k === "Enter" || (k === " " && helpPage === HELP_PAGES - 1)) closeHelp();
      else if (k === " ") helpPage = Math.min(HELP_PAGES - 1, helpPage + 1);
      e.preventDefault(); return;
    }
    if (screen === "town" && (k === "Escape" || k === "Enter" || k === " ")) { go(townFrom); e.preventDefault(); return; }
    if (screen === "title" && (k === " " || k === "Enter") && !confirmNew) {
      if (hasSave) { if (game.done) { townFrom = "title"; go("town"); } else { rebuildImage(); go("tree"); } } else firstRun();
      e.preventDefault();
    }
  });
  window.addEventListener("blur", function () { if (screen === "shift" && run && !run.over) paused = true; if (AU) AU.spray(0, "FAN", false); });
  document.addEventListener("visibilitychange", function () { if (document.hidden) persist(); });
  window.addEventListener("pagehide", persist);

  // ---------------- hooks for the screenshot tool and tests ----------------
  // a plain autoplayer for the hooks: soap along a row, then the fan (now and then the pin jet) back along the same row
  function demoPath(t, r) {
    var seg = Math.floor(t / 2), row = (seg >> 1) % 10, pass = seg & 1, u = (t - seg * 2) / 2;
    return { x: pass ? 196 - 200 * u : -4 + 200 * u, y: 8 + 11 * row + Math.sin(t * 5) * 1.5,
      tip: pass ? (r.s.owned.PIN && row % 3 === 1 ? "PIN" : "FAN") : (r.s.owned.SOAP ? "SOAP" : "FAN") };
  }
  window.RINSEWICK2_APP = {
    edition: ED,
    game: function () { return game; },
    run: function () { return run; },
    setGame: function (g) { game = typeof g === "string" ? RW.load(g, ART.paint) : g; hasSave = true; lapseCache = {}; replay = null; summary = null; run = null; newRestore = {}; rebuildImage(); },
    start: function () { startShift(); },
    screen: function (s) {
      if (s) {
        if (s === "tree" || s === "shift") rebuildImage();
        if (s === "shift" && !run) startShift(); else go(s);
      }
      return screen;
    },
    help: function (p) { helpFrom = "title"; helpPage = p || 0; go("help"); },
    hover: function (x, y) { mouse.x = x; mouse.y = y; },
    aim: function (x, y) { aimOverride = x === null ? null : { x: x, y: y }; if (x !== null) armed = true; },
    armed: function () { return armed; },
    tip: function (id) { selectTip(id); return run && run.tip; },
    // advance the shift by `seconds` of game time with a path function(t, run) -> {x, y, tip?} (or the built-in autoplayer); boost multiplies the pressure
    sim: function (seconds, bot, boost) {
      if (!run) startShift();
      armed = true;
      if (boost) run.s.pressure *= boost;
      var path = typeof bot === "function" ? bot : demoPath;
      for (var t = 0; t < seconds && run && !run.over && screen === "shift"; t += STEP) {
        var p = path(run.time, run);
        if (p.tip && p.tip !== run.tip) selectTip(p.tip);
        RW.stepRun(game, run, p, STEP); handle(run.ev); aimOverride = { x: p.x, y: p.y };
      }
      if (run && run.over && !replay && !summary) { summary = { earned: run.earned, cleared: run.cleared, tips: run.tips, drops: run.drops, from: shiftStartPct, to: pct() }; overT = 1; }
      return run ? run.over : true;
    },
    replay: function (k, mode) { startReplay(k, mode || "town", { back: "town" }); },
    replayState: function () { return replay ? { k: replay.k, mode: replay.mode, phase: replay.phase, t: replay.t, split: replay.split } : null; },
    slider: function (v) { if (replay) { replay.phase = "slider"; replay.st = 99; replay.split = v; } },
    lapseAt: function (p) { if (replay) { replay.phase = "lapse"; replay.t = p * LAPSE_SECS; } },
    buy: function (id) { return RW.buy(game, id); },
    finish: function () { if (replay) finishReplay(); else if (summary) endShiftView(); },
    frameMs: function () { var a = frameMs.slice().sort(function (x, y) { return x - y; }); return { avg: frameMs.reduce(function (s, v) { return s + v; }, 0) / (frameMs.length || 1), p95: a[Math.floor(a.length * 0.95)] || 0, max: a[a.length - 1] || 0 }; },
    state: function () { return { screen: screen, paused: paused, over: run ? run.over : null, tip: run ? run.tip : null, summary: !!summary, replay: !!replay, helpPage: helpPage }; },
    toast: toast
  };
  go("title");
  applySound();
  requestAnimationFrame(frame);
})();
</script>
</body>
