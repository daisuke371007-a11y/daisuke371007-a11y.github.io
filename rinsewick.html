<!doctype html>

  html, body { margin: 0; height: 100%; background: #0f1a24; overflow: hidden; }

<body>
<canvas id="c" tabindex="0"></canvas>
<script>window.RINSE_EDITION = "demo";</script>
<script>
// core.js — RINSEWICK: the grime grid, the spray, the drones, the money and the upgrade tree.
// Pure logic: the page and the balance bot both drive it with the same step function.
(function (root) {
  "use strict";
  var W = 192, H = 112;

  // --- grime: hit points and pay at the first site; later sites scale both ---
  var GRIME = [
    null,
    { id: 1, key: "dust", name: "Dust", hp: 1, val: 1, col: [148, 128, 98] },
    { id: 2, key: "mud", name: "Mud", hp: 5, val: 4, col: [92, 68, 44] },
    { id: 3, key: "moss", name: "Moss", hp: 15, val: 10, col: [66, 104, 46] },
    { id: 4, key: "gum", name: "Gum", hp: 120, val: 70, col: [214, 116, 166] },
    { id: 5, key: "rust", name: "Rust", hp: 50, val: 30, col: [158, 74, 34] },
    { id: 6, key: "barnacle", name: "Barnacles", hp: 300, val: 150, col: [204, 198, 172] },
    { id: 7, key: "soot", name: "Soot", hp: 200, val: 110, col: [44, 42, 46] },
    { id: 8, key: "tar", name: "Tar", hp: 800, val: 350, col: [22, 20, 26] }
  ];
  var DUST = 1, MUD = 2, MOSS = 3, GUM = 4, RUST = 5, BARN = 6, SOOT = 7, TAR = 8;

  // --- the ten sites of Rinsewick ---
  // layer: { t, cover (0..1 of the masked area), scale (noise size), bias ('low'|'high'|'edge'), on (material list) }
  // spots: { t, spots, r }
  var SITES = [
    { id: "FENCE", item: "a tennis ball", name: "Garden Fence", hpMul: 1, valMul: 1, regrow: 0,
      layers: [{ t: DUST, cover: 1 }, { t: MUD, cover: 0.42, scale: 18, bias: "low" }] },
    { id: "STEPS", item: "the spare key", name: "Front Steps", hpMul: 1600, valMul: 5, regrow: 0,
      layers: [{ t: DUST, cover: 1 }, { t: MUD, cover: 0.5, scale: 14, bias: "low" }, { t: GUM, spots: 26, r: [1, 2] }] },
    { id: "PATH", item: "the gnome's lost hat", name: "Mailbox Path", hpMul: 28000, valMul: 25, regrow: 25,
      layers: [{ t: DUST, cover: 1 }, { t: MUD, cover: 0.35, scale: 16 }, { t: MOSS, cover: 0.45, scale: 10, on: [3, 5] }, { t: GUM, spots: 14, r: [1, 2] }] },
    
  ];

  // --- the upgrade tree ---
  // x, y: place on the tree board (units); from: the nodes that reveal it; cur: "$" money, "tip", "pearl"
  // base, grow: price of level 1 and the factor per level; site: shown once this site is reached (index)
  var NODES = [
    { id: "HOSE", name: "Garden Hose", desc: "Where it all starts.", x: 0, y: 0, max: 1, base: 0, grow: 1, cur: "$" },
    { id: "PUMP", name: "Stronger Pump", desc: "+15% pressure.", x: 0, y: -1, from: ["HOSE"], max: 60, base: 15, grow: 2.2, cur: "$" },
    { id: "NOZZLE", name: "Wider Nozzle", desc: "+0.3 spray radius.", x: 1, y: 0, from: ["HOSE"], max: 12, base: 25, grow: 1.95, cur: "$" },
    { id: "TANK", name: "Bigger Tank", desc: "+1 s of water each shift.", x: 0, y: 1, from: ["HOSE"], max: 20, base: 20, grow: 1.6, cur: "$" },
    { id: "SOAP", name: "Soap", desc: "+20% pay.", x: -1, y: 0, from: ["HOSE"], max: 50, base: 40, grow: 1.6, cur: "$" },

    { id: "SPLASH", name: "Splashback", desc: "Each cleared cell has +3% chance to splash its neighbours.", x: 2, y: -0.5, from: ["NOZZLE"], max: 10, base: 90, grow: 1.9, cur: "$" },
    { id: "HARDSPLASH", name: "Hard Splash", desc: "Splashes hit +60% harder.", x: 3, y: -1, from: ["SPLASH"], max: 6, base: 600, grow: 2.3, cur: "$" },
    { id: "FAN", name: "Fan Tip", desc: "+12% spray radius.", x: 2, y: 0.5, from: ["NOZZLE"], max: 6, base: 1500, grow: 2.6, cur: "$" },
    { id: "BURST", name: "Pressure Burst", desc: "Every few seconds the nozzle bursts: a ring hit worth 4 s of spray.", x: 1, y: -2, from: ["PUMP"], max: 1, base: 250, grow: 1, cur: "$" },
    { id: "BURSTRATE", name: "Quick Valve", desc: "Bursts come 0.4 s sooner.", x: 2, y: -2.5, from: ["BURST"], max: 5, base: 700, grow: 2.2, cur: "$" },
    { id: "BURSTSIZE", name: "Big Burst", desc: "+1.5 burst radius.", x: 1, y: -3, from: ["BURST"], max: 5, base: 900, grow: 2.3, cur: "$" },
    { id: "INDUSTRIAL", name: "Industrial Pump", desc: "x1.4 pressure.", x: -1, y: -2, from: ["PUMP"], max: 30, base: 2500, grow: 4.5, cur: "$" },
    { id: "HYDRO", name: "Hydro Cannon", desc: "x1.8 pressure.", x: -1, y: -3, from: ["INDUSTRIAL"], max: 30, base: 100000.0, grow: 7, cur: "$", site: 4 },

    { id: "DRIP", name: "Drip Catcher", desc: "Water drops hide in the grime: +0.2% per cleared cell. Each refills 0.5 s (a shift grows by half at most).", x: 1, y: 2, from: ["TANK"], max: 5, base: 120, grow: 2.1, cur: "$" },
    { id: "TOWER", name: "Water Tower", desc: "+20% water.", x: 0, y: 3, from: ["TANK"], max: 6, base: 3000, grow: 2.8, cur: "$" },
    { id: "DRONE", name: "Helper Drone", desc: "A little drone sprays the dirtiest spot it can find.", x: -1, y: 2, from: ["TANK"], max: 1, base: 400, grow: 1, cur: "$" },
    { id: "DRONES", name: "More Drones", desc: "+1 drone.", x: -2, y: 2.5, from: ["DRONE"], max: 5, base: 2500, grow: 3.4, cur: "$" },
    { id: "DRONEPOW", name: "Drone Jets", desc: "Drones spray +30% harder.", x: -1, y: 3, from: ["DRONE"], max: 40, base: 1200, grow: 2.6, cur: "$" },
    { id: "DRONESPD", name: "Drone Motors", desc: "Drones fly +30% faster.", x: -2, y: 3.5, from: ["DRONEPOW"], max: 4, base: 5000, grow: 3, cur: "$" },

    { id: "WAX", name: "Premium Wax", desc: "+50% pay (on top of soap).", x: -2, y: -0.5, from: ["SOAP"], max: 30, base: 2000, grow: 2.2, cur: "$" },
    { id: "CHANGE", name: "Loose Change", desc: "Tips hide in the grime: +0.1% per cleared cell.", x: -2, y: 0.5, from: ["SOAP"], max: 5, base: 200, grow: 2.2, cur: "$" },
    { id: "SCRUB", name: "Scrub Brush", desc: "Dust and mud come off x2 faster.", x: -3, y: -1, from: ["WAX"], max: 3, base: 3000, grow: 4, cur: "$" },
    { id: "WEED", name: "Weed Killer", desc: "Moss comes off x3 faster and stops growing back.", x: 1, y: 1, from: ["NOZZLE", "TANK"], max: 1, base: 1500, grow: 1, cur: "$", site: 2 },
    { id: "GUMSCRAPE", name: "Gum Scraper", desc: "Gum comes off x2 faster.", x: 1, y: -1, from: ["PUMP", "NOZZLE"], max: 3, base: 800, grow: 4, cur: "$", site: 1 },
    

    { id: "NIGHT", name: "Night Shift", desc: "Drones keep cleaning while you shop: 15% speed per level.", x: -2, y: 1.5, from: ["DRONE"], max: 4, base: 3, grow: 2, cur: "tip" },
    { id: "LUCKY", name: "Lucky Sponge", desc: "Water drops refill +0.3 s more.", x: 2, y: 1.5, from: ["DRIP"], max: 4, base: 4, grow: 2, cur: "tip" },
    { id: "TIPJAR", name: "Tip Jar", desc: "+1 tip per tip found.", x: -3, y: 1, from: ["CHANGE"], max: 3, base: 6, grow: 2.5, cur: "tip" },
    { id: "POWERTIP", name: "Brass Nozzle", desc: "x1.25 pressure.", x: 3, y: -2, from: ["HARDSPLASH", "BURSTRATE"], max: 12, base: 5, grow: 1.9, cur: "tip" },

    { id: "TWIN", name: "Twin Hose", desc: "A second hose sprays the mirror spot.", x: 2, y: 3, from: ["DRIP", "TOWER"], max: 1, base: 2, grow: 1, cur: "pearl" },
    { id: "RAIN", name: "Rain Maker", desc: "Every 2 s a shower falls on the dirtiest places.", x: 3, y: 2, from: ["LUCKY"], max: 3, base: 1, grow: 2, cur: "pearl" },
    { id: "PRO", name: "Pro Washer", desc: "x2 pressure.", x: 0, y: -4, from: ["BURSTSIZE", "HYDRO", "INDUSTRIAL"], max: 3, base: 1, grow: 2, cur: "pearl" }
  ];
  var NODE = {};
  NODES.forEach(function (n) { NODE[n.id] = n; });

  // --- small helpers ---
  function rng(seed) {
    var a = seed >>> 0;
    return function () {
      a = (a + 0x6D2B79F5) >>> 0;
      var t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function noiseField(rand, scale) {
    // value noise, two octaves, 0..1
    var gw = Math.ceil(W / scale) + 2, gh = Math.ceil(H / scale) + 2, g = [], g2 = [];
    for (var i = 0; i < gw * gh; i++) g.push(rand());
    var s2 = scale / 2, gw2 = Math.ceil(W / s2) + 2, gh2 = Math.ceil(H / s2) + 2;
    for (i = 0; i < gw2 * gh2; i++) g2.push(rand());
    function sm(t) { return t * t * (3 - 2 * t); }
    function at(grid, w, x, y, s) {
      var fx = x / s, fy = y / s, ix = Math.floor(fx), iy = Math.floor(fy), tx = sm(fx - ix), ty = sm(fy - iy);
      var a = grid[iy * w + ix], b = grid[iy * w + ix + 1], c = grid[(iy + 1) * w + ix], d = grid[(iy + 1) * w + ix + 1];
      return (a + (b - a) * tx) + ((c + (d - c) * tx) - (a + (b - a) * tx)) * ty;
    }
    var out = new Float32Array(W * H);
    for (var y = 0; y < H; y++) for (var x = 0; x < W; x++) out[y * W + x] = at(g, gw, x, y, scale) * 0.7 + at(g2, gw2, x, y, s2) * 0.3;
    return out;
  }

  // --- building a site's grime ---
  function buildGrid(k, mat) {
    var site = SITES[k], rand = rng(9001 + k * 7919);
    var type = new Uint8Array(W * H), max = new Float32Array(W * H), thick = new Float32Array(W * H);
    site.layers.forEach(function (L) {
      if (L.spots) {
        for (var s = 0; s < L.spots; s++) {
          var cx = Math.floor(rand() * W), cy = Math.floor(rand() * H), r = L.r[0] + rand() * (L.r[1] - L.r[0]);
          for (var y = Math.floor(cy - r); y <= cy + r; y++) for (var x = Math.floor(cx - r); x <= cx + r; x++) {
            if (x < 0 || y < 0 || x >= W || y >= H) continue;
            if ((x - cx) * (x - cx) + (y - cy) * (y - cy) <= r * r + 0.5) type[y * W + x] = L.t;
          }
        }
        return;
      }
      var n = L.cover >= 1 ? null : noiseField(rand, L.scale || 12);
      for (var i = 0; i < W * H; i++) {
        if (L.on && L.on.indexOf(mat[i]) < 0) continue;
        if (n) {
          var v = n[i], y = (i / W) | 0, x = i % W;
          if (L.bias === "low") v += (y / H - 0.5) * 0.5;
          if (L.bias === "high") v += (0.5 - y / H) * 0.5;
          if (L.bias === "edge") v += (Math.max(Math.abs(x / W - 0.5), Math.abs(y / H - 0.5)) - 0.3) * 0.8;
          if (v < 1 - L.cover * 0.62 - 0.19) continue;
        }
        type[i] = L.t;
      }
    });
    var hp = new Float32Array(W * H), total = 0;
    for (var i = 0; i < W * H; i++) {
      thick[i] = 0.75 + 0.5 * rand();
      if (!type[i]) continue;
      max[i] = hp[i] = GRIME[type[i]].hp * site.hpMul * thick[i];
      total++;
    }
    // the lost item hides under the thickest grime near the middle
    var item = -1, best = -1;
    for (var j = 0; j < 400; j++) {
      var c = Math.floor((0.2 + 0.6 * rand()) * W) + Math.floor((0.2 + 0.6 * rand()) * H) * W;
      if (type[c] && max[c] > best) { best = max[c]; item = c; }
    }
    return { k: k, type: type, hp: hp, max: max, thick: thick, total: total, remaining: total, item: item, mat: mat, dirty: [] };
  }

  // --- the game ---
  function newGame(paint) {
    var g = { v: 1, site: 0, reached: 0, money: 0, tips: 0, pearls: 0, lv: { HOSE: 1 }, restored: [], found: [],
      stats: { shifts: 0, time: 0, cleared: 0, earned: 0, shop: 0 }, done: false };
    g.paint = paint;
    g.grid = buildGrid(0, paint(0).mat);
    return g;
  }
  function lv(g, id) { return g.lv[id] || 0; }
  function stats(g) {
    var s = {};
    s.pressure = 15 * Math.pow(1.15, lv(g, "PUMP")) * Math.pow(1.4, lv(g, "INDUSTRIAL")) * Math.pow(1.8, lv(g, "HYDRO")) *
      Math.pow(1.25, lv(g, "POWERTIP")) * Math.pow(2, lv(g, "PRO"));
    s.radius = (3.2 + 0.3 * lv(g, "NOZZLE")) * (1 + 0.12 * lv(g, "FAN"));
    s.tank = (6 + lv(g, "TANK")) * (1 + 0.2 * lv(g, "TOWER"));
    s.pay = (1 + 0.2 * lv(g, "SOAP")) * (1 + 0.5 * lv(g, "WAX")) * (1 + lv(g, "MEGAWAX"));
    s.splash = 0.03 * lv(g, "SPLASH");
    s.splashPow = 0.35 * Math.pow(1.6, lv(g, "HARDSPLASH"));
    s.burst = lv(g, "BURST") ? 3.2 - 0.4 * lv(g, "BURSTRATE") : 0;
    s.burstR = 4 + 1.5 * lv(g, "BURSTSIZE");
    s.drip = 0.002 * lv(g, "DRIP");
    s.dripAmt = 0.5 + 0.3 * lv(g, "LUCKY");
    s.tipChance = 0.001 * lv(g, "CHANGE");
    s.tipAmt = 1 + lv(g, "TIPJAR");
    s.drones = lv(g, "DRONE") ? 1 + lv(g, "DRONES") : 0;
    s.dronePow = 0.25 * Math.pow(1.3, lv(g, "DRONEPOW"));
    s.droneSpd = 22 * (1 + 0.3 * lv(g, "DRONESPD"));
    s.night = 0.15 * lv(g, "NIGHT");
    s.twin = lv(g, "TWIN") > 0;
    s.rain = lv(g, "RAIN");
    var m = [1, 1, 1, 1, 1, 1, 1, 1, 1];
    m[DUST] = m[MUD] = Math.pow(2, lv(g, "SCRUB"));
    m[MOSS] = lv(g, "WEED") ? 3 : 1;
    m[GUM] = Math.pow(2, lv(g, "GUMSCRAPE"));
    m[RUST] = Math.pow(2, lv(g, "RUSTOFF"));
    m[BARN] = Math.pow(2, lv(g, "CHISEL"));
    m[SOOT] = m[TAR] = Math.pow(2, lv(g, "DEGREASE"));
    s.typeMul = m;
    s.regrow = lv(g, "WEED") ? 0 : 1;
    return s;
  }

  function visible(g, id) {
    var n = NODE[id];
    if (!n) return false;
    if (n.site && g.reached < n.site) return false;
    if (!n.from) return true;
    return n.from.some(function (p) { return lv(g, p) > 0; });
  }
  function cost(g, id) {
    var n = NODE[id], l = lv(g, id);
    if (l >= n.max) return Infinity;
    var c = n.base * Math.pow(n.grow, l);
    return n.cur === "$" ? Math.ceil(c) : Math.round(c);
  }
  function wallet(g, cur) { return cur === "$" ? "money" : cur === "tip" ? "tips" : "pearls"; }
  function canBuy(g, id) {
    var n = NODE[id];
    return visible(g, id) && lv(g, id) < n.max && g[wallet(g, n.cur)] >= cost(g, id);
  }
  function buy(g, id) {
    if (!canBuy(g, id)) return false;
    var n = NODE[id];
    g[wallet(g, n.cur)] -= cost(g, id);
    g.lv[id] = lv(g, id) + 1;
    return true;
  }

  // --- a shift (one run) ---
  function startRun(g) {
    var s = stats(g), rand = rng(1234567 + g.stats.shifts * 101 + g.site * 7);
    var run = { s: s, tank: s.tank, refill: 0, time: 0, earned: 0, cleared: 0, tips: 0, drops: 0, rand: rand,
      burstT: 0, rainT: 0, regrowT: 0, ev: [], over: false, drones: [] };
    for (var i = 0; i < s.drones; i++) run.drones.push({ x: W * (0.2 + 0.6 * rand()), y: H * (0.2 + 0.6 * rand()), tx: -1, ty: -1, retarget: 0 });
    g.stats.shifts++;
    return run;
  }

  function clearCell(g, run, i, queue) {
    var G = g.grid, t = G.type[i];
    G.type[i] = 0; G.hp[i] = 0; G.remaining--;
    G.dirty.push(i);
    var pay = GRIME[t].val * SITES[G.k].valMul * G.thick[i] * run.s.pay;
    g.money += pay; run.earned += pay; run.cleared++;
    g.stats.cleared++; g.stats.earned += pay;
    var x = i % W, y = (i / W) | 0;
    if (i === G.item && g.found.indexOf(G.k) < 0) { g.found.push(G.k); g.pearls++; run.ev.push({ e: "item", x: x, y: y, k: G.k }); }
    var r = run.rand;
    if (run.s.tipChance && r() < run.s.tipChance) { g.tips += run.s.tipAmt; run.tips += run.s.tipAmt; run.ev.push({ e: "tip", x: x, y: y }); }
    if (run.s.drip && run.refill < run.s.tank * 0.5 && r() < run.s.drip) { run.tank += run.s.dripAmt; run.refill += run.s.dripAmt; run.drops++; run.ev.push({ e: "drop", x: x, y: y }); }
    if (run.s.splash && (run.gen || 0) < 3 && r() < run.s.splash) queue.push(i * 4 + (run.gen || 0));
  }
  function hit(g, run, i, dmg, queue) {
    var G = g.grid, t = G.type[i];
    if (!t) return;
    G.hp[i] -= dmg * run.s.typeMul[t];
    G.dirty.push(i);
    if (G.hp[i] <= 0) clearCell(g, run, i, queue);
  }
  function splashes(g, run, queue) {
    var G = g.grid, n = 0, amt = run.s.pressure * run.s.splashPow;
    while (queue.length && n < 4000) {
      var q = queue.pop(), i = q >> 2, x = i % W, y = (i / W) | 0;
      run.gen = (q & 3) + 1;
      n++;
      if (x > 0) hit(g, run, i - 1, amt, queue);
      if (x < W - 1) hit(g, run, i + 1, amt, queue);
      if (y > 0) hit(g, run, i - W, amt, queue);
      if (y < H - 1) hit(g, run, i + W, amt, queue);
    }
    queue.length = 0;
    run.gen = 0;
  }
  function spray(g, run, cx, cy, R, power, dt, queue) {
    // power: damage per second at the centre of the jet
    var x0 = Math.max(0, Math.floor(cx - R)), x1 = Math.min(W - 1, Math.floor(cx + R)), y0 = Math.max(0, Math.floor(cy - R)), y1 = Math.min(H - 1, Math.floor(cy + R));
    var R2 = R * R, G = g.grid;
    for (var y = y0; y <= y1; y++) for (var x = x0; x <= x1; x++) {
      var dx = x + 0.5 - cx, dy = y + 0.5 - cy, d2 = dx * dx + dy * dy;
      if (d2 > R2) continue;
      var i = y * W + x;
      if (!G.type[i]) continue;
      hit(g, run, i, power * dt * (1 - 0.55 * d2 / R2), queue);
    }
  }
  function findDirty(g, rand, nearX, nearY) {
    // the grimiest cell among a few random samples, preferring near ones
    var G = g.grid, best = -1, bestScore = -1;
    for (var k = 0; k < 28; k++) {
      var i = Math.floor(rand() * W * H);
      if (!G.type[i]) continue;
      var x = i % W, y = (i / W) | 0, d = nearX < 0 ? 0 : Math.abs(x - nearX) + Math.abs(y - nearY);
      var sc = GRIME[G.type[i]].val / (1 + d / 12);
      if (sc > bestScore) { bestScore = sc; best = i; }
    }
    if (best < 0 && G.remaining > 0) {
      var start = Math.floor(rand() * W * H);
      for (var j = 0; j < W * H; j++) { var c = (start + j) % (W * H); if (G.type[c]) { best = c; break; } }
    }
    return best;
  }
  function moveDrones(g, run, dt, power, queue) {
    var s = run.s, G = g.grid;
    run.drones.forEach(function (d) {
      // a drone flies to a dirty spot and stays until it is clean (or for 3 s), then picks the next
      var there = Math.abs(d.tx - d.x) + Math.abs(d.ty - d.y) < 1;
      if (there) d.retarget -= dt;
      if (d.tx < 0 || d.retarget <= 0 || !G.type[Math.floor(d.ty) * W + Math.floor(d.tx)]) {
        var c = findDirty(g, run.rand, d.x, d.y);
        if (c >= 0) { d.tx = c % W + 0.5; d.ty = ((c / W) | 0) + 0.5; }
        d.retarget = 3;
      }
      var dx = d.tx - d.x, dy = d.ty - d.y, dist = Math.sqrt(dx * dx + dy * dy), stepLen = s.droneSpd * dt;
      if (dist > 0.01) { var f = Math.min(1, stepLen / dist); d.x += dx * f; d.y += dy * f; }
      spray(g, run, d.x, d.y, 2.2, power, dt, queue);
    });
  }
  function regrow(g, run, dt) {
    var site = SITES[g.grid.k];
    if (!site.regrow || !run.s.regrow) return;
    run.regrowT += site.regrow * dt;
    var G = g.grid, r = run.rand;
    while (run.regrowT >= 1) {
      run.regrowT -= 1;
      var i = Math.floor(r() * W * H);

      if (eff) { text(eff, bx + 15, yy + 2, 13, "#9bd6f2", "left", 700); yy += 22; }
      if (maxed) text("Fully upgraded", bx + 15, yy + 8, 15, COL.gold, "left", 800);
      else text("Cost  " + costText(n), bx + 15, yy + 8, 16, RW.canBuy(game, n.id) ? curColor(n.cur) : COL.warn, "left", 800);
    }
    drawToasts(dt);
  }

  // ---------------- title, help, town, endings ----------------
  var attract = null;
  function makeAttract() {
    var k = DEMO ? 0 : 9;
    var g = RW.newGame(ART.paint); g.site = k; g.grid = RW.buildGrid(k, ART.paint(k).mat);
    var r = RW.startRun(g); r.s.pressure = RW.SITES[k].hpMul * 2500; r.s.radius = 7; r.tank = 1e9; r.s.drip = 0; r.s.tipChance = 0; r.s.splash = 0.3; r.s.splashPow = 1;
    var c = document.createElement("canvas"); c.width = GW; c.height = GH;
    attract = { g: g, run: r, t: 0, c: c, x: c.getContext("2d"), d: null, pic: ART.paint(k).rgb, wait: 0 };
    attract.d = attract.x.createImageData(GW, GH);
  }
  function drawAttract(dt, x0, y0, sc) {
    if (!attract) makeAttract();
    var A = attract, G = A.g.grid;
    A.t += dt;
    if (G.remaining < G.total * 0.02 || A.g.done || A.g.grid.k !== G.k) { A.wait += dt; if (A.wait > 2.5) makeAttract(); }
    else for (var i = 0; i < 2; i++) {
      var t = A.t + i / 120, pos = { x: GW / 2 + Math.sin(t * 0.9) * GW * 0.44 * Math.cos(t * 0.13), y: GH / 2 + Math.sin(t * 2.3) * GH * 0.42 };
      A.pos = pos; RW.stepRun(A.g, A.run, pos, 1 / 120); A.run.ev.length = 0; A.run.over = false;
    }
    var d = A.d.data, p = A.pic;
    for (var c = 0; c < GW * GH; c++) {
      var ty = G.type[c], o = c * 4, r = p[c * 3], g = p[c * 3 + 1], b = p[c * 3 + 2];
      if (ty) { var col = RW.GRIME[ty].col, v = vary[c] * (1.12 - (G.thick[c] - 0.75) * 0.45), a = 0.3 + 0.55 * Math.min(1, G.hp[c] / G.max[c]); r = r * (1 - a) + col[0] * v * a; g = g * (1 - a) + col[1] * v * a; b = b * (1 - a) + col[2] * v * a; }
      d[o] = r; d[o + 1] = g; d[o + 2] = b; d[o + 3] = 255;
    }
    G.dirty.length = 0;
    A.x.putImageData(A.d, 0, 0);
    cx.imageSmoothingEnabled = false; cx.drawImage(A.c, x0, y0, GW * sc, GH * sc); cx.imageSmoothingEnabled = true;
    if (A.pos && A.wait === 0) {
      var mx = x0 + A.pos.x * sc, my = y0 + A.pos.y * sc;
      cx.beginPath(); cx.arc(mx, my, 7 * sc, 0, 7); cx.fillStyle = "rgba(220,248,255,0.35)"; cx.fill();
      cx.strokeStyle = "rgba(230,250,255,0.8)"; cx.lineWidth = 2; cx.beginPath(); cx.moveTo(mx + 40, my + 60); cx.lineTo(mx, my); cx.stroke();
      cx.lineCap = "round"; cx.strokeStyle = "#2a2f36"; cx.lineWidth = 7; cx.beginPath(); cx.moveTo(mx + 40, my + 60); cx.lineTo(mx + 100, my + 148); cx.stroke();
      cx.strokeStyle = "#f3c74e"; cx.lineWidth = 14; cx.beginPath(); cx.moveTo(mx + 100, my + 148); cx.lineTo(mx + 130, my + 192); cx.stroke(); cx.lineCap = "butt";
    }
  }
  function drawTitle(dt) {
    cx.fillStyle = COL.bg; cx.fillRect(0, 0, W, H);
    drawAttract(dt, 0, 0, W / GW);
    var g = cx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, "rgba(8,18,28,0.82)"); g.addColorStop(0.42, "rgba(8,18,28,0.25)"); g.addColorStop(0.7, "rgba(8,18,28,0.15)"); g.addColorStop(1, "rgba(8,18,28,0.85)");
    cx.fillStyle = g; cx.fillRect(0, 0, W, H);
    pixelText("RINSEWICK", W / 2, 70, 15, "#eaf8ff", "center", "#1b5a86");
    text("Pressure-wash a whole seaside town clean.", W / 2, 186, 22, "#d6eef8", "center", 700);
    text("FREE DEMO  ·  the first 3 jobs", W / 2, 218, 15, COL.tip, "center", 800);
    var by = 560;
    if (hasSave && !confirmNew) {
      button(W / 2 - 130, by, 260, 56, game.done ? "VIEW TOWN" : "CONTINUE", function () { startHiss(); if (game.done) { townFrom = "title"; screen = "town"; } else { rebuildImage(); screen = "tree"; } }, { primary: true, size: 20 });
      button(W / 2 - 290, by + 8, 140, 42, "NEW GAME", function () { confirmNew = true; });
    } else if (confirmNew) {
      text("Start over? Your current town will be wiped.", W / 2, by - 18, 16, COL.warn, "center", 700);
      button(W / 2 - 130, by, 120, 50, "YES", function () { game = RW.newGame(ART.paint); persist(); confirmNew = false; rebuildImage(); startShift(); }, { primary: true });
      button(W / 2 + 10, by, 120, 50, "NO", function () { confirmNew = false; });
    } else {
      button(W / 2 - 130, by, 260, 56, "START WASHING", function () { rebuildImage(); startShift(); }, { primary: true, size: 20 });
    }
    if (!confirmNew) button(W / 2 + 150, by + 8, 140, 42, "HOW TO PLAY", function () { helpFrom = "title"; screen = "help"; });
    button(W / 2 - 130, by + 74, 260, 42, "GET THE FULL GAME", openStore, { size: 15 });
    text("Mouse to aim  ·  Space to continue  ·  Esc to pause  ·  M for sound", W / 2, H - 22, 13, "#9ab6c6", "center", 600);
  }
  function openStore() { try { window.open(STORE_URL, "_blank", "noopener"); } catch (e) {} }
  var helpFrom = "title", townFrom = "tree";
  function drawHelp() {
    cx.fillStyle = COL.bg; cx.fillRect(0, 0, W, H);
    pixelText("HOW TO PLAY", W / 2, 40, 7, "#cfe8f4", "center");
    var lines = [
      ["A shift", "Your tank holds a few seconds of water. The hose sprays wherever the mouse points, all by itself. When the tank is empty, the shift is over."],
      ["Grime", "Each speck of grime pays when it comes off completely. Dust is soft; gum, rust, barnacles, soot and tar are tough and pay more. The panel under the picture tells you how long each one takes at full pressure."],
      ["It stays clean", "What you wash stays washed. Grime you only weakened stays weak for next time. Moss grows back into clean spots until you buy Weed Killer."],
      ["Upgrades", "Between shifts, spend money on the upgrade tree: pressure, a wider spray, a bigger tank, soap for more pay, splashes, bursts, helper drones. Tips (coins hidden in the grime) and pearls buy the special ones."],
      ["Restore the town", "When a picture is spotless, the job is done: you get a pearl and the next job in Rinsewick. Each job also hides one lost item worth a pearl."],
      ["Keys", "Space: continue / start the shift.  Esc: pause.  M: sound on or off. Progress saves by itself in this browser."]
    ];
    var y = 120;
    lines.forEach(function (l) { text(l[0], 150, y, 18, COL.water, "left", 800); y = wrap(l[1], 330, y, 720, 16, COL.text, 23, 600) + 18; });
    button(W / 2 - 100, H - 90, 200, 48, "BACK", function () { screen = helpFrom; }, { primary: true });
  }
  function drawTown() {
    cx.fillStyle = COL.bg; cx.fillRect(0, 0, W, H);
    pixelText("RINSEWICK", W / 2, 26, 6, "#cfe8f4", "center");
    text(game.restored.length + " of " + (DEMO ? 10 : RW.SITES.length) + " jobs restored  ·  " + game.found.length + " lost items found", W / 2, 76, 16, COL.dim, "center", 700);
    for (var k = 0; k < 10; k++) {
      var col = k % 5, row = (k / 5) | 0, x = 60 + col * 220, y = 110 + row * 300, w = 200, h = 117;
      var full = k < RW.SITES.length, done = game.restored.indexOf(k) >= 0, curr = full && game.grid.k === k && !done;
      rr(x - 6, y - 6, w + 12, h + 120, 12); cx.fillStyle = COL.panel; cx.fill();
      cx.imageSmoothingEnabled = false;
      if (done) cx.drawImage(cleanCanvas(k), x, y, w, h);
      else if (curr) cx.drawImage(off, x, y, w, h);
      else { cx.fillStyle = "#0b1520"; cx.fillRect(x, y, w, h); text(full ? "?" : "FULL GAME", x + w / 2, y + h / 2, full ? 40 : 16, "#35546a", "center", 800); }
      cx.imageSmoothingEnabled = true;
      var nm = full ? RW.SITES[k].name : ["", "", "", "Old Pickup", "Town Fountain", "Boardwalk", "Fishing Boat", "Lighthouse Door", "Clock Tower", "Town Mural"][k];
      text((k + 1) + ". " + (done || curr || !full ? nm : "???"), x, y + h + 20, 15, done ? "#9be27a" : COL.text, "left", 800);
      text(done ? "Restored" : curr ? (pct() * 100).toFixed(1) + "% clean" : full ? "Not yet" : "In the full game", x, y + h + 42, 13, COL.dim, "left", 700);
      if (full) {
        var f = game.found.indexOf(k) >= 0;
        if (f) pearl(x + 8, y + h + 68, 7);
        text(f ? "Found " + RW.SITES[k].item : "Lost item: ?", x + (f ? 20 : 0), y + h + 68, 13, f ? COL.pearl : "#5f7d90", "left", 600);
      }
    }
    button(W / 2 - 100, H - 70, 200, 46, "BACK", function () { screen = townFrom; }, { primary: true });
  }
  function drawEnd(dt) {
    cx.fillStyle = COL.bg; cx.fillRect(0, 0, W, H);
    cx.imageSmoothingEnabled = false; cx.drawImage(cleanCanvas(RW.SITES.length - 1), 216, 14, 768, 448); cx.imageSmoothingEnabled = true;
    for (var i = 0; i < 2; i++) parts.push({ k: "spark", x: 216 + Math.random() * 768, y: 14 + Math.random() * 448, t: 0 });
    drawParticles(dt);
    rr(216, 476, 768, 270, 18); cx.fillStyle = COL.panel; cx.fill();
    pixelText("RINSEWICK SPARKLES", W / 2, 494, 6, "#9be27a", "center", "#1e4a26");
    var st = game.stats, mins = Math.round((st.time + st.shop) / 60);
    text("Every job in town is done. Thank you for washing.", W / 2, 552, 18, COL.text, "center", 700);
    text(st.shifts + " shifts  ·  " + RW.fmt(st.cleared) + " cells washed  ·  " + money(st.earned) + " earned  ·  about " + mins + " min", W / 2, 584, 15, COL.dim, "center", 700);
    text(game.found.length + " of 10 lost items found", W / 2, 610, 15, COL.pearl, "center", 700);
    button(W / 2 - 230, 650, 200, 46, "TOWN", function () { townFrom = "end"; screen = "town"; }, { primary: true });
    button(W / 2 + 30, 650, 200, 46, "TITLE", function () { screen = "title"; });
  }
  
  function drawDemoEnd(dt) {
    cx.fillStyle = COL.bg; cx.fillRect(0, 0, W, H);
    pixelText("THE DEMO ENDS HERE", W / 2, 40, 7, "#cfe8f4", "center");
    for (var k = 0; k < 3; k++) { cx.imageSmoothingEnabled = false; cx.drawImage(cleanCanvas(k), 90 + k * 350, 120, 320, 187); cx.imageSmoothingEnabled = true; text(RW.SITES[k].name + " - restored", 90 + k * 350, 324, 15, "#9be27a", "left", 800); }
    var y = 380;
    y = wrap("You restored the first three jobs. The full game has seven more: an old pickup truck, the town fountain, the boardwalk, a fishing boat's hull, the lighthouse door, the clock tower and the town mural - with rust, barnacles, soot and tar to blast off.", 150, y, 900, 17, COL.text, 26, 600);
    y = wrap("More upgrades too: Hydro Cannon, Rust Solvent, Barnacle Chisel, Degreaser, Showroom Shine, and every level of the ones you know.", 150, y + 10, 900, 17, COL.dim, 26, 600);
    button(W / 2 - 160, 600, 320, 56, "GET THE FULL GAME", openStore, { primary: true, size: 19 });
    button(W / 2 - 100, 672, 200, 40, "TITLE", function () { screen = "title"; });
  }
  

  function toggleMute() { settings.muted = !settings.muted; saveSettings(); if (settings.muted) setHiss(0, 0); }

  // ---------------- main loop ----------------
  var lastT = performance.now();
  function frame(now) {
    var dt = Math.min(0.05, (now - lastT) / 1000); lastT = now;
    popT -= dt;
    buttons = [];
    cx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
    cx.fillStyle = COL.bg; cx.fillRect(0, 0, W, H);
    if (screen === "title") drawTitle(dt);
    else if (screen === "shift") drawShift(dt);
    else if (screen === "tree") drawTree(dt);
    else if (screen === "help") drawHelp();
    else if (screen === "town") drawTown();
    else if (screen === "end") drawEnd(dt);
    else if (screen === "demoend") drawDemoEnd(dt);
    if (screen !== "shift") setHiss(0, 0);
    requestAnimationFrame(frame);
  }
  function resize() {
    var vw = window.innerWidth, vh = window.innerHeight;
    scale = Math.min(vw / W, vh / H); dpr = window.devicePixelRatio || 1;
    cv.style.width = Math.floor(W * scale) + "px"; cv.style.height = Math.floor(H * scale) + "px";
    cv.width = Math.floor(W * scale * dpr); cv.height = Math.floor(H * scale * dpr);
  }
  window.addEventListener("resize", resize); resize();
  function local(e) { var r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H }; }
  function setAim(m) {
    aim = { x: Math.max(0, Math.min(GW, (m.x - PX) / CELL)), y: Math.max(0, Math.min(GH, (m.y - PY) / CELL)) };
  }
  cv.addEventListener("pointermove", function (e) { mouse.x = local(e).x; mouse.y = local(e).y; if (screen === "shift") setAim(mouse); });
  cv.addEventListener("pointerleave", function () { mouse.x = -1; mouse.y = -1; mouse.down = false; });
  cv.addEventListener("pointerup", function () { mouse.down = false; });
  cv.addEventListener("pointerdown", function (e) {
    var m = local(e);
    mouse.x = m.x; mouse.y = m.y; mouse.down = true;
    cv.focus();
    startHiss();
    for (var i = buttons.length - 1; i >= 0; i--) { var b = buttons[i]; if (m.x >= b.x && m.x <= b.x + b.w && m.y >= b.y && m.y <= b.y + b.h) { sfx("click"); b.fn(); return; } }
    if (screen === "shift") { setAim(m); if (paused) paused = false; return; }
    if (screen === "tree") {
      var hitN = null;
      RW.NODES.forEach(function (n) { if (RW.visible(game, n.id)) { var p = nodePos(n); if (Math.hypot(m.x - p.x, m.y - p.y) <= NR + 2) hitN = n; } });
      if (hitN) { tipNode = hitN; settings.seenTree = true; saveSettings(); if (tryBuy(hitN)) holdBuy = { n: hitN, t: 0.4 }; }
    }
  });
  window.addEventListener("keydown", function (e) {
    var k = e.key;
    if (k === "m" || k === "M") { toggleMute(); return; }
    if (screen === "shift") {
      if (k === "Escape" || k === "p" || k === "P") { if (!run.over) paused = !paused; e.preventDefault(); return; }
      if (k === " " || k === "Enter") { if (celebrate && celebrate.t > 1.2) finishCelebrate(); else if (summary && overT > 0.5) endShiftView(); e.preventDefault(); return; }
      return;
    }
    if (screen === "tree" && (k === " " || k === "Enter")) { startShift(); e.preventDefault(); return; }
    if ((screen === "help" || screen === "town") && (k === "Escape" || k === "Enter" || k === " ")) { screen = screen === "help" ? helpFrom : townFrom; e.preventDefault(); return; }
    if (screen === "title" && (k === " " || k === "Enter")) { startHiss(); if (hasSave) { if (game.done) { townFrom = "title"; screen = "town"; } else { rebuildImage(); screen = "tree"; } } else { rebuildImage(); startShift(); } e.preventDefault(); }
  });
  window.addEventListener("blur", function () { if (screen === "shift" && run && !run.over) paused = true; setHiss(0, 0); });

  // hooks for the screenshot tool and tests
  window.RINSE_APP = {
    edition: ED,
    game: function () { return game; },
    screen: function (s) { if (s) { if (s === "tree" || s === "shift") rebuildImage(); screen = s; } return screen; },
    load: function (str) { game = RW.load(str, ART.paint); hasSave = true; rebuildImage(); },
    start: function () { startShift(); },
    aim: function (x, y) { aimOverride = x === null ? null : { x: x, y: y }; },
    run: function () { return run; },
    fast: function (seconds, path) {
      // advance the current shift quickly, sweeping along a path function(t) -> {x, y}
      for (var t = 0; t < seconds && run && !run.over; t += STEP) { var p = path ? path(run.time) : aimOverride || aim; RW.stepRun(game, run, p, STEP); handle(run.ev); if (path) aimOverride = p; }
      if (run && run.over && !celebrate) { summary = { earned: run.earned, cleared: run.cleared, tips: run.tips, drops: run.drops, from: shiftStartPct, to: pct() }; overT = 1; }
      return run ? run.over : true;
    },
    buy: function (id) { return RW.buy(game, id); },
    hover: function (x, y) { mouse.x = x; mouse.y = y; },
    finish: function () { if (celebrate) finishCelebrate(); else endShiftView(); }
  };
  requestAnimationFrame(frame);
})();
</script>
