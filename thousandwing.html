<script>
// flock.js — THOUSANDWING: a murmuration that fights by its shape.
// Pure logic: the page, the balance runs and the tests all drive it the same way.
(function (root) {
  "use strict";
  var node = typeof module !== "undefined" && module.exports;
  var C = node ? require("./content.js") : root.CONTENT;
  var MAXB = 900, GOLD = 2.399963, CELL = 64;

  function rng(seed) {
    var a = seed >>> 0;
    return function () { a = (a + 0x6D2B79F5) >>> 0; var t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  }
  function hash(i) { var x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }

  // --- the save ---
  function newGame(opts) {
    opts = opts || {};
    return { v: 1, demo: !!opts.demo, feathers: 0, total: 0, roost: {}, open: 1, region: 0, cleared: {}, runs: 0, best: {}, endless: 0, seed: opts.seed || 1, seen: {} };
  }
  function rl(g, id) { return g.roost[id] || 0; }
  function roostCost(g, id) { var u = C.ROOSTU[id], l = rl(g, id); return l >= u.max ? Infinity : Math.round(u.base * Math.pow(u.grow, l)); }
  function canBuy(g, id) { return rl(g, id) < C.ROOSTU[id].max && g.feathers >= roostCost(g, id); }
  function buy(g, id) { if (!canBuy(g, id)) return false; g.feathers -= roostCost(g, id); g.roost[id] = rl(g, id) + 1; return true; }

  // --- stats of the flock in a run: roost x in-run upgrades ---
  function lv(run, id) { return run.ups[id] || 0; }
  function stats(run) {
    var g = run.g;
    return {
      beak: 1 * (1 + 0.25 * lv(run, "BEAKS")) * (1 + 0.1 * rl(g, "BEAK")),
      speed: 230 * (1 + 0.1 * lv(run, "WINGS")) * (1 + 0.05 * rl(g, "WING")),
      dodge: Math.min(0.75, 0.1 * lv(run, "HARDY") + 0.06 * rl(g, "TOUGH")),
      magnet: 110 * (1 + 0.3 * lv(run, "NOSE")),
      call: (1 + 0.25 * lv(run, "CALL")) * (1 + 0.2 * rl(g, "LURE")),
      forage: 1 + 0.1 * rl(g, "FORAGE"),
      ball: 1.25 * (1 + 0.2 * lv(run, "BALL")),
      ribbon: 1 * (1 + 0.15 * lv(run, "RIBBON")),
      ribbonLen: 1 + 0.2 * lv(run, "RIBBON"),
      wheel: 0.9 * (1 + 0.15 * lv(run, "WHEEL")),
      wheelR: 1 + 0.12 * lv(run, "WHEEL"),
      wheelSpin: 2.2 * (1 + 0.15 * lv(run, "WHEEL")),
      dive: 2.2 * (1 + 0.25 * lv(run, "DIVE")),
      diveCd: 7 * Math.pow(0.85, lv(run, "DIVE")) * Math.pow(0.9, rl(g, "DIVEFAST")),
      swallows: 2 * lv(run, "SWALLOWS"),
      mocker: lv(run, "MOCKER"),
      song: lv(run, "SONG"),
      peck: 0.5
    };
  }

  // --- a run ---
  function startRun(g, ri, seed) {
    var reg = ri === "endless" ? endlessRegion() : C.REGIONS[ri];
    var run = { g: g, ri: ri, reg: reg, t: 0, rng: rng((seed || (g.seed * 7919 + g.runs * 104729 + 7)) >>> 0), birds: [], lead: { x: 0, y: 0, vx: 0, vy: 0 }, target: { x: 0, y: 0 },
      form: "BALL", trail: [], dive: null, diveCd: 0, enemies: [], berries: [], strays: [], darts: [], swallowsL: [], level: 1, xp: 0, xpNext: 5, ups: {}, evos: {},
      choices: null, rerolls: rl(g, "REROLL"), kills: 0, feathers: 0, events: [], over: false, won: false, bossSpawned: false, boss: null, spawnAcc: {}, strayT: 1, mockT: 4, songT: 8, peak: 0, eid: 1, stun: 0 };
    run.s = stats(run);
    var n = 40 + 10 * rl(g, "START");
    for (var i = 0; i < n; i++) addBird(run, (run.rng() - 0.5) * 80, (run.rng() - 0.5) * 80);
    run.trail.push({ x: 0, y: 0 });
    return run;
  }
  function endlessRegion() {
    // all four regions' birds at once, getting worse for ever; a boss every 3 minutes
    return { id: "ENDLESS", name: "Black Sun", len: 1e9, endless: true, sky: ["#05040c", "#3a1030", "#ff5a2a"], ground: "marsh",
      waves: [[0, 1e9, "CROW", 1, 0], [0, 1e9, "JACKDAW", 1, 0], [30, 1e9, "PIGEON", 0.6, 0], [60, 1e9, "MAGPIE", 0.3, 0], [90, 1e9, "ROOK", 0.3, 0], [120, 1e9, "GULL", 0.3, 0],
        [150, 1e9, "SKUA", 0.2, 0], [180, 1e9, "KESTREL", 0.06, 0], [200, 1e9, "BARNOWL", 0.06, 0], [240, 1e9, "HARRIER", 0.05, 0], [260, 1e9, "CLOUD", 0.02, 0], [300, 1e9, "CORMORANT", 0.2, 0]] };
  }
  function addBird(run, x, y) {
    if (run.birds.length >= MAXB) return false;
    var i = run.birds.length;
    run.birds.push({ x: x, y: y, vx: 0, vy: 0, cd: run.rng() * 0.5, ph: hash(i + run.birds.length * 0.37) * 6.283, k: i });
    return true;
  }
  function flockRadius(run) { var n = run.birds.length; return run.form === "BALL" ? 6 * Math.sqrt(n) + 10 : run.form === "WHEEL" ? wheelR(run) + 30 : 60; }
  function wheelR(run) { return (70 + 4.5 * Math.sqrt(run.birds.length)) * run.s.wheelR; }

  // --- the player's orders ---
  function setTarget(run, x, y) { run.target.x = x; run.target.y = y; }
  function setForm(run, f) { if (f === "BALL" || f === "RIBBON" || f === "WHEEL") { if (run.form !== f) run.events.push({ e: "form", f: f }); run.form = f; } }
  function dive(run, x, y) {
    if (run.diveCd > 0 || run.dive) return false;
    var dx = x - run.lead.x, dy = y - run.lead.y, L = Math.sqrt(dx * dx + dy * dy) || 1, reach = 420;
    if (L > reach) { x = run.lead.x + dx / L * reach; y = run.lead.y + dy / L * reach; }
    run.dive = { x: x, y: y, t: 0, len: 0.8 };
    run.diveCd = run.s.diveCd;
    run.events.push({ e: "dive", x: x, y: y });
    return true;
  }

  // --- the choices at a level up ---
  function offer(run) {
    var pool = [];
    C.EVOLUTIONS.forEach(function (ev) { if (!run.evos[ev.id] && ev.needs.every(function (id) { return lv(run, id) >= C.UPGRADE[id].max; })) pool.push({ id: ev.id, evo: true, w: 100 }); });
    C.UPGRADES.forEach(function (u) { if (lv(run, u.id) < u.max) pool.push({ id: u.id, w: u.id === "FLOCK" ? 1.2 : 2 + (lv(run, u.id) > 0 ? 1 : 0) }); });
    var out = [];
    while (out.length < 3 && pool.length) {
      var tot = 0; pool.forEach(function (p) { tot += p.w; });
      var r = run.rng() * tot, k = 0;
      for (; k < pool.length - 1; k++) { r -= pool[k].w; if (r <= 0) break; }
      out.push(pool[k]); pool.splice(k, 1);
    }
    run.choices = out.map(function (p) { return p.id; });
  }
  function choose(run, id) {
    if (!run.choices || run.choices.indexOf(id) < 0) return false;
    if (C.EVOLUTION[id]) run.evos[id] = true;
    else {
      run.ups[id] = lv(run, id) + 1;
      if (id === "FLOCK") for (var i = 0; i < 12; i++) addBird(run, run.lead.x + (run.rng() - 0.5) * 60, run.lead.y + (run.rng() - 0.5) * 60);
    }
    run.choices = null;
    run.s = stats(run);
    syncSwallows(run);
    run.events.push({ e: "chose", id: id });
    if (run.xp >= run.xpNext) levelUp(run);
    return true;
  }
  function reroll(run) { if (!run.choices || run.rerolls <= 0) return false; run.rerolls--; offer(run); return true; }
  function levelUp(run) { run.xp -= run.xpNext; run.level++; run.xpNext = Math.round(5 + run.level * 3.4 + Math.pow(run.level, 1.55)); offer(run); run.events.push({ e: "level", level: run.level }); }
  function syncSwallows(run) {
    while (run.swallowsL.length < run.s.swallows) run.swallowsL.push({ x: run.lead.x, y: run.lead.y, vx: 0, vy: 0, cd: 0, tgt: null });
  }

  // --- enemies ---
  function spawnEnemy(run, id, x, y) {
    var d = C.ENEMY[id], r = run.rng;
    if (x === undefined) { var a = r() * 6.283, dist = 760 + r() * 200; x = run.lead.x + Math.cos(a) * dist; y = run.lead.y + Math.sin(a) * dist * 0.8; }
    var hpMul = run.reg.endless ? 2 + run.t / 120 : ramp(run, run.reg.hpx);
    var e = { uid: run.eid++, id: id, d: d, x: x, y: y, vx: 0, vy: 0, hp: d.hp * hpMul, max: d.hp * hpMul, biteT: d.biteCd * 0.6, flash: 0, st: "in", t: 0, ang: r() * 6.283, stun: 0, dead: false };
    if (d.act === "line") { var tx = run.lead.x + (r() - 0.5) * 200, ty = run.lead.y + (r() - 0.5) * 200, L = Math.hypot(tx - x, ty - y) || 1; e.vx = (tx - x) / L * d.speed; e.vy = (ty - y) / L * d.speed; e.life = 2400 / d.speed; }
    if (d.act === "cloud") { e.vx = (r() - 0.5) * 30; e.vy = (r() - 0.5) * 30; e.life = 50; }
    run.enemies.push(e);
    if (d.boss) { run.boss = e; run.events.push({ e: "boss", id: id }); }
    return e;
  }
  function moveEnemy(run, e, dt, cx, cy) {
    var d = e.d, sp = d.speed * (run.stun > 0 || e.stun > 0 ? 0.15 : 1), dx, dy, L;
    e.t += dt; if (e.stun > 0) e.stun -= dt;
    if (d.act === "chase" || d.act === "swarm") {
      dx = cx - e.x; dy = cy - e.y; L = Math.sqrt(dx * dx + dy * dy) || 1;
      var j = d.act === "swarm" ? 0.9 : 0.2;
      var wob = Math.sin(e.t * 3 + e.ang) * j;
      var ax = dx / L * Math.cos(wob) - dy / L * Math.sin(wob), ay = dx / L * Math.sin(wob) + dy / L * Math.cos(wob);
      e.vx += (ax * sp - e.vx) * Math.min(1, dt * 2.5); e.vy += (ay * sp - e.vy) * Math.min(1, dt * 2.5);
    } else if (d.act === "thief") {
      var b = null, bd = 380;
      for (var i = 0; i < run.berries.length; i++) { var q = run.berries[i], dd = Math.abs(q.x - e.x) + Math.abs(q.y - e.y); if (dd < bd) { bd = dd; b = q; } }
      var tx = b ? b.x : cx, ty = b ? b.y : cy;
      dx = tx - e.x; dy = ty - e.y; L = Math.sqrt(dx * dx + dy * dy) || 1;
      e.vx += (dx / L * sp - e.vx) * Math.min(1, dt * 3); e.vy += (dy / L * sp - e.vy) * Math.min(1, dt * 3);
      if (b && L < 14) { b.taken = true; e.loot = (e.loot || 0) + b.v; }
    } else if (d.act === "line" || d.act === "cloud") {
      e.life -= dt; if (e.life <= 0) e.gone = true;
      if (d.act === "cloud") { dx = cx - e.x; dy = cy - e.y; L = Math.sqrt(dx * dx + dy * dy) || 1; e.vx += dx / L * 6 * dt; e.vy += dy / L * 6 * dt; }
    } else if (d.act === "hawk") {
      // circle at a distance, then stoop at the flock's edge
      dx = cx - e.x; dy = cy - e.y; L = Math.sqrt(dx * dx + dy * dy) || 1;
      if (e.st === "in" || e.st === "circle") {
        var want = 300 + (d.boss ? 60 : 0);
        e.ang += dt * 0.9;
        var ox = cx + Math.cos(e.ang) * want, oy = cy + Math.sin(e.ang) * want * 0.75;
        var ex = ox - e.x, ey = oy - e.y, EL = Math.sqrt(ex * ex + ey * ey) || 1;
        e.vx += (ex / EL * sp - e.vx) * Math.min(1, dt * 2); e.vy += (ey / EL * sp - e.vy) * Math.min(1, dt * 2);
        if (EL < 120) e.st = "circle";
        if (e.st === "circle" && e.t > (d.boss ? 2.5 : 4) && run.rng() < dt * (d.boss ? 0.8 : 0.35)) { e.st = "stoop"; e.t = 0; e.sx = dx / L; e.sy = dy / L; }

    text(s.endless ? "You flew " + fmtT(s.time) : s.won ? run.reg.name + " is safe for the night" : "Only " + fmtT(s.time) + " - the roost will be ready again", W / 2, 224, 30, COL.text, "center", 700, SERIF);
    var stat = [["Biggest flock", s.peak], ["Driven off", s.kills], ["Level", s.level], ["Feathers", "+" + s.feathers]];
    stat.forEach(function (p, i) { var x = W / 2 - 330 + i * 220; text(String(p[1]), x + 110, 300, 34, i === 3 ? COL.gold : COL.text, "center", 700, SERIF); text(p[0], x + 110, 334, 13, COL.dim, "center", 700); });
    var y = 384;
    if (s.opened) { text("A new place opens: " + C.REGIONS[g.open - 1].name + "!", W / 2, y, 18, COL.good, "center", 800); y += 32; }
    if (s.finished) { text("All four places are safe. The Black Sun night is open: fly as long as you can.", W / 2, y, 16, COL.good, "center", 700); y += 30; }
    wrap("Field note: " + C.NOTES[(g.runs * 7) % C.NOTES.length], W / 2, y + 10, 760, 14, COL.dim, 20, 600, "center");
    cx.globalAlpha = 1;
    if (endT > 0.6) {
      button(W / 2 - 220, 520, 200, 50, "TO THE ROOST", function () { goRoost(); }, { primary: true, size: 16 });
      button(W / 2 + 20, 520, 200, 50, "FLY AGAIN", function () { startRun(run.ri); endT = 0; }, { size: 15 });
      if (s.won) button(W / 2 - 160, 586, 320, 44, "GET THE FULL GAME", openStore, { size: 14 });
      followLine(664);
    }
  }
  function fmtT(t) { var m = Math.floor(t / 60), s = Math.floor(t % 60); return m + ":" + (s < 10 ? "0" : "") + s; }
  // follow the maker on itch.io: shown on the end screens
  function followLine(y) {
    var label = "Enjoying it? Follow Proven Little Games on itch.io for new games", w = tw(label, 13, 700) + 30;
    var x = W / 2 - w / 2, on = hot(x, y - 15, w, 30);
    rr(x, y - 15, w, 30, 15); cx.fillStyle = on ? "rgba(90,60,110,0.95)" : "rgba(40,24,52,0.85)"; cx.fill();
    text(label, W / 2, y, 13, on ? COL.gold : COL.dim, "center", 700);
    buttons.push({ x: x, y: y - 15, w: w, h: 30, fn: openProfile });
  }
  function openProfile() { try { window.open(PROFILE_URL, "_blank", "noopener"); } catch (e) {} }

  // ---------------- the roost: places and lasting upgrades ----------------
  function goRoost() { screen = "roost"; run = null; endT = 0; persist(); }
  var note = 0;
  function drawRoost() {
    drawSky(C.REGIONS[0], 0.55, now() * 20); drawLand(C.REGIONS[0], now() * 20, 0.55);
    if (demoRun) { stepDemo(1 / 60); drawBirds(demoRun.birds.map(function (b) { return { x: b.x + 300, y: b.y - 120, vx: b.vx, vy: b.vy, ph: b.ph }; }), now(), "#120a12"); }
    cx.fillStyle = "rgba(10,4,14,0.55)"; cx.fillRect(0, 0, W, H);
    text("THE ROOST", 60, 56, 30, COL.text, "left", 700, SERIF);
    text(g.feathers + " feathers", W - 60, 56, 22, COL.gold, "right", 800, SERIF);
    // places
    text("WHERE TO FLY TONIGHT", 60, 108, 12, COL.dim, "left", 800);
    var regs = C.REGIONS.length;
    for (var i = 0; i < 4; i++) (function (i) {
      var x = 60 + i * 292, y = 124, w = 276, h = 150, open = i < regs && i < g.open, reg = C.REGIONS[i];
      rr(x, y, w, h, 14); cx.fillStyle = open ? "rgba(46,28,58,0.94)" : "rgba(26,16,32,0.9)"; cx.fill();
      cx.strokeStyle = open && hot(x, y, w, h) ? COL.gold : "rgba(200,170,220,0.35)"; cx.lineWidth = 1.4; cx.stroke();
      if (reg && open) {
        var gr = cx.createLinearGradient(x, y, x, y + 60); gr.addColorStop(0, reg.sky[1]); gr.addColorStop(1, reg.sky[2]); rr(x + 10, y + 10, w - 20, 54, 10); cx.fillStyle = gr; cx.fill();
        text(reg.name, x + 16, y + 86, 18, COL.text, "left", 700, SERIF);
        text(g.cleared[reg.id] ? "Cleared x" + g.cleared[reg.id] : g.best[reg.id] ? "Best " + fmtT(g.best[reg.id]) : "Not yet flown", x + 16, y + 110, 12, g.cleared[reg.id] ? COL.good : COL.dim, "left", 700);
        text("Boss: " + C.ENEMY[reg.boss].name, x + 16, y + 130, 12, COL.dim, "left", 600);
        buttons.push({ x: x, y: y, w: w, h: h, fn: function () { sfx("ui"); startRun(i); } });
      } else {
        text(i < regs ? "Clear the place before" : "FULL GAME", x + w / 2, y + 66, 14, "#8a7a98", "center", 700);
        if (i >= regs) text(["", "The Old Pier", "City Rooftops", "Night Marsh"][i], x + w / 2, y + 92, 18, "#b9a8c8", "center", 700, SERIF);
      }
    })(i);
    
    // lasting upgrades
    text("LASTING UPGRADES", 60, 312, 12, COL.dim, "left", 800);
    C.ROOST.forEach(function (u, i) {
      var col = i % 2, row = Math.floor(i / 2), x = 60 + col * 590, y = 330 + row * 76, l = F.rl(g, u.id), cost = F.roostCost(g, u.id), can = F.canBuy(g, u.id);
      rr(x, y, 570, 66, 12); cx.fillStyle = "rgba(40,24,52,0.92)"; cx.fill();
      text(u.name, x + 16, y + 22, 16, COL.text, "left", 700);
      text(u.desc, x + 16, y + 46, 12, COL.dim, "left", 600);
      for (var q = 0; q < u.max; q++) { cx.beginPath(); cx.arc(x + 420 - (u.max - q) * 11, y + 22, 3.6, 0, 7); cx.fillStyle = q < l ? COL.gold : "rgba(160,130,180,0.4)"; cx.fill(); }
      button(x + 440, y + 14, 116, 38, l >= u.max ? "MAX" : cost + " ✦", function () { if (F.buy(g, u.id)) { sfx("buy"); persist(); } else sfx("bad"); }, { primary: can, disabled: !can, size: 14 });
    });
    button(60, H - 66, 150, 44, "TITLE", function () { screen = "title"; }, { size: 13 });
    button(222, H - 66, 170, 44, "HOW TO PLAY", function () { helpOpen = true; helpPage = 0; }, { size: 13 });
    wrap("Field note: " + C.NOTES[note % C.NOTES.length], W - 60, H - 44, 640, 13, COL.dim, 18, 600, "right");
    if (helpOpen) drawHelp();
  }

  // ---------------- help ----------------
  var HELP = [
    ["Lead the flock", "Your flock follows the mouse (or WASD / arrow keys). It fights by flying into things: every starling that touches an enemy pecks it, and a pecked bird flinches back. Bites and snatches cost you starlings - the flock is your health. Fly over lone starlings on the wires to bring them in."],
    ["Change its shape", "1  BALL: a tight ball. Many beaks on one target, and hawks can barely snatch from it.\n2  RIBBON: a long stream along your path. Sweep it through crowds.\n3  WHEEL: a ring around you. It guards you while you hold still or circle.\nSPACE or right-click: DIVE - the whole flock stoops at the cursor and hits much harder."],
    ["Grow", "Enemies drop berries. Gather them to level up and pick one of three upgrades. Max two upgrades that belong together and an evolution may appear. Survive until nightfall and drive off the boss to make the place safe."],
    ["The roost", "Win or lose, you keep feathers. Spend them in the roost on lasting upgrades, then fly again. Watch for: magpies and skuas stealing berries, hawks that circle and then stoop (ball up!), owls that hoot and scatter the flock, and storm clouds."]
  ];
  function drawHelp() {
    cx.fillStyle = "rgba(10,4,14,0.75)"; cx.fillRect(0, 0, W, H);
    var x = 260, y = 140, ww = 760, hh = 500, p = HELP[helpPage];
    rr(x, y, ww, hh, 18); cx.fillStyle = COL.panel; cx.fill(); cx.strokeStyle = COL.line; cx.lineWidth = 1.5; cx.stroke();
    text("HOW TO PLAY " + (helpPage + 1) + "/" + HELP.length, x + 30, y + 34, 12, COL.dim, "left", 800);
    text(p[0], x + 30, y + 78, 32, COL.gold, "left", 700, SERIF);
    wrap(p[1], x + 30, y + 132, ww - 60, 18, COL.text, 28, 600);
    var close = function () { helpOpen = false; settings.seenHelp = true; saveSettings(); };
    if (helpPage > 0) button(x + 30, y + hh - 66, 120, 42, "BACK", function () { helpPage--; }, {});
    if (helpPage < HELP.length - 1) button(x + ww - 150, y + hh - 66, 120, 42, "NEXT", function () { helpPage++; }, { primary: true });
    else button(x + ww - 150, y + hh - 66, 120, 42, "FLY!", close, { primary: true });
    button(x + ww / 2 - 60, y + hh - 66, 120, 42, "CLOSE", close, {});
  }

  // ---------------- title: a murmuration plays across the dusk ----------------
  var demoRun = null;
  function makeDemo() {
    var dg = F.newGame({ seed: 9 }); dg.roost.START = 10;
    demoRun = F.startRun(dg, 0, 99);
    for (var i = 0; i < 420; i++) F.addBird(demoRun, (Math.random() - 0.5) * 200, (Math.random() - 0.5) * 200);
    demoRun.form = "RIBBON"; demoRun.reg = { id: "TITLE", len: 1e9, waves: [], sky: C.REGIONS[0].sky, ground: "farm", bossAt: 1e9 };
  }
  var demoForm = 0;
  function stepDemo(dt) {
    if (!demoRun) makeDemo();
    var t = demoRun.t;
    // a lazy figure-of-eight across the sky, changing shape now and then
    F.setTarget(demoRun, Math.sin(t * 0.45) * 420, Math.sin(t * 0.9) * 150);
    var f = Math.floor(t / 7) % 3; if (f !== demoForm) { demoForm = f; F.setForm(demoRun, ["RIBBON", "BALL", "WHEEL"][f]); }
    demoRun.strays.length = 0;
    F.step(demoRun, dt); demoRun.events.length = 0;
  }
  function drawTitle(dt) {
    stepDemo(dt);
    drawSky(C.REGIONS[0], 0.1, now() * 30); drawLand(C.REGIONS[0], now() * 30, 0.1);
    var save = { x: cam.x, y: cam.y }; cam.x = -100; cam.y = 60;
    drawBirds(demoRun.birds, now(), "#140a12");
    cam.x = save.x; cam.y = save.y;
    var gr = cx.createLinearGradient(0, 0, 0, H); gr.addColorStop(0, "rgba(10,4,14,0.45)"); gr.addColorStop(0.4, "rgba(10,4,14,0)"); gr.addColorStop(1, "rgba(10,4,14,0.6)"); cx.fillStyle = gr; cx.fillRect(0, 0, W, H);
    cx.font = "700 92px " + SERIF; cx.textAlign = "center"; cx.textBaseline = "middle";
    cx.shadowColor = "rgba(255,170,90,0.8)"; cx.shadowBlur = 26; cx.fillStyle = "#fff4e6"; cx.fillText("THOUSANDWING", W / 2, 120); cx.shadowBlur = 0;
    text("Lead a murmuration. Change its shape. Drive off the night.", W / 2, 184, 22, "#ffe8d4", "center", 600, SERIF);
    text("FREE DEMO · Harvest Fields", W / 2, 218, 14, COL.gold, "center", 800);
    button(W / 2 - 160, 560, 320, 58, "FLY", function () { audio(); if (g.runs === 0) { startRun(0); } else goRoost(); }, { primary: true, size: 20 });
    button(W / 2 - 160, 630, 155, 42, "THE ROOST", function () { audio(); goRoost(); }, { size: 13 });
    button(W / 2 + 5, 630, 155, 42, settings.music ? "MUSIC ON" : "MUSIC OFF", function () { settings.music = !settings.music; saveSettings(); audio(); }, { size: 13 });
    button(W / 2 - 160, 682, 155, 36, "HOW TO PLAY", function () { helpOpen = true; helpPage = 0; }, { size: 12 });
    button(W / 2 + 5, 682, 155, 36, settings.sound ? "SOUND ON" : "SOUND OFF", function () { settings.sound = !settings.sound; saveSettings(); }, { size: 12 });
    button(W - 300, H - 66, 270, 40, "GET THE FULL GAME", openStore, { size: 13 });
    if (helpOpen) drawHelp();
  }
  
  function openStore() { try { window.open(STORE_URL, "_blank", "noopener"); } catch (e) {} }
  function drawDemoEnd() {
    drawSky(C.REGIONS[0], 0.8, 0); drawLand(C.REGIONS[0], 0, 0.8);
    cx.fillStyle = "rgba(10,4,14,0.7)"; cx.fillRect(0, 0, W, H);
    text("THE DEMO ENDS HERE", W / 2, 190, 38, COL.gold, "center", 700, SERIF);
    var y = wrap("Harvest Fields is safe. The full game flies on: the Old Pier with its gulls and skuas, City Rooftops where the peregrine hunts, and the Night Marsh under the eagle-owl - then the endless Black Sun night, with every lasting upgrade.", W / 2, 260, 760, 18, COL.text, 28, 600, "center");
    button(W / 2 - 170, y + 36, 340, 56, "GET THE FULL GAME", openStore, { primary: true, size: 18 });
    button(W / 2 - 100, y + 104, 200, 42, "KEEP FLYING", function () { goRoost(); }, { size: 13 });
    followLine(H - 60);
  }
  
  function drawWon() {
    drawSky(C.REGIONS[C.REGIONS.length - 1], 0.4, 0); drawLand(C.REGIONS[C.REGIONS.length - 1], 0, 0.4);
    cx.fillStyle = "rgba(10,4,14,0.62)"; cx.fillRect(0, 0, W, H);
    text("A THOUSAND WINGS", W / 2, 210, 44, COL.gold, "center", 700, SERIF);
    wrap("All four places are safe for the night. " + g.runs + " flights, and the roost has never been fuller. The Black Sun night is open in the roost: fly as long as you can.", W / 2, 290, 720, 18, COL.text, 28, 600, "center");
    button(W / 2 - 110, 420, 220, 50, "TO THE ROOST", function () { goRoost(); }, { primary: true });
    followLine(H - 60);
  }

  // ---------------- main loop and input ----------------
  var lastT = performance.now();
  function frame(nowT) {
    var dt = Math.min(0.05, (nowT - lastT) / 1000); lastT = nowT;
    buttons = []; popT -= dt; lostT -= dt;
    cx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
    ambient();
    if (screen === "title") drawTitle(dt);
    else if (screen === "run") drawRun(dt);
    else if (screen === "roost") drawRoost();
    else if (screen === "won") drawWon();
    else if (screen === "demoend") drawDemoEnd();
    requestAnimationFrame(frame);
  }
  function resize() {
    var vw = window.innerWidth, vh = window.innerHeight;
    scale = Math.min(vw / W, vh / H); dpr = window.devicePixelRatio || 1;
    cv.style.width = Math.floor(W * scale) + "px"; cv.style.height = Math.floor(H * scale) + "px";
    cv.width = Math.floor(W * scale * dpr); cv.height = Math.floor(H * scale * dpr);
  }
  window.addEventListener("resize", resize); resize();
  function local(e) { var r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H }; }
  cv.addEventListener("contextmenu", function (e) { e.preventDefault(); });
  cv.addEventListener("pointermove", function (e) { var m = local(e); mouse.x = m.x; mouse.y = m.y; });
  cv.addEventListener("pointerdown", function (e) {
    var m = local(e); mouse.x = m.x; mouse.y = m.y; cv.focus(); audio();
    for (var i = buttons.length - 1; i >= 0; i--) { var b = buttons[i]; if (m.x >= b.x && m.x <= b.x + b.w && m.y >= b.y && m.y <= b.y + b.h) { sfx("ui"); b.fn(); afterClick(); return; } }
    if (screen === "run" && run && !run.over && !paused && !helpOpen && !run.choices && e.button === 2) { var p = toWorld(m.x, m.y); F.dive(run, p.x, p.y); }
  });
  // leaving a run's end screen after a first clear: the demo ends, or the whole game is won
  function afterClick() {
    if (screen === "roost" && lastSummary) {
      var s = lastSummary; lastSummary = null;
      if (DEMO && s.won && !g.sawDemoEnd) { g.sawDemoEnd = true; persist(); screen = "demoend"; return; }
      if (!DEMO && s.finished) { screen = "won"; return; }
    }
  }
  cv.addEventListener("wheel", function (e) { if (screen === "run" && run && !run.choices) { var order = ["BALL", "RIBBON", "WHEEL"], i = order.indexOf(run.form); F.setForm(run, order[(i + (e.deltaY > 0 ? 1 : 2)) % 3]); e.preventDefault(); } }, { passive: false });
  window.addEventListener("keydown", function (e) {
    var k = e.key.toLowerCase(); keys[k] = true;
    if (screen === "run" && run) {
      if (run.choices && (k === "1" || k === "2" || k === "3")) { var id = run.choices[+k - 1]; if (id) { F.choose(run, id); sfx("buy"); } return; }
      if (k === "escape" || k === "p") { if (helpOpen) helpOpen = false; else if (!run.over) paused = !paused; }
      else if (k === "1") F.setForm(run, "BALL"); else if (k === "2") F.setForm(run, "RIBBON"); else if (k === "3") F.setForm(run, "WHEEL");
      else if (k === " ") { var p = toWorld(mouse.x, mouse.y); F.dive(run, p.x, p.y); e.preventDefault(); }
      else if (k === "r" && run.choices) F.reroll(run);
    } else if (k === "escape") helpOpen = false;
  });
  window.addEventListener("keyup", function (e) { keys[e.key.toLowerCase()] = false; });
  window.addEventListener("blur", function () { keys = {}; if (screen === "run" && run && !run.over) paused = true; });

  // hooks for the screenshot tool and tests
  window.THOUSANDWING_APP = {
    edition: ED, game: function () { return g; }, run: function () { return run; }, setGame: function (str) { g = F.load(str); },
    start: function (ri) { startRun(ri); msg = null; }, screen: function (s) { if (s) screen = s; return screen; }, help: function (v) { helpOpen = v; }, settings: settings,
    hover: function (x, y) { mouse.x = x; mouse.y = y; }, pause: function (v) { paused = v; }, sim: function (sec, botPlay) { for (var t = 0; t < sec && !run.over; t += 1 / 60) { if (run.choices) { if (botPlay) F.choose(run, BOT.pick(run)); else break; } if (botPlay && Math.round(t * 60) % 12 === 0) BOT.think(run); F.step(run, 1 / 60); run.events.forEach(handle); run.events.length = 0; } cam.x = run.lead.x; cam.y = run.lead.y; },
    cam: cam, fx: function () { return fx; }, note: function (n) { note = n; }, puff: puff, ring: ring
  };
  requestAnimationFrame(frame);
})();
</script>
</body>
