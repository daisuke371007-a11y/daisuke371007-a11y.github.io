<script>window.STILL_EDITION = "demo";</script>
<script>
// STILLHAND rules. Pure functions over plain objects so the solver, the tests and the game share one truth.
// The board is W x H. Tiles: "." floor, "#" pillar (blocks walking and arrows), "o" pit (falls; arrows fly over).
// You never strike. You step, and stepping into an enemy shoves it one tile.
// Every enemy telegraphs a strike that is fixed to its own body: shove it and the strike moves with it.
(function (root) {
  "use strict";
  var DX = [0, 1, 0, -1], DY = [-1, 0, 1, 0];           // 0 up, 1 right, 2 down, 3 left
  var KINDS = {
    B: { name: "Brute",  hp: 2, speed: 2, dmg: 2, shove: true,  blurb: "Punches the tile in front for 2." },
    A: { name: "Archer", hp: 1, speed: 2, dmg: 1, shove: true,  blurb: "Shoots straight ahead. The first thing in the way takes 1." },
    R: { name: "Ram",    hp: 2, speed: 1, dmg: 2, shove: true,  blurb: "Charges ahead until it hits something: 2. A pit on the way takes the Ram." },
    M: { name: "Mortar", hp: 1, speed: 1, dmg: 1, shove: true,  blurb: "Lobs over everything: a cross of five tiles 2 or 3 ahead, 1 each." },
    W: { name: "Warden", hp: 2, speed: 0, dmg: 1, shove: true,  blurb: "Never moves. Strikes all four tiles around it for 1." },
    K: { name: "Anchor", hp: 2, speed: 1, dmg: 2, shove: false, blurb: "Cannot be shoved. Punches the tile in front for 2." }
  };

  // ---------- floors ----------
  // rows: array of strings; letters B A R M W K are enemies (in reading order = strike order), "@" is you.
  function parse(rows, extra) {
    var h = rows.length, w = rows[0].length, tiles = [], hero = null, en = [];
    for (var y = 0; y < h; y++) for (var x = 0; x < w; x++) {
      var c = rows[y].charAt(x);
      if (c === "@") { hero = { x: x, y: y }; c = "."; }
      else if (KINDS[c]) { en.push({ t: c, x: x, y: y }); c = "."; }
      if (c !== "." && c !== "#" && c !== "o") throw new Error("bad tile " + c);
      tiles.push(c);
    }
    if (!hero) throw new Error("no hero");
    var L = { w: w, h: h, tiles: tiles, hero: hero, en: en };
    if (extra) for (var k in extra) L[k] = extra[k];
    return L;
  }
  function tile(L, x, y) { return (x < 0 || y < 0 || x >= L.w || y >= L.h) ? "#" : L.tiles[y * L.w + x]; }

  // ---------- state ----------
  // S = { hx, hy, hp, maxhp, ap, round, en:[{id,t,x,y,hp,d,r}], cd:{trick:rounds}, bump, ward, ... }
  function start(L, opts) {
    opts = opts || {};
    var S = { hx: L.hero.x, hy: L.hero.y, hp: opts.hp || 3, maxhp: opts.maxhp || 3, apMax: opts.ap || 2, ap: opts.ap || 2,
      round: 1, bump: opts.bump || 1, ward: opts.ward || 0, en: [], nextId: 0 };
    for (var i = 0; i < L.en.length; i++) {
      var e = L.en[i];
      S.en.push({ id: S.nextId++, t: e.t, x: e.x, y: e.y, hp: KINDS[e.t].hp, d: 0, r: 2 });
    }
    for (var j = 0; j < S.en.length; j++) aim(L, S, S.en[j]);
    return S;
  }
  function clone(S) {
    var C = {}, k;
    for (k in S) C[k] = S[k];
    C.en = S.en.map(function (e) { return { id: e.id, t: e.t, x: e.x, y: e.y, hp: e.hp, d: e.d, r: e.r }; });
    if (S.cd) { C.cd = {}; for (k in S.cd) C.cd[k] = S.cd[k]; }
    return C;
  }
  function unitAt(S, x, y) {
    if (S.hx === x && S.hy === y) return "hero";
    for (var i = 0; i < S.en.length; i++) if (S.en[i].x === x && S.en[i].y === y && S.en[i].hp > 0) return S.en[i];
    return null;
  }
  function won(S) { for (var i = 0; i < S.en.length; i++) if (S.en[i].hp > 0) return false; return true; }
  function key(S) {
    var s = S.hx + "," + S.hy;
    for (var i = 0; i < S.en.length; i++) { var e = S.en[i]; s += "|" + e.t + e.x + "," + e.y + "," + e.hp + "," + e.d + "," + e.r; }
    return s;
  }

  // ---------- damage ----------
  // hero always loses exactly 1 heart per strike; a ward (one-per-floor shield) eats the first one
  function hurt(S, u, dmg, ev, cause) {
    if (u === "hero") {
      if (S.ward > 0) { S.ward--; ev.push({ k: "ward", x: S.hx, y: S.hy }); return; }
      S.hp -= 1; ev.push({ k: "hurt", x: S.hx, y: S.hy, cause: cause });
      return;
    }
    u.hp -= dmg; ev.push({ k: "dmg", id: u.id, x: u.x, y: u.y, n: dmg, cause: cause });
    if (u.hp <= 0) ev.push({ k: "die", id: u.id, x: u.x, y: u.y, cause: cause });
  }
  function sweepDead(S) { S.en = S.en.filter(function (e) { return e.hp > 0; }); }

  // ---------- your actions ----------
  // step in direction d: walk, or shove the enemy standing there. Returns events, or null if not allowed.
  function step(L, S, d) {
    if (S.ap <= 0) return null;
    var x = S.hx + DX[d], y = S.hy + DY[d], u = unitAt(S, x, y), ev = [];
    if (u && u !== "hero") {
      if (!KINDS[u.t].shove) return null;
      push(L, S, u, d, 1, ev, "shove");
    } else {
      if (tile(L, x, y) !== ".") return null;
      ev.push({ k: "walk", from: [S.hx, S.hy], to: [x, y] });
      S.hx = x; S.hy = y;
    }
    S.ap--;
    sweepDead(S);
    return ev;
  }
  // move enemy u up to n tiles in direction d; a blocked shove bumps (S.bump damage), another enemy bumps both, a pit swallows
  function push(L, S, u, d, n, ev, cause) {
    for (var i = 0; i < n; i++) {
      var x = u.x + DX[d], y = u.y + DY[d], t = tile(L, x, y), v = unitAt(S, x, y);
      if (v) {
        ev.push({ k: "bump", id: u.id, at: [x, y] });
        hurt(S, u, S.bump, ev, "bump");
        if (v !== "hero") hurt(S, v, S.bump, ev, "bump");
        else hurt(S, v, 1, ev, "bump");
        return;
      }
      if (t === "#") { ev.push({ k: "bump", id: u.id, at: [x, y] }); hurt(S, u, S.bump, ev, "bump"); return; }
      ev.push({ k: "slide", id: u.id, from: [u.x, u.y], to: [x, y] });
      u.x = x; u.y = y;
      if (t === "o") { u.hp = 0; ev.push({ k: "fall", id: u.id, x: x, y: y }); ev.push({ k: "die", id: u.id, x: x, y: y, cause: "fall" }); return; }
    }
  }

  // ---------- tricks (run upgrades; the solver never uses them) ----------
  var TRICKS = {
    hook:  { name: "Hook",  cd: 2, blurb: "Pull the first enemy in a line (up to 4) to your side. Pits on the way take it." },
    swap:  { name: "Swap",  cd: 3, blurb: "Trade places with the first enemy in a line (up to 3)." },
    turn:  { name: "Turn",  cd: 2, blurb: "Spin an adjacent enemy a quarter turn clockwise. Its strike turns with it." },
    dash:  { name: "Dash",  cd: 2, blurb: "Run up to 3 tiles in a line." },
    palm:  { name: "Palm",  cd: 3, blurb: "Shove an adjacent enemy 3 tiles." },
    sweep: { name: "Sweep", cd: 4, blurb: "Shove every adjacent enemy away from you." }
  };
  function firstInLine(L, S, d, max) {
    var x = S.hx, y = S.hy;
    for (var i = 1; i <= max; i++) {
      x += DX[d]; y += DY[d];
      if (tile(L, x, y) === "#") return null;
      var u = unitAt(S, x, y);
      if (u) return { u: u, dist: i };
    }
    return null;
  }
  function trick(L, S, name, d) {
    if (S.ap <= 0 || (S.cd && S.cd[name] > 0)) return null;
    var ev = [], f, u;
    if (name === "hook") {
      f = firstInLine(L, S, d, 4); if (!f || f.dist < 2) return null;
      u = f.u; var back = (d + 2) % 4;
      push(L, S, u, back, f.dist - 1, ev, "hook");
    } else if (name === "swap") {
      f = firstInLine(L, S, d, 3); if (!f) return null;
      u = f.u; var ox = S.hx, oy = S.hy;
      ev.push({ k: "swap", id: u.id, a: [ox, oy], b: [u.x, u.y] });
      S.hx = u.x; S.hy = u.y; u.x = ox; u.y = oy;
    } else if (name === "turn") {
      u = unitAt(S, S.hx + DX[d], S.hy + DY[d]); if (!u || u === "hero" || u.t === "W") return null;
      u.d = (u.d + 1) % 4; ev.push({ k: "turn", id: u.id, d: u.d });
    } else if (name === "dash") {
      var n = 0;
      while (n < 3 && tile(L, S.hx + DX[d], S.hy + DY[d]) === "." && !unitAt(S, S.hx + DX[d], S.hy + DY[d])) {
        ev.push({ k: "walk", from: [S.hx, S.hy], to: [S.hx + DX[d], S.hy + DY[d]] });
        S.hx += DX[d]; S.hy += DY[d]; n++;
      }
      if (!n) return null;
    } else if (name === "palm") {
      u = unitAt(S, S.hx + DX[d], S.hy + DY[d]); if (!u || u === "hero" || !KINDS[u.t].shove) return null;
      push(L, S, u, d, 3, ev, "palm");
    } else if (name === "sweep") {
      var any = false;
      for (var k = 0; k < 4; k++) {
        u = unitAt(S, S.hx + DX[k], S.hy + DY[k]);
        if (u && u !== "hero" && u.hp > 0 && KINDS[u.t].shove) { push(L, S, u, k, 1, ev, "sweep"); any = true; }
      }
      if (!any) return null;
    } else return null;
    S.ap--;
    S.cd = S.cd || {};
    S.cd[name] = TRICKS[name].cd;
    sweepDead(S);
    return ev;
  }

  // ---------- enemy strikes ----------
  // the tiles a strike will touch, as things stand (used for the red warning tiles)
  function strikeTiles(L, S, e) {
    var out = [], x, y, i;
    if (e.t === "B" || e.t === "K") out.push([e.x + DX[e.d], e.y + DY[e.d]]);
    else if (e.t === "W") for (i = 0; i < 4; i++) out.push([e.x + DX[i], e.y + DY[i]]);
    else if (e.t === "M") {
      var cx = e.x + DX[e.d] * e.r, cy = e.y + DY[e.d] * e.r;
      out.push([cx, cy]); for (i = 0; i < 4; i++) out.push([cx + DX[i], cy + DY[i]]);
    } else if (e.t === "A" || e.t === "R") {
      x = e.x; y = e.y;
      for (;;) {
        x += DX[e.d]; y += DY[e.d];
        var t = tile(L, x, y);
        if (t === "#") break;
        out.push([x, y]);
        if (unitAt(S, x, y)) break;
        if (e.t === "R" && t === "o") break;
      }
    }
    // nothing can stand on a pillar or in a pit, so a punch, blast or shell landing there is shown as harmless
    var area = e.t === "B" || e.t === "K" || e.t === "W" || e.t === "M";
    return out.filter(function (p) { return p[0] >= 0 && p[1] >= 0 && p[0] < L.w && p[1] < L.h && (!area || tile(L, p[0], p[1]) === "."); });
  }
  function strike(L, S, e, ev) {
    var K = KINDS[e.t], tiles = strikeTiles(L, S, e);
    ev.push({ k: "strike", id: e.id, t: e.t, tiles: tiles });
    if (e.t === "R") {
      for (;;) {
        var x = e.x + DX[e.d], y = e.y + DY[e.d], t = tile(L, x, y), u = unitAt(S, x, y);
        if (t === "#") break;
        if (u) { hurt(S, u, K.dmg, ev, "ram"); break; }
        ev.push({ k: "slide", id: e.id, from: [e.x, e.y], to: [x, y] });
        e.x = x; e.y = y;
        if (t === "o") { e.hp = 0; ev.push({ k: "fall", id: e.id, x: x, y: y }); ev.push({ k: "die", id: e.id, x: x, y: y, cause: "fall" }); break; }
      }
      return;
    }
    if (e.t === "A") {
      var last = tiles[tiles.length - 1], v = last && unitAt(S, last[0], last[1]);
      if (v) hurt(S, v, K.dmg, ev, "arrow");
      return;
    }
    var hitHero = false;
    for (var i = 0; i < tiles.length; i++) {
      var w = unitAt(S, tiles[i][0], tiles[i][1]);
      if (!w) continue;
      if (w === "hero") { if (hitHero) continue; hitHero = true; }
      hurt(S, w, K.dmg, ev, e.t === "M" ? "shell" : "blow");
    }
  }

  // ---------- enemy movement and aiming ----------
  function free(L, S, x, y, self) {
    if (tile(L, x, y) !== ".") return false;
    var u = unitAt(S, x, y);
    return !u || u === self;
  }
  // every (x, y, d, r) from which enemy e's strike would reach you where you stand now
  function spots(L, S, e) {
    var out = [], d, k, x, y;
    for (d = 0; d < 4; d++) {
      var back = (d + 2) % 4;                       // the enemy would face back toward you
      if (e.t === "B" || e.t === "K") {
        x = S.hx + DX[d]; y = S.hy + DY[d];
        if (free(L, S, x, y, e)) out.push([x, y, back, 2]);
      } else if (e.t === "A" || e.t === "R") {
        for (k = 1; ; k++) {
          x = S.hx + DX[d] * k; y = S.hy + DY[d] * k;
          var t = tile(L, x, y);
          if (t === "#") break;
          var u = unitAt(S, x, y);
          if (u && u !== e) break;
          if (t === "o") { if (e.t === "R") break; continue; }
          if (k >= 2) out.push([x, y, back, 2]);
        }
      } else if (e.t === "M") {
        for (k = 2; k <= 3; k++) {
          x = S.hx + DX[d] * k; y = S.hy + DY[d] * k;
          if (free(L, S, x, y, e)) out.push([x, y, back, k]);
        }
      }
    }
    return out;
  }
  function aim(L, S, e) {
    if (e.t === "W") return;
    var sp = spots(L, S, e);
    for (var i = 0; i < sp.length; i++) if (sp[i][0] === e.x && sp[i][1] === e.y) { e.d = sp[i][2]; e.r = sp[i][3]; return; }
    var dx = S.hx - e.x, dy = S.hy - e.y;
    if (Math.abs(dy) >= Math.abs(dx)) e.d = dy < 0 ? 0 : 2; else e.d = dx > 0 ? 1 : 3;
    e.r = Math.max(2, Math.min(3, Math.abs(dx) + Math.abs(dy)));
  }
  // breadth-first walk over free floor; returns {dist, prev} arrays
  function flood(L, S, e) {
    var n = L.w * L.h, dist = new Int16Array(n).fill(-1), prev = new Int16Array(n).fill(-1), q = [e.y * L.w + e.x];
    dist[q[0]] = 0;
    for (var qi = 0; qi < q.length; qi++) {
      var c = q[qi], cx = c % L.w, cy = (c - cx) / L.w;
      for (var d = 0; d < 4; d++) {
        var x = cx + DX[d], y = cy + DY[d];
        if (!free(L, S, x, y, e)) continue;
        var id = y * L.w + x;
        if (dist[id] >= 0) continue;
        dist[id] = dist[c] + 1; prev[id] = c; q.push(id);
      }
    }
    return { dist: dist, prev: prev };
  }
  function advance(L, S, e, ev) {
    var sp0 = KINDS[e.t].speed;
    if (sp0 > 0) {
      var sp = spots(L, S, e), F = flood(L, S, e), best = -1, bd = 1e9;
      for (var i = 0; i < sp.length; i++) {
        var id = sp[i][1] * L.w + sp[i][0], dd = F.dist[id];
        if (dd >= 0 && dd < bd) { bd = dd; best = id; }
      }
      if (best >= 0 && bd > 0) {
        var path = [], c = best;
        while (c !== e.y * L.w + e.x) { path.push(c); c = F.prev[c]; }
        path.reverse();
        var go = path[Math.min(sp0, path.length) - 1], gx = go % L.w, gy = (go - gx) / L.w;
        ev.push({ k: "march", id: e.id, from: [e.x, e.y], to: [gx, gy] });
        e.x = gx; e.y = gy;
      }
    }
    aim(L, S, e);
    ev.push({ k: "aim", id: e.id, d: e.d, r: e.r });
  }

  // the whole enemy turn: strikes in order, then everyone left moves and takes aim
  function enemyTurn(L, S) {
    var ev = [], order = S.en.slice();
    for (var i = 0; i < order.length; i++) {
      var e = order[i];
      if (e.hp <= 0) continue;
      strike(L, S, e, ev);
      if (S.hp <= 0) break;
    }
    sweepDead(S);
    if (S.hp > 0 && !won(S)) {
      for (var j = 0; j < S.en.length; j++) advance(L, S, S.en[j], ev);
      S.round++;
      S.ap = S.apMax;
      if (S.cd) for (var k in S.cd) if (S.cd[k] > 0) S.cd[k]--;
    }
    return ev;
  }
  // what the coming strikes will do if you end the round now (for the warnings on screen)
  function forecast(L, S) {
    var C = clone(S), ev = [], order = C.en.slice();
    for (var i = 0; i < order.length; i++) { if (order[i].hp > 0) strike(L, C, order[i], ev); }
    var hurts = 0, deaths = [];
    ev.forEach(function (x) { if (x.k === "hurt") hurts++; if (x.k === "die") deaths.push(x.id); });
    return { hurts: hurts, deaths: deaths, events: ev };
  }

  var API = { DX: DX, DY: DY, KINDS: KINDS, TRICKS: TRICKS, parse: parse, tile: tile, start: start, clone: clone, unitAt: unitAt,
    won: won, key: key, step: step, trick: trick, strikeTiles: strikeTiles, enemyTurn: enemyTurn, forecast: forecast,
    spots: spots, aim: aim };
  if (typeof module !== "undefined" && module.exports) module.exports = API;
  else root.STILL = API;
})(this);

</script>

      cx.strokeStyle = "rgba(220,215,200," + (0.05 - k * 0.012) + ")"; cx.lineWidth = 6 - k * 1.5;
      cx.beginPath();
      for (var yy = H; yy > 0; yy -= 8) { var xx = 40 + k * 14 + Math.sin(yy * 0.018 + now * 0.7 + k) * (18 + (H - yy) * 0.03); if (yy === H) cx.moveTo(xx, yy); else cx.lineTo(xx, yy); }
      cx.stroke();
    }
  }
  function drawTitle() {
    backdrop(250, 150);
    var t = now;
    text("STILLHAND", W / 2, 128, 64, COL.text, "center", 900);
    text("Never strike. Let them hit each other.", W / 2, 180, 18, COL.gold, "center", 600);
    // a little scene on a loop: two Brutes wind up, you step out from between them, they punch each other
    var cy0 = 292, ph = (t % 3) / 3, duck = ph > 0.35 && ph < 0.85 ? Math.min(1, (ph - 0.35) * 8) : ph >= 0.85 ? Math.max(0, 1 - (ph - 0.85) * 8) : 0;
    var lunge = ph > 0.5 && ph < 0.7 ? Math.sin((ph - 0.5) / 0.2 * Math.PI) : 0;
    for (var gx = -3; gx <= 3; gx++) { cx.fillStyle = (gx + 7) % 2 ? "rgba(42,48,59,0.35)" : "rgba(30,34,42,0.35)"; cx.fillRect(W / 2 + gx * 56 - 28, cy0 - 28, 56, 56); cx.fillRect(W / 2 + gx * 56 - 28, cy0 + 28, 56, 56); }
    [[-1, 1], [1, 3]].forEach(function (p) {
      cx.save(); cx.translate(W / 2 + p[0] * (112 - lunge * 44), cy0 + Math.sin(t * 3 + p[0]) * 2);
      cx.fillStyle = KCOL.B; rr(-22, -20, 44, 44, 10); cx.fill();
      cx.fillStyle = "rgba(20,16,14,0.85)"; cx.fillRect(-9 * p[0] - 3, -8, 6, 4); cx.fillRect(3 * p[0] - 3, -8, 6, 4);
      cx.rotate(p[1] * Math.PI / 2); cx.fillStyle = "#ffe3d8"; cx.beginPath(); cx.moveTo(0, -36); cx.lineTo(-10, -24); cx.lineTo(10, -24); cx.closePath(); cx.fill();
      cx.restore();
    });
    if (lunge > 0.9) { cx.fillStyle = "rgba(255,90,80,0.5)"; cx.beginPath(); cx.arc(W / 2, cy0, 26, 0, 7); cx.fill(); text("-2", W / 2 - 40, cy0 - 30, 18, COL.gold, "center", 900); text("-2", W / 2 + 40, cy0 - 30, 18, COL.gold, "center", 900); }
    var hy = cy0 + duck * 56;
    cx.fillStyle = "rgba(0,0,0,0.35)"; cx.beginPath(); cx.ellipse(W / 2, hy + 22, 22, 7, 0, 0, 7); cx.fill();
    cx.fillStyle = COL.hero; cx.beginPath(); cx.arc(W / 2, hy + 4, 22, 0, 7); cx.fill();
    cx.fillStyle = "#c9b994"; cx.fillRect(W / 2 - 21, hy + 5, 42, 5);
    cx.fillStyle = "#f6efe2"; cx.beginPath(); cx.arc(W / 2, hy - 14, 11, 0, 7); cx.fill();
    cx.beginPath(); cx.arc(W / 2 - 22, hy + 2, 6, 0, 7); cx.arc(W / 2 + 22, hy + 2, 6, 0, 7); cx.fill();
    var y = 392;
    if (save.run) { button(170, y, 300, 56, "CONTINUE RUN", continueRun, { sub: "floor " + (save.run.n + 1) + " · score " + save.run.score, col: COL.gold }); y += 68; }
    button(170, y, 300, 56, save.run ? "NEW RUN" : "START A RUN", function () { newRun((Math.random() * 4294967296) >>> 0, DEMO ? 0 : titleVow, false); }); y += 68;
    
    button(170, y, 300, 50, "HOW TO PLAY", function () { screen = "help"; helpPage = 0; }); y += 62;
    text("Best " + save.best + "  ·  Runs " + save.runs + (DEMO ? "" : "  ·  Wins " + save.wins), W / 2, H - 70, 14, COL.dim, "center", 600);
    text("FREE DEMO · ACT I", W / 2, H - 44, 13, COL.gold, "center", 700);
    button(W - 64, H - 56, 48, 40, muted ? "♪×" : "♪", function () { muted = !muted; try { localStorage.setItem("still.mute", muted ? "1" : "0"); } catch (e) {} }, { size: 16 });
  }

  var HELP = [
    ["You never strike.", "Step with the arrow keys, WASD or a swipe. Step into an enemy to shove it one tile. You get two actions a round, then press END."],
    ["Red tiles get hit.", "When you end the round, every enemy strikes the tiles marked in red, in the numbered order. Then they move and aim again."],
    ["Strikes travel with their owner.", "An enemy's strike is fixed to its body. Shove a Brute one tile and its punch lands one tile over - maybe on another enemy."],
    ["Other ways to win.", "Shoved into a pillar, the wall or another enemy: 1 damage. Into a pit: gone. A green ring means that enemy will die this round."],
    ["Every floor is proven.", "A program checked every possible line of play: each floor can be cleared without being hit once, using only steps and shoves. PAR is the fewest rounds that takes."],
    ["The incense burns.", "Each floor gives you par plus a few rounds of incense. Once it is out, every round costs a heart. Undo anything until you end the round."],
    [DEMO ? "A run is five floors here." : "A run is fifteen floors.", "Clear a floor to choose a trick or a blessing. Lose every heart and the run is over."]
  ];
  function drawHelp() {
    backdrop(-400, 10);
    function leave() { screen = run && helpFromPlay ? "play" : "title"; helpFromPlay = false; }
    if (helpPage === 0) {
      text("HOW TO PLAY", W / 2, 50, 26, COL.text, "center", 900);
      var y = 100;
      HELP.forEach(function (h) { text(h[0], 40, y, 18, COL.gold, "left", 800); y = wrap(h[1], 40, y + 26, W - 80, 15, COL.text, 20, "left") + 12; });
      button(60, H - 76, 240, 52, "ENEMIES  >", function () { helpPage = 1; sfx("tick"); });
      button(340, H - 76, 240, 52, "BACK", leave);
      return;
    }
    text("ENEMIES", W / 2, 50, 26, COL.text, "center", 900);
    var kinds = DEMO ? ["B", "A"] : ["B", "A", "R", "M", "W", "K"], yy = 110;
    kinds.forEach(function (k) {
      cx.save(); cx.translate(70, yy + 14); cx.scale(0.9, 0.9); drawEnemyIcon(k); cx.restore();
      text(C.KINDS[k].name + "  ·  " + C.KINDS[k].hp + " HP" + (C.KINDS[k].speed ? "  ·  moves " + C.KINDS[k].speed : ""), 120, yy, 17, KCOL[k], "left", 800);
      wrap(C.KINDS[k].blurb, 120, yy + 24, W - 160, 14, COL.text, 18, "left");
      yy += 84;
    });
    if (DEMO) text("Four more enemies wait in Acts II and III of the full game.", W / 2, yy + 10, 14, COL.dim, "center", 600);
    text("Keys: arrows / WASD step · Space ends the round · Z undo · 1-3 tricks", W / 2, H - 112, 13, COL.dim, "center", 600);
    button(60, H - 76, 240, 52, "<  RULES", function () { helpPage = 0; sfx("tick"); });
    button(340, H - 76, 240, 52, "BACK", leave);
  }
  var helpFromPlay = false;
  function drawEnemyIcon(t) { drawEnemyShape(t); }
  function drawEnemyShape(t) {
    cx.fillStyle = KCOL[t];
    if (t === "B") { rr(-22, -20, 44, 44, 10); cx.fill(); }
    else if (t === "A") { cx.beginPath(); cx.moveTo(0, -24); cx.lineTo(22, 20); cx.lineTo(-22, 20); cx.closePath(); cx.fill(); }
    else if (t === "R") { cx.beginPath(); cx.ellipse(0, 2, 26, 21, 0, 0, 7); cx.fill(); }
    else if (t === "M") { cx.beginPath(); for (var i = 0; i < 6; i++) { var a = i * Math.PI / 3 + Math.PI / 6; cx.lineTo(Math.cos(a) * 24, Math.sin(a) * 24 + 2); } cx.closePath(); cx.fill(); }
    else if (t === "W") { cx.beginPath(); cx.moveTo(0, -24); cx.lineTo(24, 2); cx.lineTo(0, 26); cx.lineTo(-24, 2); cx.closePath(); cx.fill(); }
    else if (t === "K") { rr(-24, -22, 48, 48, 4); cx.fill(); }
  }

  function drawReward() {
    backdrop(-400, 10);
    var est = 110 + (result ? result.lines.length * 26 + (result.mult > 1 ? 26 : 0) + 50 : 0) + (run.n % FLOORS_PER_ACT === 0 ? 34 : 0) + 22 + 290;
    var top = Math.max(0, Math.floor((H - est) / 2));
    cx.save(); cx.translate(0, top);
    text("FLOOR CLEARED", W / 2, 60, 30, COL.text, "center", 900);
    var y = 110;
    if (result) {
      result.lines.forEach(function (l) { text(l[0], 150, y, 16, COL.text, "left", 600); text("+" + l[1], W - 150, y, 16, COL.gold, "right", 700); y += 26; });
      if (result.mult > 1) { text("Vow bonus", 150, y, 16, COL.text, "left", 600); text("x" + result.mult.toFixed(1), W - 150, y, 16, COL.gold, "right", 700); y += 26; }
      text("Score " + run.score, W / 2, y + 12, 20, COL.gold, "center", 800); y += 50;
    }
    var lastAct = run.n % FLOORS_PER_ACT === 0;
    if (lastAct) { text("ACT " + ROMAN[actOf(run.n)] + " BEGINS" + (run.vow < 2 ? " · HEARTS RESTORED" : ""), W / 2, y, 15, COL.good, "center", 800); y += 34; }
    text("Choose one", W / 2, y, 16, COL.dim, "center", 700); y += 22;
    var n = offers.length, cw = 186, gap = 14, x0 = (W - (n * cw + (n - 1) * gap)) / 2;
    offers.forEach(function (o, i) {
      var x = x0 + i * (cw + gap), def = o.kind === "trick" ? C.TRICKS[o.id] : PASSIVES[o.id];
      var hot = hover && hover.x >= x && hover.x <= x + cw && hover.y >= y + top && hover.y <= y + top + 250;
      rr(x, y, cw, 250, 14); cx.fillStyle = hot ? "#2c3240" : "#232833"; cx.fill();
      cx.strokeStyle = o.kind === "trick" ? COL.gold : "#6aa6c8"; cx.lineWidth = 2; cx.stroke();
      text(o.kind === "trick" ? "TRICK" : "BLESSING", x + cw / 2, y + 24, 12, o.kind === "trick" ? COL.gold : "#8cc4e4", "center", 800);
      text(def.name, x + cw / 2, y + 58, 22, COL.text, "center", 800);
      wrap(def.blurb, x + cw / 2, y + 100, cw - 26, 14, COL.text, 19, "center");
      if (o.kind === "trick") text("1 action · recharge " + def.cd, x + cw / 2, y + 222, 12, COL.dim, "center", 600);
      text("[" + (i + 1) + "]", x + cw / 2, y + 240, 11, COL.dim, "center", 600);
      (function (ii) { buttons.push({ x: x, y: y + top, w: cw, h: 250, fn: function () { takeOffer(ii); } }); })(i);
    });
    y += 270;
    text("Hearts " + run.hp + "/" + run.maxhp + "   ·   Tricks " + (run.tricks.length ? run.tricks.map(function (t) { return C.TRICKS[t].name; }).join(", ") : "none"), W / 2, y + 10, 13, COL.dim, "center", 600);
    cx.restore();
  }

  function drawOver() {
    backdrop(250, 92);
    var f = result.final;
    text(f.win ? "THE TEMPLE IS STILL" : "YOUR HANDS FALL", W / 2, 120, 32, f.win ? COL.gold : COL.text, "center", 900);
    text(f.win ? "Run complete" + (f.vow ? " under the " + VOWS[f.vow].name : "") : "Reached floor " + (f.floors + 1) + " of " + (ACTS * FLOORS_PER_ACT), W / 2, 162, 16, COL.dim, "center", 600);
    text(String(f.score), W / 2, 250, 64, COL.gold, "center", 900);
    text(f.newBest ? "NEW BEST" : "best " + save.best, W / 2, 300, 15, f.newBest ? COL.good : COL.dim, "center", 800);
    text("Floors unhurt " + f.flawless + "   ·   At par " + f.atPar + "   ·   Misdirected kills " + run.misdirect, W / 2, 350, 14, COL.text, "center", 600);
    if (f.daily) text("Daily run " + run.seed + " · today's best " + save.daily[String(run.seed)], W / 2, 380, 14, COL.dim, "center", 600);
    if (f.unlocked) text("Unlocked: " + VOWS[save.vow].name + " - " + VOWS[save.vow].blurb, W / 2, 410, 14, COL.good, "center", 700);
    button(170, 470, 300, 56, "NEW RUN", function () { newRun((Math.random() * 4294967296) >>> 0, DEMO ? 0 : titleVow, false); });
    button(170, 538, 300, 50, "TITLE", function () { screen = "title"; });
  }
  
  function drawDemoEnd() {
    backdrop(110, 90);
    text("ACT I CLEARED", W / 2, 110, 34, COL.gold, "center", 900);
    text("Demo complete · score " + result.final.score + (result.final.newBest ? " (new best)" : ""), W / 2, 152, 16, COL.dim, "center", 600);
    var y = 210;
    ["The full game goes on:", "- Acts II and III: fifteen floors a run",
     "- Rams, Mortars, Wardens and Anchors", "- Six tricks and six blessings to build a run around",
     "- Five Vows that make each win harder", "- A Daily run with the same floors for everyone",
     "- 120 floors, every one proven clearable unhurt"].forEach(function (s, i) {
      text(s, i ? 120 : W / 2, y, i ? 16 : 18, i ? COL.text : COL.gold, i ? "left" : "center", i ? 600 : 800); y += i ? 30 : 40;
    });
    button(140, y + 30, 360, 64, "GET THE FULL GAME", function () { window.open(STORE_URL, "_blank"); }, { col: COL.gold, size: 20 });
    button(170, y + 110, 300, 50, "PLAY AGAIN", function () { newRun((Math.random() * 4294967296) >>> 0, 0, false); });
    button(170, y + 172, 300, 46, "TITLE", function () { screen = "title"; });
  }
  

  // ---------------- main loop ----------------
  var last = 0;
  function frame(ts) {
    var dt = Math.min(0.05, (ts - last) / 1000 || 0); last = ts; now = ts / 1000;
    stepAnim(dt);
    flashes = flashes.filter(function (f) { f.life -= dt; return f.life > 0; });
    pops = pops.filter(function (p) { p.life -= dt; return p.life > 0; });
    if (shake) shake = Math.max(0, shake - dt * 40);
    if (msgT > 0) msgT -= dt;
    if (banner) { banner.t -= dt; if (banner.t <= 0) banner = null; }
    draw();
    requestAnimationFrame(frame);
  }
  function draw() {
    cx.setTransform(dpr * scale, 0, 0, dpr * scale, 0, 0);
    cx.fillStyle = COL.bg; cx.fillRect(0, 0, W, H);
    buttons = [];
    if (screen === "title") drawTitle();
    else if (screen === "play") drawPlay();
    else if (screen === "help") drawHelp();
    else if (screen === "reward") drawReward();
    else if (screen === "over") drawOver();
    else if (screen === "demoend") drawDemoEnd();
    if (screen === "play") {
      button(W - 170, 76, 70, 36, "?", function () { helpFromPlay = true; helpPage = 0; screen = "help"; }, { size: 16 });
      button(W - 92, 76, 70, 36, "MENU", function () { screen = "title"; }, { size: 13 });
    }
  }
  function resize() {
    var vw = window.innerWidth, vh = window.innerHeight;
    scale = Math.min(vw / W, vh / H);
    dpr = window.devicePixelRatio || 1;
    cv.style.width = Math.floor(W * scale) + "px"; cv.style.height = Math.floor(H * scale) + "px";
    cv.width = Math.floor(W * scale * dpr); cv.height = Math.floor(H * scale * dpr);
  }
  window.addEventListener("resize", resize);
  resize();

  // ---------------- input ----------------
  function toLocal(ev) { var r = cv.getBoundingClientRect(); return { x: (ev.clientX - r.left) / r.width * W, y: (ev.clientY - r.top) / r.height * H }; }
  var down = null;
  cv.addEventListener("pointerdown", function (ev) { audio(); cv.focus(); down = toLocal(ev); down.t = performance.now(); ev.preventDefault(); });
  cv.addEventListener("pointermove", function (ev) { hover = toLocal(ev); });
  cv.addEventListener("pointerleave", function () { hover = null; });
  cv.addEventListener("pointerup", function (ev) {
    if (!down) return;
    var p = toLocal(ev), dx = p.x - down.x, dy = p.y - down.y, start = down;
    down = null;
    var onBoard = screen === "play" && start.x >= BX && start.x < BX + L.w * T && start.y >= BY && start.y < BY + L.h * T;
    if (onBoard && Math.max(Math.abs(dx), Math.abs(dy)) > 28) {
      act(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 1 : 3) : (dy > 0 ? 2 : 0));
      return;
    }
    for (var i = buttons.length - 1; i >= 0; i--) {
      var b = buttons[i];
      if (p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h) { if (b.fn) b.fn(); return; }
    }
    if (onBoard) {
      var gx = Math.floor((p.x - BX) / T), gy = Math.floor((p.y - BY) / T), ddx = gx - S.hx, ddy = gy - S.hy;
      if (Math.abs(ddx) + Math.abs(ddy) === 1) { act(ddx === 1 ? 1 : ddx === -1 ? 3 : ddy === 1 ? 2 : 0); return; }
      var u = C.unitAt(S, gx, gy);
      infoEnemy = u && u !== "hero" ? u : null;
      if (trickSel && (gx === S.hx || gy === S.hy) && !(gx === S.hx && gy === S.hy)) act(gx > S.hx ? 1 : gx < S.hx ? 3 : gy > S.hy ? 2 : 0);
    }
  });
  window.addEventListener("keydown", function (ev) {
    audio();
    var k = ev.key, dir = { ArrowUp: 0, ArrowRight: 1, ArrowDown: 2, ArrowLeft: 3, w: 0, d: 1, s: 2, a: 3, W: 0, D: 1, S: 2, A: 3 }[k];
    if (screen === "play") {
      if (dir !== undefined) { act(dir); ev.preventDefault(); return; }
      if (k === " " || k === "Enter") { endRound(); ev.preventDefault(); return; }
      if (k === "z" || k === "Z" || k === "Backspace" || k === "u") { doUndo(); ev.preventDefault(); return; }
      if (k === "1" || k === "2" || k === "3") { trickButton(+k - 1); return; }
      if (k === "Escape") { if (trickSel) trickSel = null; else screen = "title"; return; }
    } else if (screen === "reward") {
      if (k === "1" || k === "2" || k === "3") takeOffer(+k - 1);
    } else if (screen === "title") {
      if (k === "Enter" || k === " ") { if (save.run) continueRun(); else newRun((Math.random() * 4294967296) >>> 0, DEMO ? 0 : titleVow, false); ev.preventDefault(); }
    } else if (screen === "help") {
      if (k === "ArrowRight" || k === "ArrowLeft") { helpPage = 1 - helpPage; return; }
      if (k === "Escape" || k === "Enter" || k === " ") { screen = run && helpFromPlay ? "play" : "title"; helpFromPlay = false; ev.preventDefault(); }
    } else if (screen === "over") {
      if (k === "Enter" || k === " ") { newRun((Math.random() * 4294967296) >>> 0, DEMO ? 0 : titleVow, false); ev.preventDefault(); }
    }
  });

  // hooks for automated checks and the store capture
  window.STILL_APP = {
    state: function () { return { screen: screen, S: S, run: run, offers: offers, anim: !!anim, floor: floorInfo, result: result }; },
    newRun: function (seed, vow, daily) { newRun(seed >>> 0, vow || 0, !!daily); },
    move: act, end: endRound, undo: doUndo, trick: function (i) { trickButton(i); }, take: takeOffer,
    title: function () { screen = "title"; }, help: function (pg) { helpPage = pg || 0; screen = "help"; },
    idle: function () { return !anim; },
    fx: function () { return pops.map(function (p) { return p.text; }); },
    setRun: function (patch) { for (var k in patch) run[k] = patch[k]; startFloor(); }
  };
  requestAnimationFrame(frame);
})();
</script>
</body>
