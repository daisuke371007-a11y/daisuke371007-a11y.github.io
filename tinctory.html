<script>
// paint.js — TINCTORY: a paint is a ratio of five pigments. Mixing two paints 1:1 averages them.
// A paint is stored as five whole parts out of 256 (so eight mixes deep is exact).
(function (root) {
  "use strict";
  var D = 256;
  var PIG = [
    { key: "R", name: "Red", rgb: [214, 40, 40] },
    { key: "Y", name: "Yellow", rgb: [250, 205, 30] },
    { key: "B", name: "Blue", rgb: [30, 80, 200] },
    { key: "W", name: "White", rgb: [250, 248, 240] },
    { key: "K", name: "Black", rgb: [28, 26, 30] }
  ];
  function primary(i) { var p = [0, 0, 0, 0, 0]; p[i] = D; return p; }
  // from parts like {R:3, Y:1} to the stored form
  function ratio(parts) {
    var v = PIG.map(function (p) { return parts[p.key] || 0; }), s = v.reduce(function (a, b) { return a + b; }, 0);
    var out = v.map(function (x) { return x * D / s; });
    if (out.some(function (x) { return x % 1; })) throw new Error("ratio is not a mix of halves: " + JSON.stringify(parts));
    return out;
  }
  function mix(a, b) {
    var out = [], odd = false;
    for (var i = 0; i < 5; i++) { var s = a[i] + b[i]; if (s % 2) odd = true; out.push(s >> 1); }
    if (odd) { // deeper than the paint can hold: keep the total exact
      var tot = out.reduce(function (x, y) { return x + y; }, 0), i2 = out.indexOf(Math.max.apply(null, out));
      out[i2] += D - tot;
    }
    return out;
  }
  function key(c) { return c.join(","); }
  function same(a, b) { for (var i = 0; i < 5; i++) if (a[i] !== b[i]) return false; return true; }
  // how many halvings deep the ratio is (a primary is 0, 1:1 is 1, 3:1 is 2 ...)
  function depth(c) {
    var d = 0;
    for (var i = 0; i < 5; i++) { if (!c[i]) continue; var x = c[i], k = 8; while (x % 2 === 0 && k > 0) { x /= 2; k--; } d = Math.max(d, k); }
    return d;
  }
  function pigments(c) { var n = 0; for (var i = 0; i < 5; i++) if (c[i]) n++; return n; }
  // sale price of one unit: richer, finer mixes are worth more
  function value(c) { return pigments(c) * Math.pow(2, depth(c)); }
  function parts(c) {
    var g = 0;
    function gcd(a, b) { return b ? gcd(b, a % b) : a; }
    c.forEach(function (x) { if (x) g = g ? gcd(g, x) : x; });
    var out = [];
    c.forEach(function (x, i) { if (x) out.push((x / g) + " " + PIG[i].name); });
    return out.join(" : ");
  }
  function short(c) {
    var g = 0;
    function gcd(a, b) { return b ? gcd(b, a % b) : a; }
    c.forEach(function (x) { if (x) g = g ? gcd(g, x) : x; });
    var out = "";
    c.forEach(function (x, i) { if (x) out += (x / g > 1 ? x / g : "") + PIG[i].key; });
    return out;
  }

  // what the paint looks like: red-yellow-blue as a painter's wheel, then white and black stirred in
  function ryb2rgb(r, y, b) {
    // trilinear interpolation over the RYB cube (after Gossett and Chen)
    var C = [[1, 1, 1], [1, 1, 0], [1, 0, 0], [1, 0.5, 0], [0.163, 0.373, 0.6], [0.0, 0.66, 0.2], [0.5, 0, 0.5], [0.2, 0.094, 0]];
    function lerp(a, b, t) { return a + (b - a) * t; }
    var out = [];
    for (var k = 0; k < 3; k++) {
      var c000 = C[0][k], c001 = C[4][k], c010 = C[1][k], c011 = C[5][k], c100 = C[2][k], c101 = C[6][k], c110 = C[3][k], c111 = C[7][k];
      var x0 = lerp(lerp(c000, c001, b), lerp(c010, c011, b), y), x1 = lerp(lerp(c100, c101, b), lerp(c110, c111, b), y);
      out.push(lerp(x0, x1, r));
    }
    return out;
  }
  var rgbCache = {};
  function rgb(c) {
    var k0 = key(c);
    if (rgbCache[k0]) return rgbCache[k0];
    var r = c[0] / D, y = c[1] / D, b = c[2] / D, w = c[3] / D, k = c[4] / D, hue = r + y + b, col;
    if (hue > 0) {
      var m = Math.max(r, y, b), base = ryb2rgb(r / m, y / m, b / m);
      // a pure pigment should look like the pigment
      col = base.map(function (v) { return v * 255; });
      if (pigments([c[0], c[1], c[2], 0, 0]) === 1) col = PIG[c[0] ? 0 : c[1] ? 1 : 2].rgb.slice();
    } else col = [128, 128, 128];
    var white = [250, 248, 240], black = [28, 26, 30], kw = k * 2.2;   // black is strong: it darkens more than its share
    var out = col.map(function (v, i) { return (v * hue + white[i] * w + black[i] * kw) / (hue + w + kw); });
    rgbCache[k0] = out.map(function (v) { return Math.round(Math.max(0, Math.min(255, v))); });
    return rgbCache[k0];
  }
  function css(c) { var v = rgb(c); return "rgb(" + v[0] + "," + v[1] + "," + v[2] + ")"; }

  var api = { D: D, PIG: PIG, primary: primary, ratio: ratio, mix: mix, key: key, same: same, depth: depth, pigments: pigments, value: value, parts: parts, short: short, rgb: rgb, css: css };
  if (typeof module !== "undefined" && module.exports) module.exports = api;
  else root.PAINT = api;
})(this);

</script>
<script>
// content.js — TINCTORY: the map, the buildings, the commissions, the research.
(function (root) {
  "use strict";
  var P = typeof module !== "undefined" && module.exports ? require("./paint.js") : root.PAINT;
  var MW = 40, MH = 24, PW = 10, PH = 8;   // map and plot sizes in tiles

  // wells: pigment index at a tile. Plots are 10x8; the middle two are yours from the start.
  var WELLS = [
    { x: 12, y: 10, p: 0 }, { x: 13, y: 14, p: 1 }, { x: 27, y: 10, p: 2 },              // start: red, yellow, blue
    { x: 3, y: 11, p: 0 }, { x: 6, y: 13, p: 1 },                                          // west
    { x: 33, y: 13, p: 2 }, { x: 36, y: 10, p: 0 },                                        // east
    { x: 14, y: 3, p: 3 }, { x: 25, y: 5, p: 1 },                                          // north middle: white
    { x: 24, y: 19, p: 4 }, { x: 16, y: 20, p: 2 },                                        // south middle: black
    { x: 4, y: 3, p: 3 }, { x: 35, y: 4, p: 4 }, { x: 5, y: 20, p: 1 }, { x: 34, y: 19, p: 0 },  // corners
    { x: 8, y: 6, p: 2 }, { x: 31, y: 17, p: 3 }
  ];
  var HUB = { x: 19, y: 11, w: 3, h: 3 };
  // plots: column 0..3, row 0..2. price, and the commission tier that opens them for sale
  var PLOTS = [
    { c: 1, r: 1, price: 0 }, { c: 2, r: 1, price: 0 },
    { c: 0, r: 1, price: 150, tier: 1 }, { c: 3, r: 1, price: 400, tier: 1 },
    { c: 1, r: 0, price: 900, tier: 2 }, { c: 2, r: 2, price: 900, tier: 2 },
    { c: 2, r: 0, price: 3000, tier: 3 }, { c: 1, r: 2, price: 3000, tier: 3 },
    { c: 0, r: 0, price: 12000, tier: 4 }, { c: 3, r: 2, price: 12000, tier: 4 },
    { c: 3, r: 0, price: 40000, tier: 5 }, { c: 0, r: 2, price: 40000, tier: 5 }
  ];

  // buildings: cost, the tier they unlock at
  var BUILD = {
    belt: { name: "Belt", cost: 2, tier: 0, key: "1", desc: "Carries paint one way. Drag to lay a line." },
    pump: { name: "Pump", cost: 25, tier: 0, key: "2", desc: "Sits on a well and pumps its pigment out the front." },
    mixer: { name: "Mixer", cost: 60, tier: 1, key: "3", desc: "Takes one paint from its left and one from its right, mixes them 1:1, and sends two out the front." },
    splitter: { name: "Splitter", cost: 30, tier: 2, key: "4", desc: "Takes paint from behind and sends it left and right in turn." },
    merger: { name: "Merger", cost: 30, tier: 2, key: "5", desc: "Takes paint from behind, left and right; sends it all out the front." },
    bridge: { name: "Bridge", cost: 20, tier: 3, key: "6", desc: "Lets two lines cross: paint goes straight through, either way." },
    drain: { name: "Drain", cost: 10, tier: 2, key: "7", desc: "Pours away any paint it is given." }
  };
  var BUILD_ORDER = ["belt", "pump", "mixer", "splitter", "merger", "bridge", "drain"];

  // commissions: each tier is a set of orders; finishing a tier pays out and opens the next
  function o(id, name, parts, need) { return { id: id, name: name, color: P.ratio(parts), need: need }; }
  var TIERS = [
    { name: "First Pours", reward: 60, desc: "Pump pigment to the hub.", orders: [o("RED", "Red", { R: 1 }, 20), o("YELLOW", "Yellow", { Y: 1 }, 20), o("BLUE", "Blue", { B: 1 }, 20)] },
    { name: "Secondaries", reward: 300, desc: "Mixers blend two paints 1:1.", orders: [o("ORANGE", "Orange", { R: 1, Y: 1 }, 40), o("GREEN", "Green", { Y: 1, B: 1 }, 40), o("VIOLET", "Violet", { R: 1, B: 1 }, 40)] },
    { name: "Light and Dark", reward: 1500, desc: "White to lighten, black to darken. Buy land to reach their wells.", orders: [o("PINK", "Pink", { R: 1, W: 1 }, 60), o("SKY", "Sky", { B: 1, W: 1 }, 60), o("MAROON", "Maroon", { R: 1, K: 1 }, 60), o("NAVY", "Navy", { B: 1, K: 1 }, 60)] },
    
  ];
  var ORDERS = [];
  TIERS.forEach(function (t, i) { t.orders.forEach(function (x) { x.tier = i; ORDERS.push(x); }); });

  // research: levels, cost of level 1 and growth per level
  var RESEARCH = [
    { id: "PUMP", name: "Stronger Pumps", desc: "Pumps work 35% faster.", max: 12, base: 150, grow: 2.4, tier: 1 },
    { id: "BELT", name: "Faster Belts", desc: "Belts run 30% faster.", max: 8, base: 200, grow: 2.6, tier: 1 },
    { id: "MIXER", name: "Quick Mixers", desc: "Mixers work 35% faster.", max: 12, base: 400, grow: 2.4, tier: 2 },
    { id: "PRICE", name: "Better Buyers", desc: "Paint sells for 25% more.", max: 15, base: 300, grow: 2.2, tier: 1 },
    { id: "ORDERS", name: "Commission Fees", desc: "Paint that fills an order pays 50% more.", max: 8, base: 1200, grow: 2.8, tier: 2 },
    { id: "IDLE", name: "Night Shift", desc: "Earn 10% more of your income while away (starts at 20%).", max: 6, base: 2000, grow: 2.5, tier: 3 },
    { id: "LAND", name: "Surveyor", desc: "Land costs 15% less.", max: 3, base: 1500, grow: 3, tier: 2 }
  ];
  var RES = {}; RESEARCH.forEach(function (r) { RES[r.id] = r; });

  var api = { MW: MW, MH: MH, PW: PW, PH: PH, WELLS: WELLS, HUB: HUB, PLOTS: PLOTS, BUILD: BUILD, BUILD_ORDER: BUILD_ORDER, TIERS: TIERS, ORDERS: ORDERS, RESEARCH: RESEARCH, RES: RES };

<script>
// sim.js — TINCTORY: the factory floor. Tiles, belts, pumps, mixers, splitters, mergers, bridges, drains, the hub;
// money, commissions, research, land, saving and earnings while away. Pure logic: the page, the tests and the
// balance runs all use it.
(function (root) {
  "use strict";
  var node = typeof module !== "undefined" && module.exports;
  var P = node ? require("./paint.js") : root.PAINT, C = node ? require("./content.js") : root.CONTENT;
  var DX = [1, 0, -1, 0], DY = [0, 1, 0, -1];      // 0 east, 1 south, 2 west, 3 north
  function opp(d) { return (d + 2) & 3; }

  // --- a new factory (sandbox: any size, no land, pumps anywhere with a chosen pigment) ---
  function newGame(opts) {
    opts = opts || {};
    var W = opts.w || C.MW, H = opts.h || C.MH;
    var g = { v: 1, w: W, h: H, sandbox: !!opts.sandbox, demo: !!opts.demo, cells: new Array(W * H), wells: {}, money: opts.money === undefined ? 80 : opts.money,
      tier: 0, delivered: {}, res: {}, plots: {}, time: 0, earned: 0, rate: 0, rateLog: [], stats: { sold: 0, made: 0, mixes: 0 }, events: [], done: false, hub: null };
    for (var i = 0; i < W * H; i++) g.cells[i] = null;
    if (!g.sandbox) {
      C.WELLS.forEach(function (w) { g.wells[w.y * W + w.x] = w.p; });
      C.PLOTS.forEach(function (p) { if (!p.price) g.plots[p.c + "," + p.r] = 1; });
      placeHub(g, C.HUB.x, C.HUB.y);
    }
    return g;
  }
  function placeHub(g, x, y) {
    g.hub = { x: x, y: y, w: 3, h: 3 };
    for (var j = 0; j < 3; j++) for (var i = 0; i < 3; i++) g.cells[(y + j) * g.w + x + i] = { t: "hub", d: 0 };
  }
  function at(g, x, y) { return x < 0 || y < 0 || x >= g.w || y >= g.h ? undefined : g.cells[y * g.w + x]; }
  function inBounds(g, x, y) { return x >= 0 && y >= 0 && x < g.w && y < g.h; }
  function owned(g, x, y) {
    if (g.sandbox) return inBounds(g, x, y);
    if (!inBounds(g, x, y)) return false;
    return !!g.plots[Math.floor(x / C.PW) + "," + Math.floor(y / C.PH)];
  }
  function well(g, x, y) { var w = g.wells[y * g.w + x]; return w === undefined ? -1 : w; }
  function unlocked(g, type) { return g.sandbox || (C.BUILD[type].tier <= g.tier && (!g.demo || C.BUILD[type].tier <= 2)); }

  // --- building ---
  function canPlace(g, type, x, y) {
    if (!owned(g, x, y)) return "you don't own this land";
    var c = at(g, x, y);
    if (c && c.t === "hub") return "the hub is here";
    if (!unlocked(g, type)) return "not unlocked yet";
    if (type === "pump" && well(g, x, y) < 0 && !g.sandbox) return "pumps go on wells";
    if (type !== "pump" && well(g, x, y) >= 0 && !g.sandbox) return "keep wells for pumps";
    return null;
  }
  function cost(g, type) { return g.sandbox ? 0 : C.BUILD[type].cost; }
  function place(g, type, x, y, d, pig) {
    var why = canPlace(g, type, x, y);
    if (why) return why;
    var old = at(g, x, y), refund = old ? cost(g, old.t) : 0;
    if (old && old.t === type && old.d === d) return "already there";
    if (g.money + refund < cost(g, type)) return "not enough money";
    g.money += refund - cost(g, type);
    var c = { t: type, d: d & 3 };
    if (type === "pump") { c.p = g.sandbox ? (pig || 0) : well(g, x, y); c.timer = 0; c.out = null; }
    if (type === "mixer") { c.a = null; c.b = null; c.out = []; c.timer = 0; }
    if (type === "splitter") { c.item = null; c.turn = 0; }
    if (type === "merger") { c.item = null; }
    if (type === "bridge") { c.h = null; c.v = null; }
    if (type === "belt") { c.item = null; }
    g.cells[y * g.w + x] = c;
    return null;
  }
  function remove(g, x, y) {
    var c = at(g, x, y);
    if (!c || c.t === "hub") return false;
    g.money += cost(g, c.t);
    g.cells[y * g.w + x] = null;
    return true;
  }
  function rotate(g, x, y) { var c = at(g, x, y); if (!c || c.t === "hub") return false; c.d = (c.d + 1) & 3; return true; }

  // --- research and land ---
  function lv(g, id) { return g.res[id] || 0; }
  function resCost(g, id) { var r = C.RES[id], l = lv(g, id); return l >= r.max ? Infinity : Math.round(r.base * Math.pow(r.grow, l)); }
  function canResearch(g, id) { var r = C.RES[id]; return (g.sandbox || g.tier >= r.tier) && lv(g, id) < r.max && g.money >= resCost(g, id); }
  function research(g, id) { if (!canResearch(g, id)) return false; g.money -= resCost(g, id); g.res[id] = lv(g, id) + 1; return true; }
  function rates(g) {
    return { pump: 1.4 / Math.pow(1.35, lv(g, "PUMP")), belt: 2.2 * (1 + 0.3 * lv(g, "BELT")), mixer: 1.6 / Math.pow(1.35, lv(g, "MIXER")),
      price: 1 + 0.25 * lv(g, "PRICE"), order: 2 * (1 + 0.5 * lv(g, "ORDERS")), idle: 0.2 + 0.1 * lv(g, "IDLE"), land: Math.pow(0.85, lv(g, "LAND")) };
  }
  function plotPrice(g, p) { return Math.round(p.price * rates(g).land); }
  function plotOpen(g, p) { return !g.plots[p.c + "," + p.r] && g.tier >= (p.tier || 0) && (!g.demo || (p.tier || 0) <= 2); }
  function buyPlot(g, c, r) {
    var p = C.PLOTS.filter(function (q) { return q.c === c && q.r === r; })[0];
    if (!p || !plotOpen(g, p) || g.money < plotPrice(g, p)) return false;
    g.money -= plotPrice(g, p); g.plots[c + "," + r] = 1;
    return true;
  }

  // --- orders ---
  function tierDef(g) { return C.TIERS[g.tier]; }
  function openOrders(g) { var t = tierDef(g); return t ? t.orders.filter(function (o) { return (g.delivered[o.id] || 0) < o.need; }) : []; }
  function tierDone(g) { var t = tierDef(g); return t && t.orders.every(function (o) { return (g.delivered[o.id] || 0) >= o.need; }); }
  function sell(g, c) {
    var r = rates(g), v = P.value(c) * r.price, hit = null;
    var t = tierDef(g);
    if (t) t.orders.forEach(function (o) { if (!hit && P.same(o.color, c) && (g.delivered[o.id] || 0) < o.need) hit = o; });
    if (hit) { g.delivered[hit.id] = (g.delivered[hit.id] || 0) + 1; v *= r.order; }
    g.money += v; g.earned += v; g.stats.sold++;
    g.events.push({ e: "sold", c: c, v: v, order: hit ? hit.id : null });
    if (hit && tierDone(g)) {
      var reward = t.reward;
      g.money += reward; g.earned += reward;
      g.events.push({ e: "tier", tier: g.tier, reward: reward });
      g.tier++;
      if (g.tier >= C.TIERS.length) { g.done = true; g.events.push({ e: "done" }); }
    }
  }

  // --- moving paint ---
  // can the building at (x, y) take this paint arriving from direction `from` (the side it comes in on)?
  function accept(g, x, y, from, item, commit) {
    var c = at(g, x, y);
    if (!c) return false;
    switch (c.t) {
      case "belt":
        if (c.item || from === c.d) return false;
        if (commit) c.item = { c: item, p: 0, from: from, moved: true };
        return true;
      case "mixer":
        var right = (c.d + 1) & 3, left = (c.d + 3) & 3;
        if (from === right && !c.a) { if (commit) c.a = item; return true; }
        if (from === left && !c.b) { if (commit) c.b = item; return true; }
        return false;
      case "splitter":
        if (from !== opp(c.d) || c.item) return false;
        if (commit) { c.item = item; c.fresh = true; }
        return true;
      case "merger":
        if (from === c.d || c.item) return false;
        if (commit) { c.item = item; c.fresh = true; }
        return true;
      case "bridge":
        var lane = from & 1 ? "v" : "h";
        if (c[lane]) return false;
        if (commit) c[lane] = { c: item, dir: opp(from), p: 0 };
        return true;
      case "drain":
        if (commit) g.events.push({ e: "drained", x: x, y: y });
        return true;
      case "hub":
        if (commit) sell(g, item);
        return true;
    }
    return false;
  }
  // hand a paint from (x, y) out towards direction d
  function push(g, x, y, d, item) {
    var nx = x + DX[d], ny = y + DY[d];
    if (!accept(g, nx, ny, opp(d), item, false)) return false;
    accept(g, nx, ny, opp(d), item, true);
    return true;
  }

  function step(g, dt) {
    var r = rates(g), W = g.w, H = g.h;
    g.time += dt;
    if (!g.sandbox && g.money < C.BUILD.pump.cost + 10 && !g.cells.some(function (c) { return c && c.t === "pump"; })) { g.money = C.BUILD.pump.cost + 10; g.events.push({ e: "grant" }); }
    for (var y = 0; y < H; y++) for (var x = 0; x < W; x++) {
      var c = g.cells[y * W + x];
      if (!c) continue;
      switch (c.t) {
        case "belt":
          if (!c.item) break;
          if (c.item.p < 1) c.item.p = Math.min(1, c.item.p + r.belt * dt);
          if (c.item.p >= 1 && !c.item.moved && push(g, x, y, c.d, c.item.c)) c.item = null;
          break;
        case "pump":
          if (c.out) { if (push(g, x, y, c.d, c.out)) c.out = null; else break; }
          c.timer += dt;
          if (c.timer >= r.pump) { c.timer = 0; c.out = P.primary(c.p); g.stats.made++; if (push(g, x, y, c.d, c.out)) c.out = null; }
          break;
        case "mixer":
          if (c.out.length) { if (push(g, x, y, c.d, c.out[0])) c.out.shift(); break; }
          if (c.a && c.b) {
            c.timer += dt;
            if (c.timer >= r.mixer) { var m = P.mix(c.a, c.b); c.out = [m, m]; c.a = c.b = null; c.timer = 0; g.stats.mixes++; g.events.push({ e: "mixed", x: x, y: y, c: m }); }
          }
          break;
        case "splitter":
          if (!c.item || c.fresh) break;
          var sides = [(c.d + 3) & 3, (c.d + 1) & 3];
          for (var k = 0; k < 2; k++) { var sd = sides[(c.turn + k) % 2]; if (push(g, x, y, sd, c.item)) { c.item = null; c.turn = (c.turn + k + 1) % 2; break; } }

    tierModal.t += dt;
    var t = C.TIERS[tierModal.tier], next = C.TIERS[tierModal.tier + 1];
    cx.fillStyle = "rgba(15,12,9,0.6)"; cx.fillRect(0, 0, W, H);
    var x = 390, y = 200, w = 500, h = 340;
    rr(x, y, w, h, 16); cx.fillStyle = COL.panel; cx.fill(); cx.strokeStyle = COL.gold; cx.lineWidth = 2; cx.stroke();
    text(tierModal.tier === C.TIERS.length - 1 && !DEMO ? "THE MASTERPIECE IS FINISHED" : "COMMISSION COMPLETE", x + w / 2, y + 40, 14, COL.dim, "center", 800);
    text(t.name, x + w / 2, y + 78, 30, COL.gold, "center", 700, SERIF);
    text("+" + money(tierModal.reward), x + w / 2, y + 122, 26, COL.good, "center", 800);
    var un = C.BUILD_ORDER.filter(function (k) { return C.BUILD[k].tier === tierModal.tier + 1; }).map(function (k) { return C.BUILD[k].name; });
    var lines = [];
    if (un.length) lines.push("New: " + un.join(", "));
    var land = C.PLOTS.filter(function (p) { return p.tier === tierModal.tier + 1; }).length;
    if (land) lines.push("New land for sale: " + land + " plot" + (land > 1 ? "s" : ""));
    var res = C.RESEARCH.filter(function (r) { return r.tier === tierModal.tier + 1; }).map(function (r) { return r.name; });
    if (res.length) lines.push("Research: " + res.join(", "));
    if (next) lines.push("Next: " + next.name);
    if (DEMO && !next) lines = ["That was the last commission in the demo."];
    lines.forEach(function (l, i) { text(l, x + w / 2, y + 170 + i * 26, 15, COL.text, "center", 600); });
    var last = DEMO && tierModal.tier >= 2;
    if (tierModal.t > 0.8) button(x + w / 2 - 90, y + h - 64, 180, 44, last ? "CONTINUE" : "BACK TO WORK", function () { tierModal = null; if (last) panel = "demoend"; }, { primary: true, size: 15 });
  }
  
  function drawDemoEnd() {
    cx.fillStyle = "rgba(15,12,9,0.85)"; cx.fillRect(0, 0, W, H);
    text("THE DEMO ENDS HERE", W / 2, 200, 36, COL.gold, "center", 700, SERIF);
    var y = wrap("You finished the first three commissions. The full game has five more: uneven ratios, earth tones, fine shades, four-pigment paints and the Masterpiece - with bridges, the rest of the land, and every research level.", W / 2, 270, 720, 18, COL.text, 28, 600, "center");
    text("Your factory keeps running here; it just can't take new commissions.", W / 2, y + 20, 15, COL.dim, "center", 600);
    button(W / 2 - 160, y + 60, 320, 56, "GET THE FULL GAME", openStore, { primary: true, size: 18 });
    button(W / 2 - 90, y + 132, 180, 44, "KEEP PLAYING", function () { panel = null; }, { size: 14 });
  }
  function openStore() { try { window.open(STORE_URL, "_blank", "noopener"); } catch (e) {} }
  
  var awayModal = null;
  function drawAway() {
    cx.fillStyle = "rgba(15,12,9,0.6)"; cx.fillRect(0, 0, W, H);
    var x = 440, y = 260, w = 400, h = 220;
    rr(x, y, w, h, 16); cx.fillStyle = COL.panel; cx.fill(); cx.strokeStyle = COL.gold; cx.lineWidth = 2; cx.stroke();
    text("WHILE YOU WERE AWAY", x + w / 2, y + 40, 14, COL.dim, "center", 800);
    text("+" + money(awayModal.m), x + w / 2, y + 90, 34, COL.good, "center", 800);
    var hrs = awayModal.s / 3600;
    text(hrs >= 1 ? hrs.toFixed(1) + " hours" : Math.round(awayModal.s / 60) + " minutes", x + w / 2, y + 128, 14, COL.dim, "center", 600);
    button(x + w / 2 - 70, y + h - 60, 140, 42, "NICE", function () { awayModal = null; }, { primary: true, size: 15 });
  }

  // title
  var screen = "title", titleT = 0, titleG = null;
  function drawTitle(dt) {
    titleT += dt;
    cx.fillStyle = COL.bg; cx.fillRect(0, 0, W, H);
    // a little factory running behind the title
    if (!titleG) titleG = makeTitleFactory();
    for (var i = 0; i < 2; i++) { S.step(titleG.g, dt / 2); titleG.g.events.length = 0; }
    var keepG = g; g = titleG.g; var mx0 = MX, my0 = MY;
    MX = Math.round(W / 2 - g.w * TS / 2); MY = 410;
    rr(MX - 10, MY - 10, g.w * TS + 20, g.h * TS + 20, 10); cx.fillStyle = "#4a3e31"; cx.fill();
    for (var y = 0; y < g.h; y++) for (var x = 0; x < g.w; x++) { cx.fillStyle = (x + y) % 2 ? COL.ground : COL.ground2; cx.fillRect(tx(x), ty(y), TS, TS); }
    beltPhase += dt;
    drawBuildings();
    g = keepG; MX = mx0; MY = my0;
    logo(W / 2 - 250, 150, 2.4);
    text("Mix paint by the part. Build the factory that makes it.", W / 2, 230, 21, COL.dim, "center", 600, SERIF);
    text("FREE DEMO · the first three commissions", W / 2, 262, 14, COL.gold, "center", 800);
    button(W / 2 - 150, 300, 300, 56, hasSave ? "CONTINUE" : "START", function () { start(); }, { primary: true, size: 19 });
    if (hasSave) button(W / 2 - 150, 366, 300, 34, confirmNew ? "Click again to wipe your factory" : "NEW FACTORY", function () { if (!confirmNew) { confirmNew = true; return; } g = S.newGame({ demo: DEMO }); hasSave = false; confirmNew = false; away = 0; persist(); start(); }, { size: 12, fill: confirmNew ? "#6a2e26" : null });
    button(W / 2 - 150, H - 70, 300, 40, "GET THE FULL GAME", openStore, { size: 14 });
  }
  var confirmNew = false;
  function makeTitleFactory() {
    var t = S.newGame({ sandbox: true, w: 20, h: 8, money: 0 });
    S.placeHub(t, 9, 0);
    // orange from below, sky from the left, maroon from the right
    var plan = [["belt", 10, 3, 3], ["mixer", 10, 4, 3], ["belt", 9, 4, 0], ["belt", 8, 4, 0], ["belt", 7, 4, 0], ["belt", 7, 5, 3], ["pump", 7, 6, 3, 0],
      ["belt", 11, 4, 2], ["belt", 12, 4, 2], ["belt", 13, 4, 2], ["belt", 13, 5, 3], ["pump", 13, 6, 3, 1],
      ["belt", 8, 1, 0], ["belt", 7, 1, 0], ["mixer", 6, 1, 0], ["pump", 6, 0, 1, 2], ["belt", 6, 2, 3], ["belt", 6, 3, 3], ["pump", 6, 4, 3, 3],
      ["belt", 12, 1, 2], ["belt", 13, 1, 2], ["mixer", 14, 1, 2], ["pump", 14, 0, 1, 4], ["belt", 14, 2, 3], ["belt", 14, 3, 3], ["pump", 14, 4, 3, 0]];
    plan.forEach(function (p) { var err = S.place(t, p[0], p[1], p[2], p[3], p[4]); if (err) console.warn("title factory", err, p); });
    return { g: t };
  }
  function start() {
    audio(); screen = "game";
    if (away > 30) { var m = S.offline(g, away); if (m > 0) awayModal = { m: m, s: away }; away = 0; }
    if (!settings.seenHelp) { panel = "help"; helpPage = 0; }
  }

  // ---------------- main loop ----------------
  var lastT = performance.now();
  function frame(now) {
    var dt = Math.min(0.1, (now - lastT) / 1000); lastT = now;
    buttons = []; toolTip = null;
    cx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
    cx.fillStyle = COL.bg; cx.fillRect(0, 0, W, H);
    musicTick();
    if (screen === "title") { drawTitle(dt); requestAnimationFrame(frame); return; }
    if (!tierModal && !awayModal && panel !== "demoend") update(dt);
    hoverTile = tileAt(mouse);
    drawTop();
    drawGround();
    drawBuildings();
    drawGhost();
    drawFlyers(dt);
    drawOrders();
    drawToolbar();
    drawRecipe();
    if (!panel) drawHoverInfo();
    if (toolTip) { var t = toolTip; rr(t.x, t.y - 74, 300, 70, 8); cx.fillStyle = "rgba(29,24,19,0.95)"; cx.fill(); cx.strokeStyle = COL.line; cx.stroke(); text(t.title, t.x + 12, t.y - 58, 14, COL.gold, "left", 700); wrap(t.body, t.x + 12, t.y - 38, 276, 12, COL.text, 15, 600); }
    drawMsg(dt);
    if (panel === "research") drawResearch();
    if (panel === "help") drawHelp();
    if (panel === "demoend") drawDemoEnd();
    if (tierModal) drawTierModal(dt);
    if (awayModal) drawAway();
    requestAnimationFrame(frame);
  }
  function resize() {
    var vw = window.innerWidth, vh = window.innerHeight;
    scale = Math.min(vw / W, vh / H); dpr = window.devicePixelRatio || 1;
    cv.style.width = Math.floor(W * scale) + "px"; cv.style.height = Math.floor(H * scale) + "px";
    cv.width = Math.floor(W * scale * dpr); cv.height = Math.floor(H * scale * dpr);
  }
  window.addEventListener("resize", resize); resize();
  function local(e) { var r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H }; }
  cv.addEventListener("contextmenu", function (e) { e.preventDefault(); });
  cv.addEventListener("pointermove", function (e) { var m = local(e); mouse.x = m.x; mouse.y = m.y; if (screen === "game" && !panel && !tierModal && !awayModal) pointerMoveMap(m); });
  cv.addEventListener("pointerdown", function (e) {
    var m = local(e); mouse.x = m.x; mouse.y = m.y; mouse.down = true; mouse.right = e.button === 2;
    cv.focus(); audio();
    for (var i = buttons.length - 1; i >= 0; i--) { var b = buttons[i]; if (m.x >= b.x && m.x <= b.x + b.w && m.y >= b.y && m.y <= b.y + b.h) { b.fn(); return; } }
    if (screen === "game" && !panel && !tierModal && !awayModal) pointerDownMap(m);
  });
  window.addEventListener("pointerup", function () { mouse.down = false; mouse.right = false; dragPath = null; });
  window.addEventListener("keydown", function (e) {
    if (screen !== "game") return;
    var k = e.key.toLowerCase();
    if (k === "r") { if (!tool && hoverTile && S.rotate(g, hoverTile.x, hoverTile.y)) { sfx("place"); saveT = 2; } else dir = (dir + 1) & 3; }
    else if (k === "escape" || k === "q") { tool = null; panel = panel === "demoend" ? panel : null; recipeFor = null; }
    else if (k === "x") setTool("x");
    else C.BUILD_ORDER.forEach(function (b) { if (C.BUILD[b].key === k && S.unlocked(g, b)) setTool(b); });
  });
  window.addEventListener("beforeunload", function () { if (screen === "game") persist(); });

  // hooks for the screenshot tool and tests
  window.TINCTORY_APP = {
    edition: ED,
    game: function () { return g; },
    setGame: function (str) { g = S.load(str); hasSave = true; },
    start: function () { start(); },
    screen: function () { return screen; },
    tool: function (t, d) { tool = t; if (d !== undefined) dir = d; },
    hover: function (x, y) { mouse.x = x; mouse.y = y; },
    panel: function (p) { panel = p; },
    recipe: function (id) { recipeFor = id; },
    run: function (seconds) { for (var t = 0; t < seconds; t += STEP) { S.step(g, STEP); g.events.forEach(function (e) { if (e.e === "tier") tierModal = null; }); g.events.length = 0; } },
    speed: function (v) { speed = v; },
    settings: settings
  };
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
